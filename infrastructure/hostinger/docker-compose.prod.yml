name: sales-travel

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

services:
  caddy:
    image: caddy:2-alpine
    <<: [*restart, *logging]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      - api
      - web-b2b

  postgres:
    image: timescale/timescaledb-ha:pg16
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: sales_travel
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sales_travel']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/nipko/sales-travel-migrate:${IMAGE_TAG:-latest}
    <<: *logging
    restart: 'no'
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PGDATABASE: sales_travel
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/nipko/sales-travel-api:${IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_VERSION: ${IMAGE_TAG:-dev}
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: app_user
      PGPASSWORD: ${APP_USER_PASSWORD}
      PGDATABASE: sales_travel
      JWT_SECRET: ${JWT_SECRET}
      # BYOC: clave maestra AES-256-GCM para cifrar credenciales de proveedor (base64 de 32 bytes).
      PROVIDER_CREDENTIALS_KEY: ${PROVIDER_CREDENTIALS_KEY:-}
      LATAM_API_URL: ${LATAM_API_URL:-https://sandbox.api.latam.com}
      LATAM_API_KEY: ${LATAM_API_KEY:-}
      LATAM_API_SECRET: ${LATAM_API_SECRET:-}
      LATAM_AGENCY_ID: ${LATAM_AGENCY_ID:-}
      LATAM_AGENCY_IATA: ${LATAM_AGENCY_IATA:-}
      LATAM_AGENCY_NAME: ${LATAM_AGENCY_NAME:-}
      LATAM_TRAVEL_AGENT_ID: ${LATAM_TRAVEL_AGENT_ID:-}
      LATAM_COUNTRY: ${LATAM_COUNTRY:-}
      LATAM_FORCE_MOCK: ${LATAM_FORCE_MOCK:-false}
      # Notificaciones por email: URL del panel (link de verificación) + SMTP por defecto del
      # sistema (fallback cuando una agencia no configura su propio correo / BYO-email).
      APP_WEB_URL: ${APP_WEB_URL:-https://app.planetour.cloud}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PlaneTour}
    networks: [edge, internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web-b2b:
    image: ghcr.io/nipko/sales-travel-web-b2b:${IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      PORT: '3001'
      NEXT_PUBLIC_API_URL: https://api.planetour.cloud
      INTERNAL_API_URL: http://api:3000
    networks: [edge, internal]
    depends_on:
      - api
