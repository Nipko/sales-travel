name: Build & publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: nipko
  IMAGE_PREFIX: sales-travel

jobs:
  build:
    name: Build & push ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        app:
          - { name: api,     dockerfile: apps/api/Dockerfile }
          - { name: web-b2b, dockerfile: apps/web-b2b/Dockerfile }
          - { name: migrate, dockerfile: tools/db-migrate/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}:latest
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  notify-portainer:
    name: Trigger Portainer redeploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.PORTAINER_WEBHOOK_ENABLED == 'true'
    steps:
      - name: Hit Portainer webhook
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
