name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de imagen a desplegar (sha o vX.Y.Z). Vacío = HEAD actual.'
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: nipko
  IMAGE_PREFIX: sales-travel
  STACK_DIR: /opt/sales-travel

jobs:
  build:
    name: Build & push ${{ matrix.app.name }}
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        app:
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: web-b2b, dockerfile: apps/web-b2b/Dockerfile }
          - { name: migrate, dockerfile: tools/db-migrate/Dockerfile }
          - { name: seed-superadmin, dockerfile: tools/seed-superadmin/Dockerfile }
          - { name: sync-airports, dockerfile: tools/sync-airports/Dockerfile }
          - { name: sync-hotel-inventory, dockerfile: tools/sync-hotel-inventory/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}"
          TAGS="$IMG:${{ github.sha }}"$'\n'"$IMG:latest"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            TAGS="$TAGS"$'\n'"$IMG:${{ github.ref_name }}"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  deploy:
    name: Deploy to VPS
    needs: [build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '22' }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: img
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST="${{ secrets.HOSTINGER_HOST }}"
          echo "Runner egress IP: $(curl -4 -s --max-time 10 ifconfig.me || echo unknown)"
          echo "TCP probe → $HOST:$SSH_PORT"
          nc -vz -w 15 "$HOST" "$SSH_PORT" || echo "::warning::TCP probe to $HOST:$SSH_PORT failed"
          # known_hosts best-effort: las conexiones reales usan StrictHostKeyChecking=accept-new,
          # así que un fallo de keyscan NO bloquea el deploy (antes lo hacía).
          ssh-keyscan -T 15 -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts \
            || echo "::warning::ssh-keyscan failed (se continúa con accept-new)"

      - name: Render .env
        run: |
          umask 077
          cat > .env <<EOF
          IMAGE_TAG=${{ steps.img.outputs.tag }}
          POSTGRES_ADMIN_PASSWORD=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          APP_USER_PASSWORD=${{ secrets.APP_USER_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PROVIDER_CREDENTIALS_KEY=${{ secrets.PROVIDER_CREDENTIALS_KEY }}
          LATAM_API_URL=${{ vars.LATAM_API_URL || secrets.LATAM_API_URL || 'https://sandbox.api.latam.com' }}
          LATAM_API_KEY=${{ secrets.LATAM_API_KEY || vars.LATAM_API_KEY }}
          LATAM_API_SECRET=${{ secrets.LATAM_API_SECRET || vars.LATAM_API_SECRET }}
          LATAM_AGENCY_ID=${{ secrets.LATAM_AGENCY_ID || vars.LATAM_AGENCY_ID }}
          LATAM_AGENCY_IATA=${{ secrets.LATAM_AGENCY_IATA || vars.LATAM_AGENCY_IATA }}
          LATAM_AGENCY_NAME=${{ vars.LATAM_AGENCY_NAME || secrets.LATAM_AGENCY_NAME }}
          LATAM_TRAVEL_AGENT_ID=${{ secrets.LATAM_TRAVEL_AGENT_ID || vars.LATAM_TRAVEL_AGENT_ID }}
          LATAM_COUNTRY=${{ vars.LATAM_COUNTRY || secrets.LATAM_COUNTRY }}
          LATAM_FORCE_MOCK=${{ vars.LATAM_FORCE_MOCK || 'false' }}
          DESPEGAR_API_KEY=${{ secrets.DESPEGAR_API_KEY || vars.DESPEGAR_API_KEY }}
          DESPEGAR_BASE_URL=${{ vars.DESPEGAR_BASE_URL || 'https://api-dev.despegar.com/v3' }}
          DESPEGAR_LANGUAGE=${{ vars.DESPEGAR_LANGUAGE || 'ES' }}
          DESPEGAR_COUNTRY=${{ vars.DESPEGAR_COUNTRY }}
          DESPEGAR_CURRENCY=${{ vars.DESPEGAR_CURRENCY }}
          DESPEGAR_LOCALE=${{ vars.DESPEGAR_LOCALE }}
          AGENT_CARS_ACCESS_TOKEN=${{ secrets.AGENT_CARS_ACCESS_TOKEN || vars.AGENT_CARS_ACCESS_TOKEN }}
          AGENT_CARS_BASE_URL=${{ vars.AGENT_CARS_BASE_URL || 'https://api.dev.agentcars.com/v2/sites' }}
          AGENT_CARS_SUGGEST_URL=${{ vars.AGENT_CARS_SUGGEST_URL || 'https://suggest.agentcars.com/suggest' }}
          AGENT_CARS_SOURCE=${{ vars.AGENT_CARS_SOURCE }}
          AGENT_CARS_LANGUAGE=${{ vars.AGENT_CARS_LANGUAGE }}
          APP_WEB_URL=${{ vars.APP_WEB_URL || 'https://app.planetour.cloud' }}
          MAIL_HOST=${{ vars.MAIL_HOST || secrets.MAIL_HOST }}
          MAIL_PORT=${{ vars.MAIL_PORT || '587' }}
          MAIL_SECURE=${{ vars.MAIL_SECURE || 'false' }}
          MAIL_USER=${{ secrets.MAIL_USER || vars.MAIL_USER }}
          MAIL_PASS=${{ secrets.MAIL_PASS }}
          MAIL_FROM=${{ vars.MAIL_FROM || secrets.MAIL_FROM }}
          MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME || 'PlaneTour' }}
          EOF

      - name: Sync stack files
        run: |
          ssh -p "$SSH_PORT" $SSH_OPTS "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "mkdir -p ${{ env.STACK_DIR }}"
          rsync -az --delete -e "ssh -p $SSH_PORT $SSH_OPTS" \
            infrastructure/hostinger/docker-compose.prod.yml \
            infrastructure/hostinger/Caddyfile \
            infrastructure/hostinger/postgres-init \
            .env \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ env.STACK_DIR }}/"

      - name: Pull & up
        run: |
          ssh -p "$SSH_PORT" $SSH_OPTS "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" bash -s <<'BASH'
            set -euo pipefail
            cd /opt/sales-travel
            mv -f docker-compose.prod.yml docker-compose.yml 2>/dev/null || true
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f --filter "until=168h"
          BASH

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://api.planetour.cloud/api/health; then
              echo
              echo "✓ smoke test passed (tag=${{ steps.img.outputs.tag }})"
              exit 0
            fi
            echo "waiting for api... ($i/6)"
            sleep 10
          done
          echo "✗ smoke test failed — chequear logs en el VPS"
          exit 1
