name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de imagen a desplegar (sha o vX.Y.Z). Vacío = HEAD actual.'
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: nipko
  IMAGE_PREFIX: sales-travel
  STACK_DIR: /opt/sales-travel

jobs:
  build:
    name: Build & push ${{ matrix.app.name }}
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        app:
          - { name: api,              dockerfile: apps/api/Dockerfile }
          - { name: web-b2b,          dockerfile: apps/web-b2b/Dockerfile }
          - { name: migrate,          dockerfile: tools/db-migrate/Dockerfile }
          - { name: seed-superadmin,  dockerfile: tools/seed-superadmin/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}"
          TAGS="$IMG:${{ github.sha }}"$'\n'"$IMG:latest"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            TAGS="$TAGS"$'\n'"$IMG:${{ github.ref_name }}"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  deploy:
    name: Deploy to VPS
    needs: [build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: img
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "$SSH_PORT" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render .env
        run: |
          umask 077
          cat > .env <<EOF
          IMAGE_TAG=${{ steps.img.outputs.tag }}
          POSTGRES_ADMIN_PASSWORD=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          APP_USER_PASSWORD=${{ secrets.APP_USER_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF

      - name: Sync stack files
        run: |
          ssh -p "$SSH_PORT" "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "mkdir -p ${{ env.STACK_DIR }}"
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            infrastructure/hostinger/docker-compose.prod.yml \
            infrastructure/hostinger/Caddyfile \
            infrastructure/hostinger/postgres-init \
            .env \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ env.STACK_DIR }}/"

      - name: Pull & up
        run: |
          ssh -p "$SSH_PORT" "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" bash -s <<'BASH'
            set -euo pipefail
            cd /opt/sales-travel
            mv -f docker-compose.prod.yml docker-compose.yml 2>/dev/null || true
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f --filter "until=168h"
          BASH

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://api.planetour.cloud/api/health; then
              echo
              echo "✓ smoke test passed (tag=${{ steps.img.outputs.tag }})"
              exit 0
            fi
            echo "waiting for api... ($i/6)"
            sleep 10
          done
          echo "✗ smoke test failed — chequear logs en el VPS"
          exit 1
