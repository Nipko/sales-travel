name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: nipko
  IMAGE_PREFIX: sales-travel

jobs:
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        app:
          - { name: api,     dockerfile: apps/api/Dockerfile }
          - { name: web-b2b, dockerfile: apps/web-b2b/Dockerfile }
          - { name: migrate, dockerfile: tools/db-migrate/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.app.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}:latest
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  deploy:
    name: Deploy to VPS
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Render .env
        run: |
          cat > .env <<EOF
          GIT_SHA=${{ github.sha }}
          POSTGRES_ADMIN_PASSWORD=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          APP_USER_PASSWORD=${{ secrets.APP_USER_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF

      - name: Sync compose stack + migrations
        run: |
          rsync -az --delete \
            infrastructure/hostinger/docker-compose.prod.yml \
            infrastructure/hostinger/Caddyfile \
            infrastructure/hostinger/postgres-init \
            .env \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:/opt/sales-travel/
          rsync -az --delete \
            db/migrations \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:/opt/sales-travel/db/

      - name: Pull & restart
        run: |
          ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} bash -s <<'EOF'
            set -euo pipefail
            cd /opt/sales-travel
            mv docker-compose.prod.yml docker-compose.yml 2>/dev/null || true
            export $(grep -v '^#' .env | xargs)
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Smoke test
        run: |
          sleep 15
          curl -fsS --max-time 10 https://api.parallext.cloud/api/health || \
            (echo "Smoke test failed"; exit 1)
