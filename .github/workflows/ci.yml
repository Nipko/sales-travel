name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales_travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sales_travel
      APP_USER_PASSWORD: app_user_ci_pw
      MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
      # Clave de prueba (base64 de 32 bytes) para el cipher de credenciales/PII en los tests.
      PROVIDER_CREDENTIALS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Vitest resuelve los paquetes del workspace por su `dist`; hay que buildearlos.
      - name: Build workspace deps for tests
        run: pnpm --filter "@sales-travel/api^..." build

      # `providers/sabre` se buildea aparte porque TODAVÍA no es dependencia de `apps/api`, así que
      # el filtro `^...` de arriba no lo alcanza (verificado: 0 coincidencias).
      #
      # Sin este paso su `dist/` no existe en el job de tests, y los dos guards del artefacto
      # —`dist-artifact.guard.test.ts` y `dist-surface.guard.test.ts`— son
      # `describe.skipIf(!existsSync(DIST_DIR))`: se SALTAN en silencio y el CI queda verde sin
      # haberlos corrido. El primero de ellos es justo el que atrapa la reserva fantasma de la
      # ronda 2 —un `dist/` rancio que devolvía `{ ok: true }` para un sobre con `errors[]`—, o sea
      # que el guard del incidente sería el único que nunca se ejecuta. Es el mismo patrón que la
      # nota de las PG* de más abajo: verde por omisión no es verde.
      #
      # Se puede borrar cuando `apps/api` declare la dependencia y el filtro lo cubra solo.
      - name: Build sabre (sus guards de artefacto se saltan sin dist/)
        run: pnpm --filter @sales-travel/sabre build

      - name: Create extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sales_travel -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS unaccent;
          SQL

      - name: Run migrations
        run: pnpm --filter @sales-travel/db-migrate dev

      # `turbo run test` cubre todo paquete con script test (antes sólo corría el filtro
      # de la API, así que los tests de web-b2b no se ejecutaban en ninguna parte).
      #
      # OJO: turbo FILTRA el entorno. Las variables PG* van declaradas en la tarea `test`
      # de turbo.json; si se quitan de ahí, el guard `hasDb` de los tests de integración
      # da false y TODOS se saltan en silencio, dejando el CI en verde sin haber probado
      # el aislamiento entre tenants.
      - name: Integration + unit tests
        run: pnpm test
