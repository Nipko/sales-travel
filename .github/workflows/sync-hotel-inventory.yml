name: Sync Hotel Inventory

on:
  schedule:
    # 03:30 UTC todos los días (30 min después del sync de aeropuertos).
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync Despegar inventory → Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '22' }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10
    steps:
      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # known_hosts best-effort, como en deploy.yml: la conexión real usa accept-new, así que un
          # keyscan que no responde a tiempo no tumba el job.
          ssh-keyscan -T 15 -H -p "$SSH_PORT" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts \
            || echo "::warning::ssh-keyscan falló (se continúa con accept-new)"

      - name: Run sync container
        run: |
          ssh -p "$SSH_PORT" $SSH_OPTS "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" bash -s <<'BASH'
            set -euo pipefail
            cd /opt/sales-travel

            # No se hace `source .env`: deploy.yml lo escribe sin comillas, y un valor con espacios
            # (una contraseña de aplicación de correo, por ejemplo) se ejecuta como comando y el job
            # sale con 127 antes de sincronizar. Se leen sólo las claves que usa este job, literales.
            env_get() {
              local v
              v=$(grep -m1 -E "^$1=" .env | cut -d= -f2-) || true
              case "$v" in
                \'*\') v=${v#\'}; v=${v%\'} ;;
                \"*\") v=${v#\"}; v=${v%\"} ;;
              esac
              printf '%s' "$v"
            }
            POSTGRES_ADMIN_PASSWORD=$(env_get POSTGRES_ADMIN_PASSWORD)
            DESPEGAR_API_KEY=$(env_get DESPEGAR_API_KEY)
            DESPEGAR_BASE_URL=$(env_get DESPEGAR_BASE_URL)

            if [ -z "${DESPEGAR_API_KEY:-}" ]; then
              echo "DESPEGAR_API_KEY no configurado en .env — se omite el sync."
              exit 0
            fi

            docker pull ghcr.io/nipko/sales-travel-sync-hotel-inventory:latest

            # 2 redes: internal (Postgres) + edge (Internet, fetch Despegar).
            CID=$(docker create --network sales-travel_internal \
              -e PGHOST=postgres \
              -e PGPORT=5432 \
              -e PGUSER=postgres \
              -e PGPASSWORD="${POSTGRES_ADMIN_PASSWORD}" \
              -e PGDATABASE=sales_travel \
              -e DESPEGAR_API_KEY="${DESPEGAR_API_KEY}" \
              -e DESPEGAR_BASE_URL="${DESPEGAR_BASE_URL:-https://api-dev.despegar.com/v3}" \
              ghcr.io/nipko/sales-travel-sync-hotel-inventory:latest)

            docker network connect sales-travel_edge "$CID"
            docker start -a "$CID"
            EXIT=$(docker inspect "$CID" --format='{{.State.ExitCode}}')
            docker rm "$CID" >/dev/null
            exit "$EXIT"
          BASH
