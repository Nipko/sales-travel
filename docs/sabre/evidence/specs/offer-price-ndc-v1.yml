    UnusedTicketRequest:
      description: |
        ##### Scenario
        The *Unused Ticket* example demonstrates a use-case in which we wish for the value of an unused ticket to be taken into account when pricing a new offer.
        ##### Instruction
        For this type of request, we must include the following information:
        
        | Property | Description |
        | :--- | ---: |
        | `query.offerItemId` | The ID of an offer item selected from a shopping response. |
        | `query.passengerId` | The unique ID of a passenger. Should be the same as the one returned in an earlier shopping step. |
        | `passengers.id` | The unique ID of a passenger. Should be the same as the one returned in an earlier shopping step. |
        | `passengers.type` | The three-letter IATA-standard Passenger Type Code (PTC). |
        | `passengers.unusedTicketNumber` | The number of the unused ticket. |
