---
openapi: 3.0.3
x-lingo-api-type: rpc
info:
  title: Offer Price - NDC
  version: '1.5'
  description: >-
    The Offer Price API is a component of the Offer Management suite of APIs used by agencies to access NDC offers for airlines distributing their services through the Sabre system. This API is designed to provide the final price for a selected itinerary and prepare all data necessary for subsequent order creation.
tags:
  - name: offer-price-tn
    description: This endpoint is used to obtain offer pricing.
servers:
  - url: https://api.cert.platform.sabre.com/v1/offers
    description: Certification environment.
  - url: https://api.platform.sabre.com/v1/offers
    description: Production environment.
paths:
  /price:
    post:
      description: Creates the final price of an itinerary identifiable by its `offerItemId`.
      operationId: offerPrice
      tags:
        - offer-price-tn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferPriceRequestV1"
            examples:
              1. Basic Query:
                $ref: "#/components/examples/BasicRequest"
              2. Frequent Flyer:
                $ref: "#/components/examples/FrequentFlyerRequest"
              3. Unused Ticket:
                $ref: "#/components/examples/UnusedTicketRequest"

      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPriceResponseV1"
              examples:
                1.1 One-Way:
                  $ref: "#/components/examples/OneWayResponse"
                1.2 Round Trip:
                  $ref: "#/components/examples/RoundTripResponse"
                1.3 Multiple Passengers:
                  $ref: "#/components/examples/MultipaxResponse"
                2. Frequent Flyer:
                  $ref: "#/components/examples/FrequentFlyerResponse"
                3. Unused Ticket:
                  $ref: "#/components/examples/UnusedTicketResponse"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPriceResponseV1"
        "500":
          description: Internal service error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPriceResponseV1"

security:
  - oauth2_authentication: []

components:
  schemas:
    OfferPriceRequestV1:
      description: Contains information necessary to retrieve an offer and create a
        request to the data provider.
      type: object
      required:
        - query
      properties:
        payloadAttributes:
          $ref: "#/components/schemas/PayloadAttributes"
          description: Contains standard payload parameters.
        query:
          type: array
          description: Lists queries with offers to reprice.
          items:
            $ref: "#/components/schemas/Query"
            description: Contains a subset of offer item data to be processed together.
          minItems: 1
        passengers:
          type: array
          description: Lists passenger information.
          items:
            $ref: "#/components/schemas/Passenger"
          maxItems: 9
        params:
          $ref: "#/components/schemas/Params"
          description: Contains additional criteria to be taken into account during offer pricing.
        diags:
          type: array
          description: The diagnostic name.
          items:
            $ref: "#/components/schemas/AvailableDiagnosticsEnum"

    OfferPriceResponseV1:
      type: object
      description: Contains details of an offer proposed for the requested itinerary.
      anyOf:
        - required:
            - response
        - required:
            - messages
      required:
        - version
      properties:
        payloadAttributes:
          $ref: "#/components/schemas/PayloadAttributes"
          description: Contains standard payload parameters.
        messages:
          type: array
          description: Lists warnings, errors, and other types of messages generated by the system.
          items:
            $ref: "#/components/schemas/Message"
        id:
          type: string
          description: A unique ID of the pricing response.
          example: bejq23zanr1
          pattern: ^[a-zA-Z0-9]*$
        version:
          type: string
          description: The version of the response schema.
          example: v0.0.0
          pattern: ^v[0-9\.]*$
        response:
          $ref: "#/components/schemas/Response"
          description: Contains the main response body.
        diagnostics:
          type: array
          description: Lists the requested diagnostic content.
          items:
            $ref: "#/components/schemas/Diagnostic"

    PayloadAttributes:
      type: object
      description: Contains standard parameters used to process an offer price transaction.
      properties:
        timeStamp:
          type: string
          description: Timestamp when the request or response was sent, in ISO 8601 format.
          format: date-time
          example: 2024-10-03T12:48:52.968Z
        trxID:
          type: string
          description: A unique ID assigned to the transaction.
          example: b213e940-c89c-4dbb-96b1-d16a6c0249fb
          pattern: ^\S{1,100}$
        host:
          type: string
          description: The name of the server that processed the request.
          example: offer-price-tn-blue-6c5f854fd4-rmd8c
          readOnly: true
          pattern: ^[a-zA-Z0-9_-]{1,60}$
        baseline:
          type: string
          description: The identifier of application code release.
          example: offer-price-tn-456-20230911-133352-0.2.0-20230911.130813-8-45bfbc8
          readOnly: true
          pattern: ^[a-zA-Z0-9.\-_]{1,70}$
        additionalProperties:
          type: string
          description: Optional additional properties.
          example: >-
            TracingID: "123456"

    Query:
      type: object
      description: Contains a subset of offer item data to be processed together.
      required:
        - offerItemId
      properties:
        offerItemId:
          type: array
          description: Lists the IDs of offer items to be priced together.
          minItems: 1
          items:
            type: string
            description: The ID of an offer item.
            example: qwertyuion-1-1
            pattern: ^([a-zA-Z0-9]){1,30}(-[0-9]{1,10}){2}$
        passengerId:
          type: array
          description: Lists references to passenger information corresponding to the
            indicated set of offer items.
          items:
            type: string
            description: The `id` of a passenger.
            default: Passenger1
            example: Passenger1
            pattern: ^([\w-]){1,200}$
        formOfPayment:
          type: string
          description: The `id` of a form of payment.
          default: FOP1
          example: FormOfPayment_1
          pattern: ^(\S+)$

    Passenger:
      type: object
      description: Contains passenger information.
      required:
        - id
      properties:
        id:
          type: string
          description: The `passengerId` referenced in the `Query` object.
          example: Passenger1
          pattern: ^(\S+)$
        type:
          type: string
          description: The three-letter IATA-standard Passenger Type Code (PTC).
          example: ADT
          pattern: ^[A-Z]{1}[0-9A-Z]{2}$
        personName:
          $ref: "#/components/schemas/PersonName"
          description: Contains information about the name of the passenger.
        frequentFlyer:
          type: array
          description: Lists frequent flyer information of the passenger.
          items:
            $ref: "#/components/schemas/FrequentFlyer"
            description: Lists frequent flyer information of the passenger.
        unusedTicketNumber:
          type: string
          description: >-
            The number of an unused ticket whose value is expected to be used
            during pricing.  Can be either a 13-digit number without a check
            digit or a 14-digit number including a check digit.
          example: "00157446945530"
          pattern: ^[0-9]{13,14}$

    Params:
      type: object
      description: Contains additional criteria to be taken into account during offer
        pricing.
      properties:
        formOfPayment:
          type: array
          description: Lists information about the form of payment.
          maxItems: 1
          items:
            $ref: "#/components/schemas/FormOfPayment"
        accountCode:
          type: string
          description: The corporate account name or ID used to price special fares.
          pattern: ^([\w-]){1,30}$
          example: ACC01
        customQualifiers:
          type: object
          description: Contains carrier-specific qualifiers passed to external NDC suppliers.
          additionalProperties: true
          example:
            QCI:
              - "12345"
        allowBundles:
          description: If `true`, returns bundles in the response if the airline provides them.
          type: boolean
          default: false
      additionalProperties: false

    FormOfPayment:
      type: object
      description: Contains information about the form of payment.
      required:
        - subCode
      properties:
        id:
          type: string
          description: The ID of a form of payment. May be left empty if only one form of payment is provided.
          default: FOP1
          example: FOP1
          pattern: ^(\S){0,64}$
        subCode:
          type: string
          description: >-
            The IATA sub-code for a credit or debit card used as the form of
            payment.  If neither is used, the value can be `CA` for cash or `CK`
            for check.
          example: FDA
          pattern: ^([A-Z0-9]{3}|CA|CK)$
        cardType:
          type: string
          description: The two-letter payment card type.
          example: MC
          pattern: ^([A-Z]{2})$
        binNumber:
          type: string
          description: The first six to eight digits of a credit or debit card number.
          example: "545250"
          pattern: ^([0-9]{6,8})$

    PersonName:
      type: object
      description: Contains information about the name of the passenger.
      required:
        - surname
      properties:
        givenName:
          type: string
          description: The first name of the passenger.
          example: John
          pattern: ^\S+( \S+)*$
        surname:
          type: string
          description: The last name of the passenger.
          example: Smith
          pattern: ^\S+( \S+)*$

    AvailableDiagnosticsEnum:
      type: string
      description: >-
        Identifies the diagnostic label to help debug and
        troubleshoot processing errors. Each diagnostic provides
        information about processing in systems that this API communicates with.
      example: OFFER_STORE_GET_REQUEST
      enum:
        - OFFER_STORE_GET_REQUEST
        - OFFER_STORE_GET_RESPONSE
        - OFFER_STORE_ID_REQUEST
        - OFFER_STORE_ID_RESPONSE
        - OFFER_STORE_PUT_REQUEST
        - OFFER_STORE_PUT_RESPONSE
        - ESSM_JWT_REQUEST
        - ESSM_JWT_RESPONSE
        - ESSM_TJR_REQUEST
        - ESSM_TJR_RESPONSE
        - NDCC_OFFER_PRICE_REQUEST
        - NDCC_OFFER_PRICE_RESPONSE
        - SPR_REQUEST
        - SPR_RESPONSE

    Diagnostic:
      type: object
      description: Contains internal-use-only diagnostics to help debug and
        troubleshoot possible processing errors.
      properties:
        name:
          $ref: "#/components/schemas/AvailableDiagnosticsEnum"
          description: Contains dignostic's name.
        body:
          type: string
          description: The part of the request/response body the diagnostic applies to.
          example: OFFER_STORE_GET_REQUEST
        customId:
          type: string
          description: The ID used to differentiate between multiple responses and requests sent to or from
            one service.
          example: a0baa3a8-818f-4f1d-9afa-97a06b8e5fb2
        headers:
          type: object
          description: Contains technical details about the HTTP header used as part of
            service processing.
          additionalProperties:
            type: string
            description: Additional properties or parameters that can be appended to
              requested diagnostics.
            example: all
          example:
            Content-Type: application/json

    Response:
      type: object
      description: Contains priced offers.
      required:
        - offers
      properties:
        offers:
          type: array
          description: Lists priced offers.
          items:
            $ref: "#/components/schemas/Offer"

    Offer:
      type: object
      description: Contains details of a priced offer.
      required:
        - id
        - ttl
        - source
        - offerExpirationDateTime
        - offerItems
        - totalPrice
      properties:
        id:
          type: string
          description: The ID of the offer.
          example: bejq23zanr0-1
          pattern: ^[a-zA-Z0-9]+(-[0-9]+)$
        ttl:
          type: integer
          description: The offer's Time To Live (TTL) provided in seconds.
          example: 1200
        source:
          $ref: "#/components/schemas/Source"
          description: The data provider from whom the offer originates.
        offerExpirationDateTime:
          $ref: "#/components/schemas/DateTimeType"
          description: The date and time in ISO 8601 format when the offer is going to expire.
        paymentTimeLimitDateTime:
          $ref: "#/components/schemas/DateTimeType"
          description: The time limit to make a payment for the offer provided in ISO 8601 format.
        paymentTimeLimitText:
          type: string
          description: The time limit to make a payment for the offer provided in a free
            text format. Used in case external suppliers return data that does
            not match the required format.
          example: 2024-01-02T23:35
        purchaseTimeLimitDateTime:
          $ref: "#/components/schemas/DateTimeType"
          description: The time limit to purchase the offer provided in ISO 8601 format.
        commission:
          $ref: "#/components/schemas/Commission"
          description: Contains details of travel agency's commission.
        journeys:
          type: array
          description: Lists subsequent journeys (segment to leg associations).
          items:
            $ref: "#/components/schemas/Journey"
        voluntaryChangeInformation:
          description: Lists details of the fees and limitations related to voluntary changes.
          type: array
          items:
            $ref: "#/components/schemas/VoluntaryChangeInformation"
        penalties:
          type: array
          description: Lists penalties applicable upon exchanging or refunding a fare or ticket.
          deprecated: true
          items:
            $ref: "#/components/schemas/PenaltyOnOfferLevel"
        penaltyRefs:
          type: array
          description: Lists references to penalties applicable at the offer level.
          items:
            type: string
            description: A reference to the penalty `id`.
            example: Penalty-01
        offerItems:
          type: array
          description: Lists all offer items.
          items:
            $ref: "#/components/schemas/OfferItem"
        totalPrice:
          $ref: "#/components/schemas/OfferTotalPrice"
          description: Contains details of the final price to be paid for the offer.
        obFees:
          type: array
          description: Lists carrier ticketing fees associated with the offer.
          items:
            $ref: "#/components/schemas/ObFee"
            description: Contains information about a carrier ticketing fee, the IATA industry standard for ticketing and application of credit card fees.
        promotions:
          type: array
          description: Lists promotions associated with the returned offer.
          items:
            $ref: "#/components/schemas/PromotionType"
            description: Contains details of a promotion.
        penalty:
          $ref: "#/components/schemas/Price"
          description: Contains the penalty amount for an offer priced with an unused ticket. In such a scenario, this penalty is the only one returned in the response (other types of penalties are not returned).
        priceGuaranteeTimeLimitDateTime:
          $ref: "#/components/schemas/DateTimeType"
          description: The date and time by which an offer must be converted into an order.
        priceGuaranteeTimeLimitText:
          description: The local date by which an offer must be converted into an order.
          type: string
          example: "2021-02-25T19:10:00"

    OfferTotalPrice:
      type: object
      description: Contains the total price of an offer.
      required:
        - totalAmount
      properties:
        totalAmount:
          $ref: "#/components/schemas/SignedCurrencyType"
          description: Contains the total amount of the offer.
        baseAmount:
          $ref: "#/components/schemas/SignedCurrencyType"
          description: Contains the base amount of the offer (excluding taxes, fees, and surcharges).
        equivAmount:
          $ref: "#/components/schemas/SignedCurrencyType"
          description: Contains the base amount details expressed in the requested currency.
        totalTaxes:
          $ref: "#/components/schemas/SignedCurrencyType"
          description: Contains the taxes applied to the offer.
        taxBreakdown:
          type: array
          description: Lists detailed information about the applied taxes.
          items:
            $ref: "#/components/schemas/TaxesTypeBreakdown"
        wasTicketValueUsed:
          type: boolean
          description: If `true`, the value of any unused tickets was used by the airline
            to calculate the offer price.
          example: true

    OfferItem:
      type: object
      description: Contains an item returned within an offer.
      properties:
        type:
          type: string
          description: Distinguishes between different offer item types.
          example: Air
      discriminator:
        propertyName: type
        mapping:
          Air: 'AirOfferItem'
          Service: 'ServiceOfferItem'
      oneOf:
        - $ref: '#/components/schemas/AirOfferItem'
        - $ref: '#/components/schemas/ServiceOfferItem'

    AirOfferItem:
      type: object
      description: Contains offer item details.
      required:
        - type
        - id
        - passengers
      properties:
        type:
          description: Distinguishes between different offer item types.
          type: string
          example: Air
        id:
          $ref: "#/components/schemas/OfferItemId"
          description: The ID of the air offer item.
        mandatoryInd:
          type: boolean
          description: If `true`, the offer item cannot be removed from the offer.
          example: true
          default: false
        commission:
          description: The agent's commission applicable to each passenger within the offer item.
          $ref: '#/components/schemas/Commission'
        passengers:
          type: array
          description: Lists offer item details for each passenger.
          items:
            $ref: "#/components/schemas/PassengerOffer"
        price:
          $ref: "#/components/schemas/Price"
          description: Contains the total price details of the offer item.

    ServiceOfferItem:
      type: object
      description: Contains details of a service offer item.
      required:
        - type
        - id
        - passengerRefs
        - segmentRefs
        - serviceDefinition
        - price
      properties:
        type:
          description: Distinguishes between different offer item types.
          type: string
          example: Service
        id:
          $ref: "#/components/schemas/OfferItemId"
          description: The ID of the Service offer item.
        mandatoryInd:
          type: boolean
          description: If `true`, the offer item cannot be removed from the offer.
          example: true
          default: false
        passengerRefs:
          type: array
          description: Lists passengers eligible for this offer item.
          minItems: 1
          items:
            $ref: "#/components/schemas/PassengerId"
        segmentRefs:
          type: array
          description: Lists segments for which this offer item is valid.
          minItems: 1
          items:
            type: string
            example: S1
        serviceDefinition:
          $ref: "#/components/schemas/ServiceDefinition"
          description: Contains the service provided by this offer item.
        price:
          $ref: "#/components/schemas/Price"
          description: Contains the total price of the offer item.

    PassengerOffer:
      type: object
      description: Contains offer item details pertaining to a passenger.
      required:
        - id
        - ptc
        - requestedPtc
      properties:
        id:
          $ref: "#/components/schemas/PassengerId"
          description: The `id` of the passenger.
        ptc:
          type: string
          description: The three-letter IATA-standard Passenger Type Code (PTC) used
            during pricing.
          example: ADT
          pattern: ^[A-Z][A-Z0-9]{2}$
        requestedPtc:
          type: string
          description: The three-letter IATA-standard Passenger Type Code (PTC) provided
            as `type` in the request. May be different than the one used during
            pricing.
          example: ADT
          pattern: ^[A-Z][A-Z0-9]{2}$
        passengerDescription:
          $ref: "#/components/schemas/PassengerDescription"
          description: Contains the passenger's personal information.
        frequentFlyer:
          type: array
          description: Lists information about the passenger's frequent flyer programs
            used for pricing.
          items:
            $ref: "#/components/schemas/FrequentFlyer"
            description: Contains basic details about a frequent flyer program.
        baggage:
          type: array
          description: List the passenger's baggage details.
          items:
            $ref: "#/components/schemas/Baggage"
        services:
          type: array
          description: Lists services (ancillaries) included in the offer item and pertaining to the indicated travel segments.
          items:
            $ref: "#/components/schemas/Service"
        price:
          $ref: "#/components/schemas/Price"
          description: Contains the passenger's price information.
        fees:
          type: array
          description: Lists fees associated with the offer item.
          items:
            $ref: "#/components/schemas/Fee"
            description: Contains detailed fee information.
        fareComponents:
          type: array
          description: Lists fare components associated with the offer item.
          items:
            $ref: "#/components/schemas/FareComponent"
        tourCode:
          type: string
          description: The tour code originally requested in a [Bargain Finder Max API](https://developer.sabre.com/rest-api/bargain-finder-max) call (`/offers/shop`) and used by the airline to return the offer.
          example: MCTESTVALITC2
          minLength: 1
          maxLength: 35

    FareComponent:
      type: object
      description: Contains fare component information, including an optional price
        breakdown.
      required:
        - fareBasis
        - segments
      properties:
        price:
          $ref: "#/components/schemas/Price"
          description: Contains pricing information of a fare component.
        fareBasis:
          $ref: "#/components/schemas/FareBasis"
          description: Contains details of the applied fare.
        fareRules:
          $ref: "#/components/schemas/FareRules"
          description: Contains the imposed fare rules.
        segments:
          type: array
          description: Lists flight segments pertaining to the fare component.
          items:
            $ref: "#/components/schemas/Segment"
        brand:
          $ref: "#/components/schemas/Brand"
          description: Contains details about the brand that the fare is a part of.
        voluntaryChangeInformation:
          description: Lists details of the fees and limitations related to voluntary changes.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VoluntaryChangeInformation"
        ticketDesignator:
          description: The ticket designator associated with the fare component.
          type: string
          minLength: 1
          maxLength: 10
          example: "WO10"

    Segment:
      type: object
      description: Contains flight segment information.
      required:
        - id
        - departure
        - arrival
      properties:
        id:
          type: string
          description: The unique reference name of a flight segment.
          example: PAX_SGMNT-1
          pattern: ^([\w-])*$
        arnkInd:
          $ref: "#/components/schemas/ArnkInd"
          description: If `true`, the segment is of surface type.
        rbd:
          $ref: "#/components/schemas/Rbd"
          description: The Reservation Booking Designator code.
        flightNumber:
          type: string
          description: The flight number of the marketing carrier.
          pattern: ^([0-9])*$
          example: "1485"
        marketingCarrier:
          $ref: "#/components/schemas/CarrierCode"
          description: The IATA code of the airline that provides the passenger's booking or reservation.
        marketingCarrierName:
          type: string
          description: The commercial name of the marketing carrier.
          example: "American Airlines"
        operatingCarrierFlightNumber:
          type: string
          description: The flight number of the operating carrier.
          pattern: ^([0-9])*$
          example: "1499"
        operatingCarrier:
          $ref: "#/components/schemas/CarrierCode"
          description: The IATA code of the airline that operates the flight and transports the passengers in a codeshare scenario.
        operatingCarrierName:
          type: string
          description: The commercial name of the airline that operates the flight.
          example: "AIR WISCONSIN AS AMERICAN EAGLE"
        cabinType:
          $ref: "#/components/schemas/CabinType"
          description: Contains details about the class of service.
        departure:
          $ref: "#/components/schemas/Transport"
          description: Contains information about the departure location and time.
        hiddenConnections:
          type: array
          description: Lists connection stops at intermediate airports between the
            departure and destination airports which retain the same flight
            number but may require a change of planes.
          items:
            $ref: "#/components/schemas/Connection"
            description: Contains details of a connection stop at an intermediate airport.
        arrival:
          $ref: "#/components/schemas/Transport"
          description: Contains information about the arrival location and time.
        duration:
          type: string
          description: The duration of the connection stop in the ISO 8601
            `PnYnMnDTnHnMnS` format.
          example: PT5H44M
        equipment:
          $ref: "#/components/schemas/Equipment"
          description: The designator code of the aircraft type or other mode of transportation. May be set to `varies` for connection stops with a change of gauge.
        distanceInMiles:
          description: The flight distance in miles.
          type: integer
          format: int32
          minimum: 1
          example: 1324

    Brand:
      type: object
      description: Contains details about a brand. Branded fares are bundled services
        provided by suppliers. They can be either complimentary or paid.
      required:
        - brandName
      properties:
        code:
          type: string
          description: The brand code.
          example: ECONFLEX
        brandName:
          type: string
          description: The full name of the brand.
          example: ECONOMY FULLY FLEX
          pattern: ^(.*)$
        programCode:
          type: string
          description: The code of the program that the brand is a part of.
          example: CFFBA
          pattern: ^[A-Z0-9]{1,10}$
        programName:
          type: string
          description: The brand program name.
          example: INTERNATIONAL
          pattern: ^.{1,30}$
        programID:
          type: integer
          description: The ID of the program that the brand is a part of.
          example: 12345
        descriptions:
          type: array
          description: Lists brand or price class descriptions.
          items:
            $ref: "#/components/schemas/Description"

    Description:
      type: object
      description: Contains a brand or price class description.
      required:
        - text
      properties:
        id:
          type: string
          description: The `id` of the description.
          example: CANCEL_BEFOREDEPARTURE
        text:
          type: string
          description: The text of the description.
          example: Refund to original form of payment (no charge)

    FareBasis:
      type: object
      description: Contains details of the applied fare.
      required:
        - fareBasisCode
        - fareDescription
        - rbd
      properties:
        fareBasisCode:
          type: string
          description: The alphanumeric code used by airlines to identify a fare type to
            which specific rules apply.
          example: Y1N0C9M0
          pattern: ^[A-Z0-9/]+$
        fareDescription:
          type: string
          description: A description of the fare provided by its supplier.
          example: Private fare
        fareCode:
          type: string
          description: >-
            The fare code provided by the fare supplier. 
            May be expressed in the form of a code from the PADIS codeset directory (element 9910).
          example: 70J
        fareBasisCityPair:
          type: string
          description: >-
            A string composed of the three-letter IATA code of the origin city,
            the three-letter IATA code of the destination city, and the two-letter IATA carrier code.
          example: WAWLASBA
          pattern: ^[A-Z]{6}[A-Z0-9]{2}$
        rbd:
          $ref: "#/components/schemas/Rbd"
          description: The Reservation Booking Designator associated with the fare.
        cabinType:
          $ref: "#/components/schemas/CabinType"
          description: Contains information about the class of service.
        sabreCabinType:
          $ref: "#/components/schemas/CabinType"
          description: Contains information about the class of service provided in the Sabre nomenclature.

    Message:
      type: object
      description: Contains message details.
      required:
        - type
        - message
        - service
      properties:
        type:
          type: string
          description: The severity type of the message. Can be `ERROR`, `WARNING`, or `INFO`.
          example: ERROR
          pattern: ^[A-Z]{0,7}$
        message:
          type: string
          description: The text of the message.
          example: Failed to retrieve a response from the external service.
          pattern: ^(.+)$
        code:
          type: integer
          description: The code of the message.
          default: 0
          example: 404
        service:
          type: string
          description: The name of the processing step during which the message was created.
          example: OFFER_STORE_PUT
          pattern: ^(\w)+$
        system:
          type: string
          description: The service from which the message originates.
          example: OFFERSTORE
          pattern: ^[A-Z]{0,20}$
        additionalDescription:
          type: string
          description: Supplementary information appending the message.
          example: Invalid form of payment reference.
          pattern: ^(.*)$

    OfferItemId:
      type: string
      description: The ID of the offer item.
      example: bejq23zanr0-1-1
      pattern: ^[a-zA-Z0-9]+(-[0-9]+){2}$
    PassengerId:
      type: string
      description: The `id` of the passenger.
      example: Passenger-1
      pattern: ^([\w-]){1,200}$
    PassengerDescription:
      type: object
      description: Contains the passenger's personal information.
      required:
        - surname
      properties:
        givenName:
          type: string
          description: The first name of the passenger.
          example: John
        surname:
          type: string
          description: The last name of the passenger.
          example: Smith

    ServiceDefinition:
      type: object
      description: Contains an airline-specific product or service (excluding flights) that can be sold and delivered separately.
      required:
        - serviceCode
        - airlineCode
      properties:
        serviceCode:
          type: string
          description: The SSR code or ancillary code that identifies a specific service type. Either used across the industry or defined by the carrier.
          pattern: '^[0-9A-Z]{3,4}$'
          example: 0B5
        airlineCode:
          $ref: '#/components/schemas/CarrierCode'
          description: The airline code of the carrier that owns the ancillary.
        commercialName:
          type: string
          description: The commercial name of the service associated with the `serviceCode`.
          example: "UPTO70LB 32KG AND115LI 292LCM"
        groupCode:
          type: string
          description: The ATPCO group code.
          pattern: '^[0-9A-Z]{2}$'
          example: BG
        reasonForIssuance:
          $ref: '#/components/schemas/ReasonForIssuanceEnum'
          description: Identifies the reason for issuing the EMD for the service associated with the `serviceCode`.
        baggage:
          $ref: '#/components/schemas/Baggage'
          description: Contains the baggage service details.
        descriptions:
          description: Lists any descriptions associated with the service, provided by the airline.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceDefinitionDescription'

    ReasonForIssuanceEnum:
      description: Identifies the reason for issuing the EMD for the service associated with the `serviceCode`.
        For more information, refer to the PADIS Codeset data element 4183 - Special Condition.
      type: string
      enum:
        - Air Transportation
        - Surface Transportation / Non Air Services
        - Baggage
        - Financial Impact
        - Airport Services
        - Merchandise
        - In-Flight Services
        - Individual Airline Use
        - Unknown
      default: 'Unknown'

    FrequentFlyer:
      type: object
      description: Contains information about a frequent flyer loyalty program the
        passenger participates in.
      required:
        - airline
        - accountNumber
      properties:
        airline:
          $ref: "#/components/schemas/CarrierCode"
          description: The IATA code of the airline that offers the frequent flyer program.
        accountNumber:
          type: string
          description: The loyalty program account number.
          example: "3255310"
          pattern: ^[a-zA-Z0-9_-]{1,100}$
        programName:
          type: string
          description: The name of the frequent flyer program.
          example: ADVANTAGE PLATINUM
          pattern: ^.{0,64}$
        programCode:
          type: string
          description: The code assigned to the frequent flyer program.
          example: PLT/SPH
          pattern: ^(\S){0,64}$
        tierCode:
          type: string
          description: The code of the frequent flyer membership tier.
          example: P1
          pattern: ^(\S){0,64}$
        tierName:
          type: string
          description: The name of the frequent flyer membership tier.
          example: Platinum
          pattern: ^(\S){0,64}$
        tierPriority:
          type: string
          description: The frequent flyer priority within the tier.
          example: PLATINUM
          pattern: ^(\S){0,64}$
        signInID:
          type: string
          description: The frequent flyer program sign-in ID or username.
          example: "1234"
          pattern: ^(\S{0,64})$
        poviderName:
          type: string
          description: The name of the organization providing the frequent flyer program.
          example: 30K
          pattern: ^(\S){0,64}$

    Price:
      type: object
      description: Contains price information.
      properties:
        totalAmount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains details of the total price.
        baseAmount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains details of the price without taxes.
        filingInformation:
          $ref: "#/components/schemas/FilingInformation"
          description: Contains information related to fare filing.
        surcharges:
          type: array
          description: Lists additional charges added to the `baseAmount`.
          items:
            $ref: "#/components/schemas/Surcharge"
        originalAmount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains the total price details without discounts.
        taxes:
          $ref: "#/components/schemas/TaxesType"
          description: Contains a tax summary, including the total tax amount.
        discount:
          $ref: "#/components/schemas/Discount"
          description: Contains discount details.

    FilingInformation:
      type: object
      description: Contains information related to fare filing.
      properties:
        baseAmount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains the originally filed base fare amount.
        exchangeRate:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: The rate at which the airline converted the `baseAmount`.
          example: 1.07470036

    Surcharge:
      type: object
      description: Contains information about a surcharge.
      properties:
        total:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains surcharge amount details.
        fees:
          type: array
          description: Lists fees included in the surcharge.
          items:
            $ref: "#/components/schemas/Fee"
            description: Contains details of a fee.

    TaxesType:
      type: object
      description: Contains a tax summary, including the total tax amount.
      required:
        - total
      properties:
        total:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains details of the total tax amount.
        breakdown:
          type: array
          description: Lists detailed information about the applied taxes.
          items:
            $ref: "#/components/schemas/TaxesTypeBreakdown"

    TaxesTypeBreakdown:
      type: object
      description: Contains information about a tax.
      required:
        - amount
        - taxCode
      properties:
        amount:
          $ref: "#/components/schemas/SignedCurrencyType"
          description: Contains details of the tax amount.
        nation:
          type: string
          description: >-
            The two-letter [ISO3166-1](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)
            code of the country in which the tax is collected.
          example: US
          pattern: (^$)|^[A-Z]{2}$
        taxCode:
          type: string
          description: The tax code.
          example: YQF
          pattern: ^[A-Z][0-9A-Z]{1,2}$
        taxPadisCode:
          description: The tax type or purpose provided using a code from the PADIS 5305 codeset.
          type: string
          example: "701"
        taxCodeText:
          description: The tax type or purpose provided using free text.
          type: string
          example: PAID
        description:
          type: string
          description: A free text description of the tax.
          example: AIRPORT TAX
          pattern: ^(.*)$

    CurrencyType:
      type: object
      description: Contains monetary amount details.
      required:
        - amount
        - curCode
      properties:
        amount:
          type: string
          description: The monetary amount.
          example: "402.53"
          pattern: ^\d+(\.\d{1,3})?$
        curCode:
          type: string
          description: The three-letter [ISO
            4217](https://www.iso.org/iso-4217-currency-codes.html) currency
            code.
          example: USD
          pattern: ^[A-Z]{3}$
        taxable:
          type: boolean
          description: If `true`, the given amount is subject to taxation.
          example: false

    Discount:
      type: object
      description: Contains the discount details.
      properties:
        preDiscountedAmount:
          description: The original price on which the discount will apply.
          $ref: "#/components/schemas/CurrencyType"
        discountAmount:
          description: The monetary value of the amount that was discounted.
          $ref: "#/components/schemas/CurrencyType"
        description:
          description: The airline-provided discount description.
          type: string
          minLength: 1
          example: "DSC_CONTINOUS_PRICING"

    SignedCurrencyType:
      type: object
      description: Contains monetary amount details.
      required:
        - amount
        - curCode
      properties:
        amount:
          type: string
          description: The monetary amount. May be negative in ticket exchange scenarios.
          example: "402.53"
          pattern: ^-?\d+(\.\d{1,3})?$
        curCode:
          type: string
          description: The three-letter [ISO
            4217](https://www.iso.org/iso-4217-currency-codes.html) currency
            code.
          example: USD
          pattern: ^[A-Z]{3}$
        taxable:
          type: boolean
          description: If `true`, the penalty amount is subject to taxation.
          example: false

    DateTimeType:
      type: string
      description: The date and time in ISO 8601 format.
      format: date-time
      example: 2024-05-10T05:38:16Z
    Service:
      type: object
      description: Contains ancillary details.
      required:
        - name
      properties:
        name:
          type: string
          description: The full name of the service.
          example: CHANGE AFTER DEPARTURE
          pattern: ^(.*)$
        serviceCode:
          type: string
          description: The IATA ancillary group code.
          example: BF
          pattern: ^[A-Z0-9]*$
        reasonForIssuanceSubCode:
          type: string
          description: The IATA ancillary subcode.
          example: 06J
          pattern: ^[0-9A-Z]{3,7}$
        segments:
          type: array
          description: Lists segments to which the service applies.
          items:
            type: string
            example: PAX_SGMNT-1
            description: The segment `id`.

    ServiceDefinitionDescription:
      description: Airline provided free-text description of the service.
      type: object
      required:
        - text
      properties:
        text:
          description: The free-text description of the service.
          type: string
          example: "Boost your trip with Premier Access."

    Baggage:
      type: object
      description: Contains baggage details.
      properties:
        type:
          type: string
          description: Specifies the baggage type. Can be `CarryOnBag` or `CheckedBag`.
          example: CarryOnBag
          pattern: ^(CarryOnBag)|(CheckedBag)$
        applicablePartyText:
          type: string
          example: Traveler
          description: Specifies the baggage weight restriction type. Example values include `Party` and `Traveler`.
            `Party` applies to all passengers.
        applicableBagText:
          type: string
          example: CARRYON HAND BAGGAGE ALLOWANCE
          description: The baggage type or its commercial name.
        totalQty:
          type: integer
          example: 1
          description: The total baggage quantity.
        segments:
          type: array
          description: Lists travel segments associated with the baggage details from this object.
          items:
            description: The segment `id`.
            type: string
            example: PAX_SGMNT-1
        details:
          type: array
          description: Contains a list of baggage details.
          items:
            $ref: "#/components/schemas/BaggageDetail"
      additionalProperties: false

    BaggageDetail:
      type: object
      description: Contains additional baggage details.
      properties:
        quantity:
          description: The number of baggage items.
          type: integer
          example: 1
        desc:
          type: array
          description: Lists baggage weight restrictions and quantities.
          items:
            type: string
            description: Baggage weight restrictions in pounds and kilograms.
            example: UP TO 15 POUNDS/7 KILOGRAMS
        applicableBagText:
          type: string
          description: The baggage type or its commercial name.
          example: CARRYON HAND BAGGAGE ALLOWANCE
        constrains:
          type: array
          description: Lists baggage restrictions.
          items:
            $ref: "#/components/schemas/Constrain"
      additionalProperties: false

    Constrain:
      type: object
      description: Contains baggage restrictions.
      properties:
        min:
          type: number
          description: The minimum allowed baggage measurement.
          example: 1
        max:
          type: number
          description: The maximum allowed baggage measurement.
          example: 2
        unit:
          type: string
          description: The unit of measurement.
          example: K

    Rbd:
      type: string
      description: The Reservation Booking Designator code used to identify the
        booking class in reservation transactions.
      example: B
      pattern: (^$)|^[A-Z]{1}$
    FareRules:
      type: object
      description: Contains the imposed fare rules.
      properties:
        penalty:
          deprecated: true
          $ref: "#/components/schemas/Penalty"
          description: Contains penalty information.
        corporateFare:
          $ref: "#/components/schemas/CorporateFare"
          description: Contains information about the company profile index associated with special fares.
        advanceStay:
          $ref: "#/components/schemas/AdvanceStay"
          description: Contains information about advance purchases and length of stay restrictions.
        ticketing:
          $ref: "#/components/schemas/Ticketing"
          description: Contains ticketing information.
        remarks:
          type: array
          description: Lists fare remarks.
          items:
            $ref: "#/components/schemas/Remark"
      additionalProperties: false

    ObFee:
      type: object
      description: Contains information about a carrier ticketing fee, the IATA
        industry standard for ticketing and application of credit card fees.
      properties:
        cardType:
          type: string
          description: >-
            The credit card type. For example: `FCA` - any credit card, `FDA` -
            any debit card, `FC1` - credit card numbers starting from 1, etc.
          example: FCA
          pattern: ^[A-Z0-9]{3}$
          deprecated: true
        cardCode:
          type: string
          description: >-
            The payment card provider code. For example: `VI` - Visa, `MC` -
            Master Card, `AX` - American Express.
          example: MC
          pattern: ^[A-Z0-9]{2}$
        binNumber:
          type: string
          description: The first six to eight digits of a credit or debit card number. May
            include the wildcard `*` character.
          example: 5452**
          pattern: ^[0-9|\*]{6,8}$
        surcharge:
          $ref: "#/components/schemas/ObFeeAmount"
          description: Contains details of OB Fee amounts and taxes.
        airline:
          $ref: "#/components/schemas/CarrierCode"
          description: The IATA code of the airline that applies OB Fees to the ticket.
        paxRefs:
          type: array
          description: Lists references to passengers to whom the OB Fee applies.
          items:
            $ref: "#/components/schemas/PassengerId"
        offerItemRefs:
          type: array
          description: Lists references to offer items to which the OB Fee applies.
          items:
            $ref: "#/components/schemas/OfferItemId"
        serviceCode:
          description: The code of the fee. Can either be used across the industry or defined by the carrier to identify a specific type of fee.
          type: string
          pattern: '^[0-9A-Z]{2,4}$'
          example: OB
        subCode:
          description: The code specifying the reason for charging the fee. Can either be used across the industry or defined by the carrier to identify a specific type of fee.
          type: string
          pattern: '^[0-9A-Z]{3}$'
          example: T05
        isRefundable:
          description: If `true`, the fee amount is refundable.
          type: boolean
          example: false
        description:
          description: The fee description provided by the airline.
          type: string
          example: "Credit Card Fee"
      additionalProperties: false

    Penalty:
      type: object
      description: Contains penalty information.
      properties:
        cancelFeeInd:
          type: boolean
          description: If `true`, cancellation fees may apply.
          example: true
        changeFeeInd:
          type: boolean
          description: If `true`, itinerary change fees may apply.
          example: true
        refundableInd:
          type: boolean
          description: If `true`, the ticket or fare is refundable.
          example: true
        reuseInd:
          type: boolean
          description: If `true`, the ticket or fare is reusable.
          example: true
        upgradeFeeInd:
          type: boolean
          description: If `true`, upgrade fees may apply.
          example: true
        applicableFeeRemarks:
          type: array
          description: Lists applicable fee remarks.
          items:
            $ref: "#/components/schemas/Remark"
        details:
          type: array
          description: Lists detailed information about the penalty, including its
            conditions and amount.
          items:
            $ref: "#/components/schemas/PenaltyDetail"
        refs:
          type: array
          description: Lists references to penalties applicable on the fare component level.
          items:
            type: string
            description: The `id` of a penalty applicable on the fare component level.
            example: PENALTY-1
      additionalProperties: false

    PenaltyDetail:
      type: object
      description: Contains detailed penalty information.
      properties:
        penaltyType:
          type: string
          description: Specifies the penalty type.
          example: Cancellation, Change, NoShow, Upgrade, Other
        metadata:
          type: array
          description: Lists predefined and augmented rule metadata.
          items:
            $ref: "#/components/schemas/Metadatum"
        application:
          type: string
          description: The IATA PADIS Codeset FAT (fare or application penalty type).
          example: "2"
        amounts:
          type: array
          description: Lists penalty amounts along with application details and remarks.
          items:
            $ref: "#/components/schemas/PenaltyAmount"

    PenaltyAmount:
      type: object
      description: Contains information about the amount of a penalty.
      anyOf:
        - required:
            - currencyAmountValue
        - required:
            - percentageAmount
      properties:
        currencyAmountValue:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains details of the penalty's monetary value and currency code.
        percentageAmount:
          type: string
          description: The percentage of total amount charged upon making changes to the ticket.
          example: "2.5"
        amountApplication:
          type: string
          description: Specifies the applied penalty calculation method.
          example: MinimumPenaltyAmount, MaximumPenaltyAmount, Other
        applicableFeeRemarks:
          type: array
          description: Lists applicable fee remarks.
          items:
            $ref: "#/components/schemas/Remark"

    Metadatum:
      type: object
      description: Contains details of rule metadata.
      properties:
        ruleId:
          type: string
          description: A unique rule ID applied during transaction processing.
          example: PRICERULE001
        name:
          type: string
          description: The rule name.
          example: Rule001
        status:
          type: string
          description: Specifies the rule status.
          example: ActionRequired, RuleExecuted, Other
        values:
          type: array
          description: Lists the rule content.
          items:
            $ref: "#/components/schemas/MetadatumValues"

    MetadatumValues:
      type: object
      description: Contains rule values.
      properties:
        instruction:
          type: string
          description: The instruction of a business rule.
          example: Valid on weekdays.

    PenaltyOnOfferLevel:
      type: object
      description: Contains penalty details.
      required:
        - id
      properties:
        id:
          type: string
          description: A unique penalty ID.
          example: PENALTY-1
        typeCode:
          type: string
          description: The type of operation upon which the penalty applies.
            Can be `Cancellation`, `Change`, `NoShow`, `Other`, or `Upgrade`.
          example: Change
        description:
          type: string
          description: The description of the penalty.
          example: >-
            Reissue/Refund after departure when no show allowed?  Value applies for
            after departure with no show situation. Not allowed
        application:
          type: string
          description: The penalty application type in a human-readable format.
          example: BEFORE_DEPARTURE
        appCode:
          type: string
          description: >-
            The penalty application type. Example values include `ADE` (After departure), `NOS`
            (No show), and `PDE` (Prior to departure). Encoding scheme: IATA PADIS Codeset FAT.
          example: PDE
        cancelFeeInd:
          type: boolean
          description: If `true`, cancellation fees may apply.
          example: true
        changeFeeInd:
          type: boolean
          description: If `true`, itinerary change fees may apply.
          example: true
        upgradeFeeInd:
          type: boolean
          description: If `true`, itinerary upgrade fees may apply.
          example: true
        penaltyAmount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains the penalty amount to be paid for either exchanging or refunding a fare or a ticket.
        percentage:
          type: string
          description: The percentage amount of the penalty.
          example: "2.5"
        instruction:
          type: string
          description: >-
            Specifies if the requested operation (ticket cancellation or refund) is allowed. 
            Can be 'Allowed' or 'Not allowed'.
          example: Allowed

    Journey:
      type: object
      description: Contains journey details.
      required:
        - segmentRefIds
      properties:
        segmentRefIds:
          type: array
          description: Lists the indices of travel segments that belong to the journey.
          items:
            type: string
            example: S1
        priceClassRefId:
          type: string
          description: The price class (brand) applicable to the journey.
          example: BasicEconomy

    CorporateFare:
      type: object
      description: Contains information about the company profile index associated
        with special fares.
      required:
        - account
      properties:
        account:
          type: string
          description: The corporate account name or ID used to price special fares.
          example: GRI90
      additionalProperties: false

    AdvanceStay:
      type: object
      description: Contains information about advance purchases and length of stay
        restrictions.
      properties:
        advancePurchase:
          $ref: "#/components/schemas/ValueWithContext"
          description: Contains details of an advance purchase restriction.
        minimumStay:
          $ref: "#/components/schemas/MinMaxStay"
          description: Contains the minimum stay restriction.
        maximumStay:
          $ref: "#/components/schemas/MinMaxStay"
          description: Contains the maximum stay restriction.
      additionalProperties: false

    Ticketing:
      type: object
      description: Contains ticketing information.
      properties:
        ticketlessInd:
          type: boolean
          description: If `true`, the fare can be purchased without issuing a ticket.
          example: true
        instantPurchase:
          type: string
          description: The IATA PADIS Codeset Instant Purchase Type (IPT).
          example: CC
        endorsements:
          type: array
          description: >-
            Lists endorsements provided to ensure common understanding between
            a passenger and an airline in case a fare is restricted  as to time
            of travel, period of validity, or voluntary rerouting, or in case
            any other restricting conditions are applicable which are not
            otherwise clearly evident from other entries.
          items:
            type: string
            description: The ticket endorsement free text.
            example: NON ENDORSE/NON REFUND

    ValueWithContext:
      type: object
      description: Contains details of a value restriction.
      properties:
        value:
          type: string
          description: The restriction value provided as a number of days in the `PnD`
            format, where `n` indicates the number of days.
          example: P3D
        context:
          type: string
          description: Restriction context.
          example: EARLIEST

    MinMaxStay:
      type: object
      description: Contains minimum or maximum stay requirements.
      properties:
        dayQuantity:
          $ref: "#/components/schemas/ValueWithContext"
          description: Contains the number of stay days permitted by a fare or offer.
        dayOfWeek:
          type: integer
          description: The number representing the day of the week. For example, `1`
            stands for Monday.
          example: 1
          minimum: 1
          maximum: 7

    Remark:
      type: object
      description: Contains a remark associated with a fare or fee.
      properties:
        displayInd:
          type: boolean
          description: If `true`, the remark is to be displayed for the customer to read.
          example: true
        value:
          type: string
          description: The text of the remark.
          example: Priority boarding begins at 7:30 PM.

    Transport:
      type: object
      description: Contains the location and time of either departure or arrival.
      required:
        - airport
        - date
      properties:
        airport:
          type: string
          description: The three-letter
            [IATA](https://www.iata.org/publications/Pages/code-search.aspx)
            code of the departure or arrival airport.
          example: WAW
          pattern: ^[A-Z]{3}$
        date:
          $ref: "#/components/schemas/DateTimeType"
          description: Timestamp of the departure or arrival.
        terminal:
          type: string
          description: The airport terminal name or ID.
          example: C

    Connection:
      type: object
      description: Contains details of a connection stop.
      required:
        - departure
        - arrival
      properties:
        departure:
          $ref: "#/components/schemas/Transport"
          description: Contains information about the departure location and time.
        arrival:
          $ref: "#/components/schemas/Transport"
          description: Contains information about the arrival location and time.
        equipment:
          $ref: "#/components/schemas/Equipment"
          description: The type of aircraft, bus, train, etc.
        changeOfGaugeInd:
          type: boolean
          description: If `true`, a change of gauge is going to take place between the
            current leg and the following one.
          example: true
        onGroundTime:
          type: string
          description: The total time the aircraft remains on the ground between the
            current leg and the following one in the ISO 8601
            `PnYnMnDTnHnMnS`format.
          example: PT5H44M

    Equipment:
      type: string
      description: The designator code of the aircraft type or other mode of
        transportation. May be set to `varies` for connection stops with a
        change of gauge.
      example: 32B
      pattern: ^([A-Z0-9]{2,4})|varies$

    CarrierCode:
      type: string
      description: The IATA carrier designator code.
      example: LO
      pattern: ^([A-Z0-9]{2}|[A-Z]{3})$

    CabinType:
      type: object
      description: Contains details of the cabin class.
      required:
        - cabinTypeCode
        - cabinTypeName
      properties:
        cabinTypeCode:
          type: string
          description: The cabin code.
          example: Y
          pattern: ^[A-Z]$
        cabinTypeName:
          type: string
          description: The full cabin name.
          example: ECONOMY
          pattern: ^(.*)$

    ArnkInd:
      type: boolean
      description: >-
        If `true`, indicates an ARNK (ARrival uNKown) condition, i.e. a gap
        between the current segment departure location and the previous segment
        arrival location, implying unknown passenger movement.
      example: false

    Source:
      type: string
      description: The source of the offer. Can be `ATPCO`, `LCC`, or `NDC`.
      example: NDC
      pattern: ^(ATPCO)|(LCC)|(NDC)$

    PromotionType:
      type: object
      description: Contains details of a promotion.
      properties:
        tag:
          type: string
          description: The promotion tag.
          example: MCTESTVALIPT2
        tourCode:
          type: string
          description: The promotion tour code.
          example: MCTESTVALITC2
          pattern: ^[0-9A-Z]{1,14}$
        remarks:
          type: array
          description: Lists remarks associated with the promotion.
          items:
            type: string
            example: PROMOTION APPLIED. 10 PERCENT DISCOUNT.
        rules:
          type: array
          description: Lists details of promotion rules.
          items:
            $ref: "#/components/schemas/PromotionTypeRules"

    PromotionTypeRules:
      type: object
      description: Contains information about a promotion rule.
      properties:
        id:
          type: string
          description: The ID of the promotion rule.
          example: "92825"
          pattern: ^[0-9]+$
        type:
          type: string
          description: The type of the promotion rule.
          example: POST
        discount:
          $ref: "#/components/schemas/PromotionTypeDiscount"
          description: Contains details of the price discount resulting from the applied promotion.

    PromotionTypeDiscount:
      type: object
      description: Contains details of a price discount resulting from a promotion.
      properties:
        percent:
          type: string
          description: The discount percentage.
          example: "10.0"
        amount:
          type: string
          description: The discount amount.
          example: "13.26"
          pattern: ^-?\d+(\.\d{1,3})?$
        curCode:
          type: string
          description: The three-letter ISO-4217 code of the discount amount currency.
          example: USD
          pattern: ^[A-Z]{3}$
        accountCodes:
          type: string
          description: The discount account code.
          example: SummerTime

    ObFeeAmount:
      type: object
      description: Contains details of an OB Fee.
      properties:
        description:
          type: string
          description: The description of the OB Fee.
          example: CC SURCHRG
          pattern: ^(.*)$
        type:
          type: string
          description: The IATA indicator of the OB Fee type.
          example: NNN
          pattern: ^(.*)$
        noCharge:
          type: boolean
          description: If `true`, there is no charge associated with the selected form of payment.
          example: true
        amount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains information about the total amount of the OB Fee.
        baseAmount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains information about the base amount of the OB Fee (with taxes excluded).
        maximumAmount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains details of the maximum OB Fee amount that can be charged. Returned if an exact amount cannot be computed.
        percentageValue:
          type: string
          description: The percentage applied to the total fare.
          example: "3.5"
          pattern: ^\d{1,2}(\.\d+)?$
        cardCharge:
          type: string
          description: The card charge amount.
          example: "20.00"
          pattern: ^\d{1,2}(\.\d+)?$
        taxes:
          $ref: "#/components/schemas/TaxesType"
          description: Contains a tax summary, including the total tax amount.

    Fee:
      type: object
      description: Contains fee information with an optional price breakdown.
      required:
        - amount
      properties:
        amount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains details of the total fee amount.
        localAmount:
          $ref: "#/components/schemas/CurrencyType"
          description: Contains details of the total fee amount expressed in the local currency.
        designator:
          description: The fee designator.
          type: string
          example: USC
          pattern: ^.{1,15}$
        description:
          description: A description of the fee or surcharge.
          type: string
          example: U.S Customs User Fee
        surchargeType:
          description: >-
            The surcharge type used to describe if the fee is refundable, commissionable, or interlineable.
            It is composed of three characters:
            The first one informs whether the fee is refundable.
            The second one specifies if the fee is commissionable.
            The third one defines whether the fee is interlineable.
            A `Y` character informs that the fee has the specified characteristic.
            An `N` character informs that the fee does not have the specified characteristic.
          type: string
          example: NNN
        nature:
          description: >-
            The type of fee and/or reason the given fee is applied. 
            Example values include `SEASONAL`, `WEEKEND`, and `SECURITY`.
          type: string
          example: PEAK TRAVEL TIME
        boardingCity:
          description: The three-letter IATA code of the departure city.
          type: string
          example: KRK
        arrivalCity:
          description: The three-letter IATA code of the arrival city.
          type: string
          example: DFW
        refundInd:
          description: If `true`, the fee is refundable.
          type: boolean
          example: true

    VoluntaryChangeInformation:
      description: Contains details of the fees and limitations related to voluntary changes.
      type: object
      properties:
        type:
          description: The type of voluntary change.
          $ref: '#/components/schemas/VoluntaryChangeTypeEnum'
        isAllowed:
          description: If true, the voluntary change is allowed.
          type: boolean
          example: true
        hasFee:
          description: If true, the change incurs a fee.
          type: boolean
          example: true
        feeAmount:
          description: Fee amount for the change.
          type: string
          pattern: ^\d+(\.\d{1,3})?$
          example: '128.00'
        feeCurrencyCode:
          description: The three-letter ISO-4217 code of the fee currency.
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
        applicabilityList:
          description: Lists the change applicability.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApplicabilityEnum'
        description:
          description: The free-text description provided by the airline.
          type: string
          example: "Part of rule is free form text from Cat16? Not allowed"

    VoluntaryChangeTypeEnum:
      description: Identifies the types of possible voluntary changes.
      type: string
      enum:
        - Cancel
        - Change
        - Refund
      example: Cancel

    ApplicabilityEnum:
      description: Identifies the fee/penalty applicability.
      type: string
      enum:
        - No Show
        - Before Departure
        - After Departure

    Commission:
      description: Contains details of the travel agency's commission.
      type: object
      properties:
        amount:
          description: The monetary value of the commission.
          type: string
          format: number
          example: '128.00'
        currencyCode:
          description: The three-letter ISO-4217 currency code of the commission.
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
        percentage:
          description: The percentage value of the commission.
          type: string
          format: number
          example: '10.00'
        percentageAppliedToAmount:
          description: The amount to which the percentage value of the commission applies.
          type: string
          format: number
          example: '128.00'
        code:
          description: The unique code that identifies the commission.
          type: string
          example: 'BFST'
        description:
          description: The free-text description of the commission.
          type: string
          example: 'Standard commission'

  examples:
    BasicRequest:
      description: |
        ##### Scenario
        The *Basic Query* example represents the most common use-case of the Offer Price API. In our request, we are only required to include an `offerItemId` obtained from an earlier shopping transaction.
        ##### Instruction
        To send a basic request, we need to provide the following information:

        | Property | Description |
        | :--- | ---: |
        | `query.offerItemId` | The ID of an offer item selected from a shopping response. |
      value:
        {
          "query": [
            {
              "offerItemId": [
                "dd07bbd7fb57c88nclq1qixyj3-1-1"
              ]
            }
          ]
        }

    OneWayResponse:
      description: |
        ##### Summary
        To our example of a *Basic Query* request, the service responded with a priced one-way offer. The returned data consists of the following sections:

        - `offers` - A list of offers returned by the server with `offerItems` and `totalPrice` for each offer.
        - `offerItems` - A list of offer items returned by the server. Includes the `id`, `price`, and `passengers` for each offer item.
        - `passengers` - A list of passenger information. Comprises `baggage` details, `price` breakdown with tax summary, and `fareComponent` data for each individual passenger.

        ##### Next Steps
        The **Offer Price API** is the second step in the New Distribution Capability (NDC) Workflow. Go to the [NDC Workflow Guide](https://developer.sabre.com/guide/new-distribution-capability-ndc/new-distribution-capability-ndc.html) for more information.
