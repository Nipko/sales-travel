        ##### Scenario
        The *Frequent Flyer* example presents a use-case with passenger details required for frequent flyer processing. This type of information must be provided within the `passengers` array.
        ##### Instruction
        To send a frequent flyer request, we need to provide the following information:
        
        | Property | Description |
        | :--- | ---: |
        | `query.offerItemId` | The ID of an offer item selected from a shopping response. |
        | `passengers.id` | The unique ID of a passenger. Should be the same as the one returned in an earlier shopping step. |
        | `passengers.personName.givenName` | The given name of a frequent flyer passenger. |
        | `passengers.personName.surname` | The surname of a frequent flyer passenger. |
        | `passengers.frequentFlyer.airline` | The IATA carrier designator code. |
        | `passengers.frequentFlyer.accountNumber` | The loyalty program account number. |
