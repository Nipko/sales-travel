    ApplicationResults:
      required:
      - status
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CompletionCodes'
        Success:
          maxItems: 99
          type: array
          items:
            $ref: '#/components/schemas/ProblemInformation'
        Error:
          maxItems: 99
          type: array
          items:
            $ref: '#/components/schemas/ProblemInformation'
        Warning:
          maxItems: 99
          type: array
          items:
            $ref: '#/components/schemas/ProblemInformation'
    ProblemInformation:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        TimeStamp:
          type: string
          format: date-time
        SystemSpecificResults:
            type: array
            items:
                $ref: '#/components/schemas/SystemSpecificResults'
    CompletionCodes:
      type: string
      enum:
      - Complete
      - Incomplete
      - NotProcessed
      - Unknown
    ErrorType:
      type: string
      enum:
      - Transport
      - Validation
      - Application
      - BusinessLogic
    SystemSpecificResults:
      type: object
      properties:
        timeStamp:
          type: string
          format: date-time
        reference:
          type: string
        Message:
          maxItems: 99
          type: array
          items:
            $ref: '#/components/schemas/ResultMessage'
