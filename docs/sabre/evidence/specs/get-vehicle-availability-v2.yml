    Commission:
      type: object
      properties:
        Amount:
          type: string
        Fixed:
          type: string
        Percent:
          type: string
      description: Commission related Information if applicable
    Vehicle:
      required:
      - Images
      - VehType
      type: object
      properties:
        VehMakeAndModel:
          type: string
        VehNumOfDoors:
          type: string
        VehType:
          type: string
        Images:
          $ref: '#/components/schemas/Images'
        SeatBeltsAndBagsInfo:
          type: object
          properties:
            BagsInfo:
              $ref: '#/components/schemas/BagsInfoRes'
            SeatBelts:
