            - DropOffCharge
            - ExtraDay
            - ExtraHour
            - BaseRateTotal
            - SubtotalExcludingMandatoryCharges
            - DailyChargesTotal
            - HourlyChargesTotal
            - MandatoryCharges
            - MandatoryChargesTotal
            - ApproximateTotalPrice
            - CarExtraTotalCharge
