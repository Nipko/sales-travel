        Amount:
          type: string
          format: number
          pattern: '^-?(([1-9][0-9]+)|([0-9]))(\.[0-9]{1,3})?$'
          description: The total value of the guarantee.
          example: "84.12"
        CurrencyCode:
          pattern: ^[A-Z]{3}$
          type: string
          description: Specifies the IATA (ISO 4217) currency code of the returned
