        OffsetTimeUnit:
          type: string
          description: The unit of time type used for the deadline.
          example: Day
        OffsetUnitMultiplier:
          minimum: 1
          type: integer
          description: The multiplier of `OffsetTimeUnit`.
          example: 2
        OffsetDropTime:
          type: string
          description: The point of reference in the traveler's journey from when
            the deadline is implemented.
          enum:
          - BeforeArrival
          - AfterBooking
          - AfterConfirmation
          - AfterArrival
          - AfterDeparture
    AmountPercent:
      type: object
      properties:
        TaxInclusive:
          type: boolean
