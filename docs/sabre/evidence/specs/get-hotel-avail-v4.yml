          AvailableQuantity:
            type: integer
            description: The number of rooms available with the specific ratePlan.
            example: 3
          LimitedAvailability:
            type: string
            description: Specifies whether the rate is of limited availability.
            example: "true"
          RateSource:
            type: string
            description: Specifies the source of the rate.
            example: "100"
          RateKey:
            type: string
            description: The specific key associated with the rate.
            example: 
          ClientId:
            type: string
            description: The Negotiated / Contractual ID associated with the rate plan.
            example: AMX
          ProductCode:
            type: string
            description: The Inventory Block Code of the room. This is populated only
              for the GDS products
            example: A1KRAC
          LoyaltyMemberRate:
            type: boolean
            description: if true, rate is LoyaltyMemberRate. This is a placeholder for now.
            example: false
          LoyaltyId:
            type: string
            description: LoyaltyId accepted by the hotel. if returned in the response, it means that the loyaltyId was sent to the hotel in the request.
            example: HY5342
          LoyaltyPoints:
            type: boolean
            description: if true, booking this rate adds Loyalty points. This is a placeholder for now.
            example: false
          LoyaltyProgramName:
            type: string
            description: Holds the Loyalty Program Name. This is a placeholder for now.
