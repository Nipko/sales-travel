        AdditionalDetails:
          $ref: '#/components/schemas/AdditionalDetails'
    Rates:
      required:
      - Rate
      type: object
      properties:
        Rate:
          $ref: '#/components/schemas/Rate'
    Rate:
      minItems: 1
      type: array
      items:
        type: object
        properties:
          StartDate:
            type: string
            description: The date from which rate is applicable.
            format: date
            example: '2024-02-20'
          EndDate:
            type: string
            description: The date to which rate is applicable.
            format: date
            example: '2024-02-22'
          AmountBeforeTax:
            type: string
            format: number
            pattern: '^-?(([1-9][0-9]+)|([0-9]))(\.[0-9]{1,3})?$'
