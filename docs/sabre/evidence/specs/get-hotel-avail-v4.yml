            format.
          format: date
          example: '2024-06-28'
        Format:
          type: string
          description: Indicates the format of the media returned.
          example: JPG
          enum:
          - BMP
          - GIF
          - ICO
          - JPG
          - PNG
          - TIFF
          - WEBP
        Image:
          $ref: '#/components/schemas/Image'
        Category:
          $ref: '#/components/schemas/Category'
        AdditionalInfo:
          $ref: '#/components/schemas/AdditionalInfo'
      description: Contains image information for a hotel.
    Image:
      required:
      - Height
      - Type
      - Url
      - Width
      type: object
      properties:
        Url:
          type: string
          description: URL of the image item returned.
          format: uri
          example: http://vcmp-hotels.cert.sabre.com/image/upload/t_vcmp_thumb/hotel/i/1276/uvitpha0qioacl6c2tin.jpg
        Height:
          minimum: 0
          type: integer
          description: Height of the image in pixels.
          example: 100
        Width:
          minimum: 0
          type: integer
          description: Width of the image in pixels.
          example: 150
        Type:
          type: string
          description: Indicates the image type by size or original/thumbnail.
          enum:
          - ORIGINAL
          - MEDIUM
          - LARGE
          - THUMBNAIL
          - SMALL
      description: Contains details of the hotel image.
    Category:
      required:
      - Description
      type: object
      properties:
        CategoryCode:
          minimum: 1
          type: number
          description: Image category code, mapped to the `PCI` OTA code.
          example: 3.0
        Description:
          $ref: '#/components/schemas/Description'
      description: Contains the category the image item belongs to. This is mapped
        to the `PCI` OTA code.
    Description:
      type: object
      properties:
        Text:
          type: array
          description: Lists descriptions in all requested language codes.
          items:
            type: object
            properties:
              Language:
                pattern: ^([a-z][a-z][_][A-Z][A-Z])|([a-zA-Z]{2})$
                type: string
                description: The ISO 639-1 two-letter language code.
                example: en
              value:
                type: string
                description: Language Code
                example: The text description of the image.
      description: Contains image description details.
    AdditionalInfo:
      type: object
      properties:
        Info:
          $ref: '#/components/schemas/Info'
      description: Contains any additional information related to the media item.
    Info:
      maxItems: 10
      type: array
      description: Lists additional information, like caption, in the response.
      items:
        required:
        - Description
        - Type
        type: object
        properties:
          Type:
            type: string
            description: Identifies the type of additional information present.
            example: CAPTION
            enum:
            - CAPTION
          Description:
            $ref: '#/components/schemas/Description'
            
  securitySchemes:
    oauth2_authentication:
      type: oauth2
      x-base64-encode-client-credentials: true
      flows:
        clientCredentials:
          tokenUrl: https://api.cert.platform.sabre.com/v2/auth/token
          scopes: {}

