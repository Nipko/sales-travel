openapi: 3.0.3
info:
  title: Flight Reshop API
  description: The Flight Reshop API allows you to search for exchange options based on the provided `bookingId` (PNR
    locator) or list of tickets.
  version: '1.1'
x-lingo-api-type: rpc
servers:
  - url: https://{environment}.sabre.com{basePath}
    variables:
      environment:
        default: 'api.cert.platform'
        enum:
          - api.cert.platform # Public Certification Server
          - api.platform # Public Production Server
      basePath:
        default: '/v1/offers'
security:
  - oauth2_authentication:
      []
tags:
  - name: Sabre Flight Reshop
    description: The Flight Reshop suite.
paths:
  /flightReshop:
    post:
      operationId: flightReshop
      description: Creates a list of search parameters used to prepare itinerary reissue options for an existing ticket or order.
      tags:
        - Sabre Flight Reshop
      requestBody:
        description: Contains both required and optional details used as search parameters in an itinerary reissue request for
          an existing ticket or order.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightReshopRequest'
            examples:
              1. One-Way Trip [Single Traveler]:
                $ref: '#/components/examples/OneWaySingleTravelerRequest'
              2. Round Trip [Multiple Travelers]:
                $ref: '#/components/examples/RoundTripMultipleTravelersRequest'
              3. Round Trip with Retained Flights and Additional Brands [Single Traveler]:
                $ref: '#/components/examples/RoundTripAdditionalBrandsSingleTravelerRequest'
              4. Round Trip with Location Variant [Single Traveler]:
                $ref: '#/components/examples/RoundTripLocationVariantSingleTravelerRequest'
        required: true
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightReshopResponse'
              examples:
                1. One-Way Trip [Single Traveler]:
                  $ref: '#/components/examples/OneWaySingleTravelerResponse'
                2. Round Trip [Multiple Travelers]:
                  $ref: '#/components/examples/RoundTripMultipleTravelersResponse'
                3. Round Trip with Retained Flights and Additional Brands [Single Traveler]:
                  $ref: '#/components/examples/RoundTripAdditionalBrandsSingleTravelerResponse'
                4. Round Trip with Location Variant [Single Traveler]:
                  $ref: '#/components/examples/RoundTripLocationVariantSingleTravelerResponse'
      x-codegen-request-body-name: flightReshopRequest
components:

  examples:
    OneWaySingleTravelerRequest:
      description: |
        ##### SCENARIO
        This example illustrates the simplest use case for the Flight Reshop API. We will request reshop offers for a single traveler (ticket number "0012972101507") for a trip from DFW to LAX on the desired date.
        ##### INSTRUCTION
        Minimal parameters required to process our request are as follows:

        | Parameter | Description |
        | :--- | ---: |
        | `journeys.departureLocation.airportCode`| The three-letter IATA code of the airport where the flight departs. |
        | `journeys.arrivalLocation.airportCode` | The three-letter IATA code of the airport where the flight arrives. |
        | `journeys.departureDate` | The departure date in `YYYY-MM-DD` format in the airport's time zone. |
        | `tickets.number` | The electronic flight ticket number. |
      value:
        {
          "journeys":
            [
              {
                  "departureLocation": { "cityCode": "DFW" },
                  "arrivalLocation": { "cityCode": "LAX" },
                  "departureDate": "2026-09-26"
                }
            ],
          "tickets": [ { "number": "0012972101507" } ]
        }

    RoundTripMultipleTravelersRequest:
      description: |
        ##### SCENARIO
        In this example, we will request a **round trip with multiple travelers and a specified cabin class**. We want to receive reshop offers for travelers of different types (ticket numbers "0012972101543" and "0012972101544" for adult travelers, "0012972101545" for a child traveler, and "0012972101546" for an infant traveler) for an outbound journey from LHR to LAX on the desired date, followed by a return journey from LAX to LHR two weeks later. The entire itinerary is requested in the "Business" cabin.
        ##### INSTRUCTION
        Minimal parameters required to process our request are as follows:

        | Parameter | Description |
        | :--- | ---: |
        | `journeys[0].departureLocation.airportCode` | The three-letter IATA code of the airport where the outbound journey begins. |
        | `journeys[0].arrivalLocation.airportCode` | The three-letter IATA code of the airport where the outbound journey ends. |
        | `journeys[0].departureDate` | The departure date in `YYYY-MM-DD` format, based on the airport's local time zone for the outbound journey. |
        | `journeys[1].departureLocation.airportCode` | The three-letter IATA code of the airport where the inbound journey begins. |
        | `journeys[1].arrivalLocation.airportCode` | The three-letter IATA code of the airport where the inbound journey ends. |
        | `journeys[1].departureDate` | The departure date in `YYYY-MM-DD` format, based on the airport's local time zone for the inbound journey. |
        | `tickets[n].number` | The electronic flight ticket number of a specific traveler. Each traveler must have their own ticket entry in the `tickets` array. |
        | `fare.cabin.name` | The name of the aircraft cabin for which the API is expected to generate offers. |

        > **Note**: Optionally, a departure time window can be added as an additional departure constraint.
      value:
        {
          "journeys":
            [
              {
                  "departureLocation": { "cityCode": "LHR" },
                  "arrivalLocation": { "cityCode": "LAX" },
                  "departureDate": "2026-04-01",
                  "departureTimeWindow": { "startTime": "09:45", "endTime": "13:45" }
                },
              {
                  "departureLocation": { "cityCode": "LAX" },
                  "arrivalLocation": { "cityCode": "LHR" },
                  "departureDate": "2026-04-15",
                  "departureTimeWindow": { "startTime": "15:45", "endTime": "21:45" }
                }
            ],
          "fare": { "cabin": { "name": "Business" } },
          "source": { "distributionModel": "ATPCO" },
          "tickets":
            [
              { "number": "0012972101543" },
              { "number": "0012972101544" },
              { "number": "0012972101545" },
              { "number": "0012972101546" }
            ]
        }

    RoundTripAdditionalBrandsSingleTravelerRequest:
      description: |
        ##### SCENARIO
        In this example, we will request a **round trip with a retained outbound flight and additional brands**. We want to retrieve reshop offers for a single traveler (ticket number "0452972101548") for a retained outbound journey from MAD to GRU (based on the `flightItemId`), followed by a return journey from GRU to MAD on the desired date. Moreover, we will request two (2) additional brands to present potential alternative upsell options within the available itinerary results.

        ##### INSTRUCTION
        Minimal parameters required to process our request are as follows:

        | Parameter | Description |
        | :--- | ---: |
        | `bookingId` | The booking reference ID. |
        | `journeys[0].departureLocation.airportCode` | The three-letter IATA code of the airport where the outbound journey begins. |
        | `journeys[0].arrivalLocation.airportCode` | The three-letter IATA code of the airport where the outbound journey ends. |
        | `journeys[0].departureDate` | The departure date in `YYYY-MM-DD` format, based on the airport's local time zone for the outbound journey. |
        | `journeys[0].retainFlights.flightItemId` | The ID of a retained flight. Retention based on the `flightItemId` requires specifying the `bookingId` in the request. |
        | `journeys[1].departureLocation.airportCode` | The three-letter IATA code of the airport where the inbound journey begins. |
        | `journeys[1].arrivalLocation.airportCode` | The three-letter IATA code of the airport where the inbound journey ends. |
        | `journeys[1].departureDate` | The departure date in `YYYY-MM-DD` format, based on the airport's local time zone for the inbound journey. |
        | `tickets.number` | The electronic flight ticket number. |

        > **Note**: Optionally, a departure time window can be added as an additional departure constraint, as well as the maximum number of additional offers (brands) applicable per offer.

      value:
        {
          "bookingId": "SDZHNS",
          "journeys":
            [
              {
                  "departureLocation": { "cityCode": "MAD" },
                  "arrivalLocation": { "cityCode": "GRU" },
                  "departureDate": "2026-02-14",
                  "retainFlights": [ { "flightItemId": "20" } ]
                },
              {
                  "departureLocation": { "cityCode": "GRU" },
                  "arrivalLocation": { "cityCode": "MAD" },
                  "departureDate": "2026-03-15",
                  "departureTimeWindow": { "startTime": "11:45", "endTime": "16:45" }
                }
            ],
          "retailing":
            {
              "returnAdditionalOffers": { "numberOfAdditionalOffers": 2 }
            },
          "source": { "distributionModel": "ATPCO" },
          "tickets": [ { "number": "0452972101548" } ]
        }

    RoundTripLocationVariantSingleTravelerRequest:
      description: |
        ##### SCENARIO
        In this example, we will request a **round trip with a location variant based on the `alternateLocations` array**. We want to retrieve reshop offers for a single traveler (ticket number "1397280708735") for a journey from TIJ to MEX (with alternate arrival locations GDL, MTY, and CUN), followed by a return journey from MEX (with alternate departure locations GDL, MTY, and CUN) to TIJ on the desired date.

        ##### INSTRUCTION
        Minimal parameters required to process our request are as follows:

        | Parameter | Description |
        | :--- | ---: |
        | `journeys[0].departureLocation.airportCode` | The three-letter IATA code of the airport where the outbound journey begins. |
        | `journeys[0].arrivalLocation.airportCode` | The three-letter IATA code of the airport where the outbound journey ends. |
        | `journeys[0].departureDate` | The departure date in `YYYY-MM-DD` format, based on the airport's local time zone for the outbound journey. |
        | `journeys[0].arrivalLocation.locationVariant.alternateLocations` | Lists alternate location city or airport codes for the journey destination. |
        | `journeys[1].departureLocation.airportCode` | The three-letter IATA code of the airport where the inbound journey begins. |
        | `journeys[1].arrivalLocation.airportCode` | The three-letter IATA code of the airport where the inbound journey ends. |
        | `journeys[1].departureDate` | The departure date in `YYYY-MM-DD` format, based on the airport's local time zone for the inbound journey. |
        | `journeys[1].departureLocation.locationVariant.alternateLocations` | Lists alternate location city or airport codes for the journey origin. |
        | `tickets.number` | The electronic flight ticket number. |

        > **Note**: Optionally, a departure time window can be added as an additional departure constraint.

      value:
        {
          "journeys":
            [
              {
                  "departureLocation": { "cityCode": "TIJ" },
                  "arrivalLocation":
                    {
                      "locationVariant":
                        {
                          "alternateLocations":
                            [
                              { "cityCode": "GDL" },
                              { "airportCode": "MTY" },
                              { "airportCode": "CUN" }
                            ]
                        },
                      "cityCode": "MEX"
                    },
                  "departureDate": "2026-01-30",
                  "departureTimeWindow": { "startTime": "23:00", "endTime": "23:00" }
                },
              {
                  "departureLocation":
                    {
                      "locationVariant":
                        {
                          "alternateLocations":
                            [
                              { "cityCode": "GDL" },
                              { "airportCode": "MTY" },
                              { "airportCode": "CUN" }
                            ]
                        },
                      "cityCode": "MEX"
                    },
                  "arrivalLocation": { "cityCode": "TIJ" },
                  "departureDate": "2026-02-13",
                  "departureTimeWindow": { "startTime": "22:50", "endTime": "22:50" }
                }
            ],
          "source": { "distributionModel": "ATPCO" },
          "tickets": [ { "number": "1397280708735" } ]
        }

    OneWaySingleTravelerResponse:
      description: |
        ##### SUMMARY
        Depending on availability and fare conditions, the API response may include up to fifty (50) exchange options for ticket number "0012972101507".
        Each option includes:
        - details of the document exchange cost under `offers.totalPriceDifference`
        - total cost of the exchange operation under `offers.totalPriceDifference.grandTotal`
        - updated flight information referenced via the `offers.journeyRefs` parameter

        ##### NEXT STEPS
        As the next step in the exchange process, we must make a booking change request including flight details from a selected offer. Once the booking is successfully updated with the new itinerary, the process continues with fulfillment of the new ticket.

