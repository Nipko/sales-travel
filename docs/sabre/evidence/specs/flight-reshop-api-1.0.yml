    RoundTripMultipleTravelersResponse:
      description: |
        ##### SUMMARY
        Depending on availability and fare conditions, the API response may include up to fifty (50) exchange options for requested tickets.
        Each option includes:
        - Details of the document exchange cost under `offers.items.fares.priceDifference`. This information is grouped by traveler type — the list of applicable documents is presented under the `offers.items.fares.travelers.ticketNumber` parameter. The displayed ticket cost applies individually to each traveler in the `travelers` array.
        - the total cost of the exchange operation under `offers.totalPriceDifference.grandTotal`
        - new fare details under the `offers.items.fares.fareComponents` parameter
        - associated flight information referenced via the `offers.journeyRefs` parameter

        ##### NEXT STEPS
        As the next step in the exchange process, we must make a booking change request including flight details from a selected offer. Once the booking is successfully updated with the new itinerary, the process continues with fulfillment of the new tickets.

