  schemas:
    Error:
      type: object
      description: Contains error information.
      required:
        - category
        - type
      properties:
        category:
          type: string
          example: 'BAD_REQUEST'
          description: The category of the error.
        type:
          type: string
          example: 'INVALID_VALUE'
          description: The type of the error.
        description:
          type: string
          example: 'Validation Failed: must match \"^[A-Z0-9]{6,}$\"'
          description: The detailed description of the error.
        fieldPath:
          type: string
          example: 'FlightReshopRequest'
          description: The field path of the request if the error is related to a specific request or response parameter.
        fieldName:
          type: string
          example: 'bookingId'
          description: The field name of the request if the error is related to a specific request or response parameter.
        fieldValue:
          type: string
          example: 'A'
          description: The field value of the request if the error is related to a specific request or response parameter.

    Warning:
      type: object
      description: Contains warning information.
      required:
        - category
        - type
      properties:
        category:
          type: string
          example: 'IGNORED_DETAILS'
          description: The category of the warning.
        type:
          type: string
          example: 'BOOKING_ID_NOT_APPLICABLE'
          description: The type of the warning.
        description:
          type: string
          example: 'The bookingId was ignored for the selected distribution model as it is not used in processing for this
            source.'
          description: The detailed description of the warning.
        fieldPath:
          type: string
          example: 'FlightReshopRequest.source'
          description: The field path of the request if the warning is related to a specific request or response parameter.
        fieldName:
          type: string
          example: 'distributionModel'
          description: The field name of the request if the warning is related to a specific request or response parameter.
        fieldValue:
          type: string
          example: 'ATPCO'
          description: The field value of the request if the warning is related to a specific request or response parameter.

    HiddenStop:
      type: object
      description: Contains detailed information about the hidden stop location.
      required:
        - airportCode
      properties:
        airportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'DFW'
          description: The three-letter IATA airport code of the hidden stop location.
        departureDate:
          type: string
          format: date
          example: '2019-07-09'
          description: The scheduled departure date in `YYYY-MM-DD` format in the airport's time zone.
        departureTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:15'
          description: The scheduled time of departure in `HH:MM` format.
        arrivalDate:
          type: string
          format: date
          example: '2019-07-09'
          description: The scheduled arrival date in `YYYY-MM-DD` format in the airport's time zone.
        arrivalTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '12:28'
          description: The scheduled time of arrival in `HH:MM` format.
        aircraftTypeCode:
          type: string
          pattern: '^[A-Z0-9]{2,3}$'
          example: 'E90'
          description: The IATA code of the aircraft.
        durationInMinutes:
          type: integer
          format: int32
          minimum: 1
          example: 300
          description: Layover duration in minutes.

    ReasonForIssuanceEnum:
      type: string
      default: 'Unknown'
      example: 'Baggage'
      description: Identifies the reason for issuance code (RFIC) defined by IATA applicable to the Electronic Miscellaneous
        Document (EMD) that will be issued for the subcode defined in the record. `Unknown` is used for the read-only
        purpose by the `getBooking` endpoint of the Booking Management API.
      enum:
        - Air Transportation
        - Surface Transportation Non Air Services
        - Baggage
        - Financial Impact
        - Airport Services
        - Merchandise
        - Inflight Services
        - Individual Airline Use
        - Unknown

    Tax:
      type: object
      description: Contains desired tax codes and their associated amounts.
      required:
        - taxCode
        - amount
      properties:
        taxCode:
          type: string
          pattern: '^[A-Z0-9]{2}$'
          example: 'XY'
          description: The desired tax code. Must be combined with `amount`.
        amount:
          type: string
          format: number
          minimum: 0
          example: '100.00'
          description: The monetary amount of tax defined by `taxCode`.

    FlightReshopRequest:
      type: object
      description: Contains both required and optional details used as search parameters in an itinerary reissue request for
        an existing ticket or order.
      required:
        - journeys
      properties:
        targetPcc:
          type: string
          pattern: '^[A-Z0-9]{3,4}$'
          example: 'AAA'
          description: The pseudo city code of the target destination for which the flight reshop is requested.
        bookingId:
          type: string
          pattern: '^[A-Z0-9]{6,}$'
          example: 'GLEBNY'
          description: The booking reference ID as shown in the source supplier/vendor system. In the traditional ATPCO
            distribution model, this corresponds to the PNR Locator value.
        journeys:
          type: array
          minItems: 1
          maxItems: 10
          description: Lists information about all individual journeys to search for.
          items:
            $ref: '#/components/schemas/RequestedJourney'
            description: Contains details of a journey, defined by an origin and destination location set and including other
              optional search parameters.
        travelers:
          type: array
          minItems: 1
          maxItems: 9
          description: Lists information about the travelers.
          items:
            $ref: '#/components/schemas/RequestedTraveler'
            description: Contains traveler information.
        route:
          $ref: '#/components/schemas/RequestedRoute'
          description: Contains qualifiers that allow you to modify the requested trip.
        departureDateFlexibility:
          $ref: '#/components/schemas/DateFlexibility'
          description: Contains qualifiers that allow you to define date flexibility for the requested trip. By default, multiple
            offers may be returned for the main travel date, with a maximum of one offer per date for the remaining
            dates within the flexibility range.
        airlines:
          $ref: '#/components/schemas/RequestedAirlines'
          description: Contains carrier filters for airlines that the API is expected to process or exclude from processing.
        fare:
          $ref: '#/components/schemas/RequestedFare'
          description: Contains qualifiers that allow you to modify the price of offers.
        retailing:
          $ref: '#/components/schemas/RequestedRetailingAttributes'
          description: Contains qualifiers which allow you to obtain retailing features.
        source:
          $ref: '#/components/schemas/RequestedSource'
          description: Contains distribution model details to determine the exchange processing path.
        tickets:
          type: array
          minItems: 1
          maxItems: 9
          description: Lists tickets whose details should be used to determine possible exchange offers.
          items:
            $ref: '#/components/schemas/TicketToExchange'
            description: Contains information about an electronic flight ticket considered for an exchange.
        processingOptions:
          $ref: '#/components/schemas/ProcessingOptions'
          description: Contains configuration attributes.

    RequestedSource:
      type: object
      description: Contains distribution model details to determine the exchange processing path.
      properties:
        distributionModel:
          $ref: '#/components/schemas/DistributionModelTypeEnum'
          description: Identifies the distribution model of the booking.

    RequestedRetailingAttributes:
      type: object
      description: Contains qualifiers which allow you to obtain retailing features.
      properties:
        returnOfferAttributes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Lists offer attributes to include in the response for both branded and non-branded fares if applicable.
          items:
            $ref: '#/components/schemas/RetailingOfferAttributesEnum'
            description: Identifies the type of offer attribute which should be included in the response. Can be `Baggage` or
              `Flexibility`.
        filterByOfferAttributes:
          $ref: '#/components/schemas/RetailingOfferAttributesFilter'
          description: Contains retailing attribute filters you can use to refine the offer search.
        returnAdditionalOffers:
          $ref: '#/components/schemas/ReturnAdditionalOffers'
          description: Contains the requested number of additional offer solutions to retrieve, formerly known as brands.
        avoidBrandDowngrade:
          type: boolean
          example: false
          description: If `true`, only the same or higher-quality branded fares are offered during the exchange process for all
            flights, respecting the passenger's original choice and potentially avoiding unexpected cost increases due
            to a less desirable brand. Applies globally to the entire itinerary but is superseded by
            `retainOriginalBrand` for flights specified in `retainFlights`.
        retainOriginalBrand:
          type: boolean
          example: false
          description: If `true`, service will validate the corresponding brand for the unchanged flights (specified by means of
            `retainFlights` parameter within `journeys` list) and return offer in the originally ticketed brand only.
            This enforces exact brand matching for retained flights, taking precedence over `avoidBrandDowngrade` for
            those segments. Can be combined with `avoidBrandDowngrade` to apply different brand rules to changed vs.
            unchanged flights.
        brandParityMode:
          $ref: '#/components/schemas/BrandParityModeEnum'
          description: Identifies preferences of the Brand Parity calculation logic for the cheapest fare or branded upgrades
            within each offer. Can be `Journey` (forces a single brand within separate journeys) or `Itinerary` (forces
            a single brand for the whole itinerary). Must be combined with `returnAdditionalOffers` set to `true`.
        offerUpgradesParityMode:
          $ref: '#/components/schemas/BrandParityModeEnum'
          description: Identifies preferences of the Brand Parity calculation logic for the cheapest fare or branded upgrades
            within each offer. Can be `Journey` (forces a single brand within separate journeys) or `Itinerary` (forces
            a single brand for the whole itinerary). Must be combined with `returnAdditionalOffers` set to `true`.

    ProcessingOptions:
      type: object
      description: Contains configuration attributes.
      properties:
        excludeFareFocusFares:
          type: boolean
          example: false
          description: If `true`, Fare Focus fares are excluded during pricing.

    RetailingOfferAttributesFilter:
      type: object
      description: Contains retailing attribute filters you can use to refine the offer search.
      properties:
        hasFreeRefund:
          type: boolean
          default: false
          example: true
          description: If `true`, returns only fare options that include a free refund.
        hasFreeChange:
          type: boolean
          default: false
          example: true
          description: If `true`, returns only fare options that include a free exchange.
        isRefundAllowed:
          type: boolean
          default: false
          example: true
          description: If `true`, returns only refundable fare options.
        isChangeAllowed:
          type: boolean
          default: false
          example: true
          description: If `true`, returns only exchangeable fare options.

    ReturnAdditionalOffers:
      type: object
      description: Contains the requested number of additional offer solutions to retrieve, formerly known as brands.
      properties:
        numberOfAdditionalOffers:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
          default: 4
          example: 3
          description: The number of additional offer solutions to return.

    DateFlexibility:
      type: object
      description: Contains qualifiers that allow you to define date flexibility for the requested trip. By default, multiple
        offers may be returned for the main travel date, with a maximum of one offer per date for the remaining dates
        within the flexibility range.
      properties:
        returnMultipleOffers:
          type: boolean
          default: true
          example: false
          description: If `true`, applies the default date flexibility logic. If `false`, returns at most one offer per date
            across the entire date flexibility range. Requires setting date flexibility parameters (`DateRange` or
            `DateFlexibilityJourneyRanges`).
      additionalProperties: false
      oneOf:
        - $ref: '#/components/schemas/DateRange'
          description: Contains a travel date range measured in days which alters the search results by expanding the requested
            travel date. Applied globally.
        - type: object
          title: DateFlexibilityJourneyRanges
          properties:
            journeyRanges:
              type: array
              minItems: 1
              description: Lists travel date ranges measured in days which alter the search results by expanding the requested travel
                date. Date ranges are applied to specific journeys based on the `journeyIndices` array.
              items:
                $ref: '#/components/schemas/JourneyDateRange'
                description: Contains a search window measured in days around the requested travel date which is applied to journeys
                  listed in `journeyIndices`.
          additionalProperties: false

    RequestedFare:
      type: object
      description: Contains qualifiers that modify the price of offers.
      properties:
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
          description: The three-letter currency code in ISO 4217 standard preferred for retrieving monetary values.
        cabin:
          $ref: '#/components/schemas/FareCabin'
          description: Contains qualifiers with cabin preferences and cabin processing logic.
        forcePassengerType:
          type: boolean
          example: false
          description: If `true`, prices journey options on the basis of the desired passenger type.
        forceRetailerRule:
          type: boolean
          default: false
          example: true
          description: If `true`, only returns fares with a matching retailer rule code. Must be combined with a single `Retailer
            Rule Code` program within the `programs` array.
        restrictFaresTo:
          $ref: '#/components/schemas/FareTypesEnum'
          description: Identifies the fare type to return in the response. Can be `Private` (with or without an account code,
            depending on whether it's specified within the `programs` array) or `Public`.
        restrictToProgramCodes:
          type: boolean
          example: true
          description: If `true`, only returns fares filed with an account code or corporate ID, even if cheaper fares exist
            without a linked fare program. Must be combined with at least one `Account Code` or `Corporate Id` program
            within the `programs` array.
        useOriginalPricing:
          type: boolean
          default: false
          example: true
          description: If `true`, the original ticket pricing parameters (negotiated and corporate codes, passenger type
            overrides, and retailer rules) are automatically applied to reshop offers.
        programs:
          type: array
          minItems: 1
          description: Lists fare programs and their corresponding qualifiers. It's possible to use a mix of `Account Code` and
            `Corporate Id` programs, but their total number cannot exceed four (4). The same limit applies to `Retailer
            Rule Code` programs, unless the `forcePassengerType` parameter is used, in which case only a single
            `Retailer Rule Code` program can be provided.
          items:
            $ref: '#/components/schemas/FareProgram'
            description: Contains program details which agencies and airlines use for fare filing purposes. These are usually
              private fares available to a limited number of customers.
        brandedFareFilters:
          type: array
          minItems: 1
          maxItems: 9
          description: Lists preferred filters related to branded fares that affect search results. If a single filter item is
            defined without an associated `journeyIndices`, it applies the preferred filter to every journey in the
            entire trip.
          items:
            $ref: '#/components/schemas/BrandedFareFilter'
            description: Contains a preferred branded fare search filter.
        exemptTaxCodes:
          type: array
          minItems: 1
          maxItems: 99
          description: Lists tax codes to exclude. Cannot be combined with `exemptMode` or `overrideTaxes`.
          items:
            type: string
            pattern: '^[A-Z]{1,2}$'
            example: 'UB'
            description: A tax code to exclude.
        overrideTaxes:
          type: array
          minItems: 1
          maxItems: 99
          description: Lists tax codes and associated override amounts. Cannot be combined with `exemptMode` or `exemptTaxCodes`.
          items:
            $ref: '#/components/schemas/Tax'
            description: Contains desired tax codes and their override amounts.
        priceGuarantee:
          $ref: '#/components/schemas/PriceGuaranteeEnum'
          description: Identifies how the fare search algorithm treats Category 31 fares. Can be `Always` (returns options
            determined by the automated Voluntary Changes category of the originally ticketed fare), `Never` (returns
            options not determined by the automated Voluntary Changes category of the originally ticketed fare), `Never
            With Fee` (the same conditions as for the `Never` option apply, but the exchange fee is obtained from
            Category 16), `Auto-Redirect` (if possible, attempts to return options determined by the automated Voluntary
            Changes category of the originally ticketed fare; otherwise, returns options not determined by this
            category), or `Auto-Redirect With Fee` (the same conditions as for the `Auto-Redirect` option apply, but the
            exchange fee is obtained from Category 16 for offers where `isPriceGuaranteed` is set to `false`).
        exemptMode:
          $ref: '#/components/schemas/ExemptModeEnum'
          description: Identifies the exempt mode, which impacts how journey options are priced. Can be `Taxes` (exempt taxes and
            include fees and passenger facility charges) or `Taxes And Fees` (exempt taxes and fees and include
            applicable passenger facility charges). Setting `exemptMode` prevents from using specific tax-related
            operations (`overrideTaxes` or `exemptTaxCodes`) as these parameters are mutually exclusive.

    FareCabin:
      type: object
      description: Contains qualifiers with cabin preferences and cabin processing logic.
      properties:
        logic:
          $ref: '#/components/schemas/CabinLogicEnum'
          description: Identifies which cabin processing logic applies. Applies to ATPCO content only.
      oneOf:
        - $ref: '#/components/schemas/RequestedCabin'
          description: Contains the preferred cabin type. Applied globally.
        - $ref: '#/components/schemas/RequestedCabinPerJourney'
          description: Contains the preferred cabin type. Applied per journey selection.

    FareProgram:
      type: object
      description: Contains program details which agencies and airlines use for fare filing purposes. These are usually
        private fares available to a limited number of customers.
      required:
        - type
        - values
      properties:
        type:
          $ref: '#/components/schemas/FareProgramTypeEnum'
          description: Identifies the source of a code for which a customer may have filed fares. Can be an ATPCO `Account Code`,
            Sabre `Corporate Id`, or `Retailer Rule Code` (doesn't limit results to fares matching a specified code,
            unless the `forceRetailerRule` parameter is set to `true`, but rather to the cheapest fares, which may or
            may not have a matching retailer rule qualifier).
        values:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: Lists values associated with the qualifier's `type` to allow the API to generate offers with fares filed
            with it.
          items:
            type: string
            example: 'ACC33'
            description: A code corresponding to the selected `type`, such as an ATPCO Account Code, Sabre Corporate ID, or Retailer
              Rule Code.

    FareProgramTypeEnum:
      type: string
      default: 'Account Code'
      example: 'Account Code'
      description: Identifies the source of a code for which a customer may have filed fares. Can be an ATPCO `Account Code`,
        Sabre `Corporate Id`, or `Retailer Rule Code` (doesn't limit results to fares matching a specified code, unless
        the `forceRetailerRule` parameter is set to `true`, but rather to the cheapest fares, which may or may not have
        a matching retailer rule qualifier).
      enum:
        - Account Code
        - Corporate Id
        - Retailer Rule Code

    RetailingOfferAttributesEnum:
      type: string
      example: 'Baggage'
      description: Identifies the type of offer attribute which should be included in the response. Can be `Baggage` or
        `Flexibility`.
      enum:
        - Baggage
        - Flexibility

    RequestedCabin:
      type: object
      description: Contains the preferred cabin type.
      properties:
        name:
          $ref: '#/components/schemas/CabinNameEnum'
          description: Identifies the aircraft cabin name for which the API is expected to generate offers.
      additionalProperties: false

    RequestedCabinPerJourney:
      type: object
      description: Contains the preferred cabin type. Applied per journey selection.
      properties:
        preferences:
          type: array
          minItems: 1
          description: Lists preferred cabin type names that can be selected within each journey.
          items:
            $ref: '#/components/schemas/CabinPerJourneyPreferences'
            description: Contains the preferred cabin type name.
      additionalProperties: false

    CabinPerJourneyPreferences:
      type: object
      description: Contains the preferred cabin type. Applied to the selected journeys.
      required:
        - name
        - journeyIndices
      properties:
        name:
          $ref: '#/components/schemas/CabinNameEnum'
          description: Identifies the aircraft cabin name for which the API is expected to generate offers.
        journeyIndices:
          type: array
          minItems: 1
          description: Lists indices of journeys within the `journeys` array to which the selected cabin type applies.
          items:
            type: integer
            format: int32
            minimum: 0
            example: 1
            description: The index of a journey.

    CabinNameEnum:
      type: string
      example: 'Economy'
      description: Identifies the aircraft cabin name for which the API is expected to generate offers.
      enum:
        - Premium First
        - First
        - Premium Business
        - Business
        - Premium Economy
        - Economy

    CabinNameResponseEnum:
      type: string
      default: 'Unknown'
      example: 'Economy'
      description: Identifies the aircraft cabin name for which the API generated offers.
      enum:
        - Premium First
        - First
        - Premium Business
        - Business
        - Premium Economy
        - Economy
        - Unknown

    CabinLogicEnum:
      type: string
      default: 'Avoid Cabin Downgrade - Main Flight'
      example: 'Jump Cabin'
      description: Identifies which cabin processing logic applies. Applies to ATPCO content only.
      enum:
        - Jump Cabin
        - Keep Same Cabin
        - Avoid Cabin Downgrade - All Flights
        - Avoid Cabin Downgrade - Main Flight

    FareTypesEnum:
      type: string
      example: 'Private'
      description: Identifies the fare type to return in the response. Can be `Private` (with or without an account code,
        depending on whether it's specified within the `programs` array) or `Public`.
      enum:
        - Private
        - Public

    RequestedAirlines:
      type: object
      description: Contains airline filters that the API is expected either to process or exclude from processing.
      minProperties: 1
      properties:
        marketingAirlinesFilter:
          $ref: '#/components/schemas/AirlinesFilter'
          description: Contains airline filter parameters.
      additionalProperties: false

    RequestedRoute:
      type: object
      description: Contains qualifiers that allow you to modify the requested trip.
      properties:
        connections:
          type: array
          minItems: 1
          description: Lists preferred connection cities or airports that can be selected within each journey. If a city code is
            used, e.g. `LON` (London), the API considers all airports that belong to that city, as per settings defined
            for multiairport cities. If only one airport code is used to define a connection point, e.g. `LHR` (London
            Heathrow Airport), only this particular airport is taken into consideration while searching for itinerary
            options. If more than one connection city or airport is provided, itinerary options are returned for one of
            the defined cities or airports serving as a connection point, or connection points are constructed from a
            combination of the indicated cities or airports. Each journey can have up to nine (9) connection locations
            assigned. If a particular connection item is defined without an associated `journeyIndices` item, the API
            applies the connection preferences to every journey in the entire trip.
          items:
            $ref: '#/components/schemas/ConnectionLocation'
            description: Contains connection location parameters for specific `journeyIndices`.
        maximumNumberOfStops:
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          example: 2
          description: The maximum number of stops (or connections) allowed in each direction of the requested journey.

    BrandedFareFilter:
      type: object
      description: Contains a preferred branded fare search filter. A single filter can define either brand preference or
        brand exclusion.
      properties:
        journeyIndices:
          type: array
          minItems: 1
          description: Lists indices of journeys within the `journeys` array to which the brand filter applies.
          items:
            type: integer
            format: int32
            minimum: 0
            example: 1
            description: The index of a journey.
      oneOf:
        - type: object
          title: BrandCodesFilter
          properties:
            brandCodes:
              type: array
              minItems: 1
              uniqueItems: true
              description: Lists brand codes that offers will be restricted to.
              items:
                type: string
                pattern: '^[A-Z]{1,10}$'
                example: 'ECOFLEX'
                description: The brand code.
          additionalProperties: false
        - type: object
          title: ExcludeBrandCodesFilter
          properties:
            excludeBrandCodes:
              type: array
              minItems: 1
              uniqueItems: true
              description: Lists brand codes to exclude from offers.
              items:
                type: string
                pattern: '^[A-Z]{1,10}$'
                example: 'ECOFLEX'
                description: The brand code.
          additionalProperties: false

    FlightReshopResponse:
      type: object
      description: Contains search results of offers for the desired exchange conditions.
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2020-10-28T11:11:21.123Z'
          description: The exact point in time when the response was generated. Expressed in UTC and presented in the
            `YYYY-MM-DDTHH:MM:SS.SSSZ` format.
        flights:
          type: array
          minItems: 1
          description: Lists all flights utilized to construct journeys of exchange offerings.
          items:
            $ref: '#/components/schemas/Flight'
            description: Contains flight details utilized to construct journeys of exchange offerings.
        journeys:
          type: array
          minItems: 1
          description: Lists all journeys utilized to construct exchange offerings.
          items:
            $ref: '#/components/schemas/Journey'
            description: Contains journey details utilized to construct exchange offerings.
        numberOfOffers:
          type: integer
          format: int32
          maximum: 50
          example: 1
          description: The total number of returned offers.
        offers:
          type: array
          minItems: 1
          description: Lists a selection of offers that match the requested exchange conditions.
          items:
            $ref: '#/components/schemas/Offer'
            description: Contains an offer that matches the desired exchange conditions.
        offerAttributes:
          $ref: '#/components/schemas/OfferAttributes'
          description: Contains offer attributes for both branded and non-branded fares.
        associatedElectronicMiscellaneousDocuments:
          type: array
          minItems: 1
          maxItems: 9
          description: Lists Electronic Miscellaneous Documents associated with a particular electronic flight ticket (EMD-A).
          items:
            $ref: '#/components/schemas/AssociatedElectronicMiscellaneousDocuments'
            description: Contains details of Electronic Miscellaneous Documents associated with a particular electronic flight
              ticket (EMD-A).
        errors:
          type: array
          minItems: 1
          description: Lists detailed error information. This array is not displayed in successful responses.
          items:
            $ref: '#/components/schemas/Error'
            description: Contains error information.
        warnings:
          type: array
          minItems: 1
          description: Lists detailed warning information.
          items:
            $ref: '#/components/schemas/Warning'
            description: Contains warning information.
        request:
          $ref: '#/components/schemas/FlightReshopRequest'
          description: Contains a copy of the request.

    OfferAttributes:
      type: object
      description: Contains offer attributes for both branded and non-branded fares.
      properties:
        checkedBaggageItems:
          type: array
          minItems: 1
          uniqueItems: true
          description: Lists information about checked baggage.
          items:
            $ref: '#/components/schemas/Baggage'
        carryOnBaggageItems:
          type: array
          minItems: 1
          uniqueItems: true
          description: Lists information about carry-on baggage.
          items:
            $ref: '#/components/schemas/Baggage'
        refundabilityItems:
          type: array
          minItems: 1
          uniqueItems: true
          description: Lists information about refund charges.
          items:
            $ref: '#/components/schemas/RefundChangeCharges'
            description: Contains information about refund or change charges.
        changeItems:
          type: array
          minItems: 1
          uniqueItems: true
          description: Lists information about change charges.
          items:
            $ref: '#/components/schemas/RefundChangeCharges'
            description: Contains information about refund or change charges.

    RefundChangeCharges:
      type: object
      description: Contains information about refund or change charges.
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          example: 'c693e9b2-1782-45f9-82f6-73f8cdd13cfa'
          description: The ID of the offer attribute.
        beforeDeparture:
          $ref: '#/components/schemas/FlexibilityRule'
          description: Contains change charges applicable before departure.
        afterDeparture:
          $ref: '#/components/schemas/FlexibilityRule'
          description: Contains change charges applicable after departure.

    FlexibilityRule:
      type: object
      description: Contains conditions of voluntary changes or refunds, as well as applicable fees.
      required:
        - isPermitted
      properties:
        isPermitted:
          type: boolean
          example: true
          description: If `true`, ticket change or refund are permitted for a given fare. Ticket change or refund can be permitted
            free of charge (charge equals 0) or with a charge fee.
        maxCharge:
          type: string
          format: number
          minimum: 0
          example: '14.00'
          description: The maximum cost of a ticket change or refund in a given fare.
        minCharge:
          type: string
          format: number
          minimum: 0
          example: '7.00'
          description: The minimum cost of a ticket change or refund in a given fare.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
          description: The three-letter ISO 4217 currency code.

    RequestedTraveler:
      type: object
      description: Contains traveler information.
      properties:
        givenName:
          type: string
          example: 'John'
          description: The traveler's first name.
        middleName:
          type: string
          example: 'Jack'
          description: The traveler's middle name.
        surname:
          type: string
          example: 'Smith'
          description: The traveler's last name.
        age:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
          example: 20
          description: The age of the traveler. Required for passengers who qualify for a discount related to their age.
        passengerTypeCode:
          type: string
          pattern: '^[0-9A-Z]{3}$'
          example: 'ADT'
          description: The ATPCO code of the passenger type to apply during the search. Use only if the value differs from the
            data stored in the current ticket document.

    TicketToExchange:
      type: object
      description: Contains information about an electronic flight ticket considered for an exchange.
      required:
        - number
      properties:
        number:
          type: string
          pattern: '^[0-9A-Z/-]+$'
          example: '0167489825830'
          description: The electronic flight ticket number.
        date:
          type: string
          format: date
          example: '2019-07-01'
          description: The date the electronic flight ticket was issued in `YYYY-MM-DD` format.
        travelerIndex:
          type: integer
          format: int32
          minimum: 1
          example: 1
          description: Specifies the traveler from the `travelers` array whose name is associated with the ticket.
        overrideCheckedInTicketCoupons:
          type: boolean
          default: false
          example: true
          description: If `true`, treats all checked in coupons as open, even though they remain unchanged in the ticket system.
            For an actual exchange to take place, the processing of the CKIN coupon is at the discretion of the airline.
            They determine how to handle it based on their policies and procedures.

    RequestedJourney:
      type: object
      description: Contains details of a journey, defined by an origin and destination location set and including other
        optional search parameters.
      required:
        - departureLocation
        - arrivalLocation
        - departureDate
      properties:
        departureLocation:
          $ref: '#/components/schemas/Location'
          description: Contains a departure city or airport IATA code.
        arrivalLocation:
          $ref: '#/components/schemas/Location'
          description: Contains an arrival city or airport IATA code.
        departureDate:
          type: string
          format: date
          example: '2024-11-11'
          description: The departure date in `YYYY-MM-DD` format in the airport's time zone.
        departureTimeWindow:
          $ref: '#/components/schemas/TimeWindow'
          description: Contains a departure time window.
        arrivalTimeWindow:
          $ref: '#/components/schemas/TimeWindow'
          description: Contains an arrival time window.
        retainFlights:
          type: array
          minItems: 1
          description: Lists segments referenced by their `flightItemId` or their details, including flights and any ground
            transportation (such as buses and trains) related to the journey. Flight information takes priority during
            offer searches and is part of the unmodifiable journey conditions.
          items:
            $ref: '#/components/schemas/RetainItem'
            description: Contains details of the segment to retain.

    DateRange:
      type: object
      description: Contains a search window measured in days around the requested travel date. It can be set by providing a
        single value, which creates a range of days before and after the travel date, or by specifying separate values
        for days before and days after. The total number of days in the range cannot be greater than six (6).
      oneOf:
        - type: object
          title: DateRangePlusMinusDays
          properties:
            plusMinusDays:
              type: integer
              format: int32
              minimum: 1
              maximum: 3
              example: 1
              description: The number of days before and after the requested travel date which determines the search window.
          additionalProperties: false
        - type: object
          title: DateRangePlusDaysMinusDays
          properties:
            minusDays:
              type: integer
              format: int32
              minimum: 1
              maximum: 6
              example: 1
              description: The number of days before the requested travel date. If combined with `plusDays`, the final search window
                cannot exceed six (6) days.
            plusDays:
              type: integer
              format: int32
              minimum: 1
              maximum: 6
              example: 1
              description: The number of days after the requested travel date. If combined with `minusDays`, the final search window
                cannot exceed six (6) days.
          additionalProperties: false

    JourneyDateRange:
      type: object
      description: Contains a search window measured in days around the requested travel date. Applies to the selected journeys.
      allOf:
        - $ref: '#/components/schemas/DateRange'
        - type: object
          required:
            - journeyIndices
          properties:
            journeyIndices:
              type: array
              minItems: 1
              description: Lists indices of journeys within the `journeys` array to which the selected date range applies.
              items:
                type: integer
                format: int32
                minimum: 0
                example: 1
                description: The index of a journey.

    TimeWindow:
      type: object
      description: Contains the period in which an event is expected to occur.
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:15'
          description: Defines the window starting time in `HH:MM` format.
        endTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '13:45'
          description: Defines the window ending time in `HH:MM` format.

    GenericLocation:
      type: object
      description: Contains the origin, destination, or connection location of the requested journey. A location can be
        defined either by city code or by airport code.
      oneOf:
        - type: object
          title: LocationByCityCode
          properties:
            cityCode:
              type: string
              pattern: '^[A-Z]{3}$'
              example: 'NYC'
              description: The three-letter IATA city code.
          additionalProperties: false
        - type: object
          title: LocationByAirportCode
          properties:
            airportCode:
              type: string
              pattern: '^[A-Z]{3}$'
              example: 'DFW'
              description: The three-letter IATA airport code.
          additionalProperties: false

    ConnectionLocation:
      type: object
      description: Contains connection location parameters.
      allOf:
        - $ref: '#/components/schemas/GenericLocation'
        - type: object
          properties:
            journeyIndices:
              type: array
              minItems: 1
              description: Lists indices of journeys within the `journeys` array to which the selected connection location applies.
              items:
                type: integer
                format: int32
                minimum: 0
                example: 1
                description: The index of a journey.

    Location:
      type: object
      description: Contains the location code for either origin or destination, with an optional radius parameter.
      allOf:
        - $ref: '#/components/schemas/GenericLocation'
        - type: object
          properties:
            locationVariant:
              $ref: '#/components/schemas/LocationVariant'
              description: Contains parameters used to set location variants based either on multiple location codes or on a search
                radius.

    LocationVariant:
      type: object
      description: Contains parameters used to set location variants based either on multiple location codes or on a search radius.
      oneOf:
        - type: object
          title: LocationVariantByAlternateCodes
          properties:
            alternateLocations:
              type: array
              minItems: 1
              maxItems: 4
              description: Lists IATA codes of alternate location cities or airports.
              items:
                $ref: '#/components/schemas/GenericLocation'
                description: Contains the origin, destination, or connection location of the requested journey.
          additionalProperties: false
        - type: object
          title: LocationVariantByRadius
          properties:
            radius:
              $ref: '#/components/schemas/LocationRadius'
              description: Contains radius parameters to broaden the search around the given location.
          additionalProperties: false

    LocationRadius:
      type: object
      description: Contains radius parameters to broaden the search around the given location.
      required:
        - inMiles
      properties:
        inMiles:
          type: integer
          format: int32
          minimum: 5
          maximum: 100
          example: 50
          description: Distance from the specified location measured in miles.
        returnOnlyWithinSameCountry:
          type: boolean
          default: true
          description: If `true`, limits the radius search to the same origin or destination country.

    BrandParityModeEnum:
      type: string
      example: 'Itinerary'
      description: Identifies preferences of the Brand Parity calculation logic for the cheapest fare or branded upgrades
        within each offer. Can be `Journey` (forces a single brand within separate journeys) or `Itinerary` (forces a
        single brand for the whole itinerary). Must be combined with `returnAdditionalOffers` set to `true`.
      enum:
        - Journey
        - Itinerary

    AirlinesFilter:
      type: object
      description: Contains airline filter parameters. A single filter can define either a list of airlines to include or a
        list of airlines to exclude.
      oneOf:
        - type: object
          title: AirlineCodesFilter
          properties:
            airlineCodes:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              description: Lists airline codes that offers will be restricted to.
              items:
                type: string
                description: The code of the airline.
                pattern: '^([A-Z0-9]{2}|[A-Z]{3})$'
                example: 'AA'
          additionalProperties: false
        - type: object
          title: ExcludeAirlineCodesFilter
          properties:
            excludeAirlineCodes:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              description: Lists airline codes to exclude from offers.
              items:
                type: string
                description: The code of the airline.
                pattern: '^([A-Z0-9]{2}|[A-Z]{3})$'
                example: 'BA'
          additionalProperties: false

    RetainItem:
      type: object
      description: Contains details of an item to retain. A retained flight can be identified either by its flight item ID or
        by providing full flight details.
      oneOf:
        - type: object
          title: RetainItemByFlightItemId
          properties:
            flightItemId:
              type: string
              pattern: '^[A-Z0-9]+$'
              example: '12'
              description: The ID of a flight.
          additionalProperties: false
        - type: object
          title: RetainItemByFlightDetails
          properties:
            flightDetails:
              $ref: '#/components/schemas/RetainFlightItem'
              description: Contains details of the flight to retain.
          additionalProperties: false

    RetainFlightItem:
      type: object
      description: Contains details of a flight to retain.
      required:
        - marketingFlightNumber
        - marketingAirlineCode
        - departureAirportCode
        - arrivalAirportCode
        - departureDate
        - departureTime
        - arrivalDate
        - arrivalTime
        - bookingClassCode
      properties:
        marketingFlightNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
          example: 123
          description: The flight number associated with the marketing carrier.
        marketingAirlineCode:
          type: string
          pattern: '^[A-Z0-9]{2}$'
          example: 'AA'
          description: The two-letter [IATA](https://www.iata.org/about/members/Pages/airline-list.aspx?All=true) designator code
            of the marketing airline.
        operatingFlightNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
          example: 321
          description: The flight number associated with the operating carrier.
        operatingAirlineCode:
          type: string
          pattern: '^[A-Z0-9]{2}$'
          example: 'UA'
          description: The two-letter [IATA](https://www.iata.org/about/members/Pages/airline-list.aspx?All=true) designator code
            of the operating airline.
        departureAirportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'DFW'
          description: The three-letter IATA airport code of the origin airport.
        arrivalAirportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'HNL'
          description: The three-letter IATA airport code of the destination airport.
        departureDate:
          type: string
          format: date
          example: '2019-07-09'
          description: The scheduled departure date in `YYYY-MM-DD` format in the airport's time zone.
        departureTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:15'
          description: The scheduled time of departure in `HH:MM` format.
        arrivalDate:
          type: string
          format: date
          example: '2019-07-09'
          description: The scheduled arrival date in `YYYY-MM-DD` format in the airport's time zone.
        arrivalTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '12:28'
          description: The scheduled time of arrival in `HH:MM` format.
        bookingClassCode:
          type: string
          pattern: '^[A-Z]{1,2}$'
          example: 'Y'
          description: The booking inventory code of the marketing airline.
        flightStatusCode:
          type: string
          pattern: '^[A-Z]{2}$'
          example: 'HK'
          description: The two-letter status code used by vendors. It indicates the booking status.
        brandCode:
          type: string
          example: 'ECOFLEX'
          description: The code of the Branded Fare associated with the flight.
        keepBookingClass:
          type: boolean
          example: false
          description: If `true`, the API doesn't modify the booking inventory code of the flight. Setting to `true` requires
            specifying the same value for all flights in the `retainFlights` array within a single journey.
        creationDate:
          type: string
          format: date
          example: '2021-01-09'
          description: The date in `YYYY-MM-DD` format when the flight was booked and stored in the booking.
        creationTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '15:00'
          description: The time in `HH:MM` format when the flight was booked and stored in the booking.

    Offer:
      type: object
      description: Contains details of an offer that matches the desired exchange conditions.
      required:
        - id
        - source
        - journeyRefs
        - items
      properties:
        id:
          type: string
          example: '123eww324'
          description: The ID of the offer.
        source:
          $ref: '#/components/schemas/Source'
          description: Contains the source of the offer determined by the exchange processing path.
        createdAt:
          type: string
          format: date-time
          example: '2020-10-28T11:11:21Z'
          description: The exact point in time expressed in UTC when the offer was created. Depends on the data source that was
            used for the search.
        validUntil:
          type: string
          format: date-time
          example: '2020-10-28T11:11:21Z'
          description: The exact point in time the offer expires, expressed in UTC.
        paymentTimeLimit:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          example: '2026-05-24T23:59:00'
          description: The date by which a commitment to pay for the confirmed offer must be made (in the agency local time).
            Applicable only to NDC offers.
        isSellable:
          type: boolean
          example: true
          description: If true, the offer is available for purchase without requiring a re-pricing step. Applicable only to NDC
            offers.
        journeyRefs:
          type: array
          minItems: 1
          description: Lists references to journeys to which the offer applies.
          items:
            type: string
            format: uuid
            example: 'ccc04ff0-d5ce-4314-9cbc-f01ec6bb91ab'
            description: A reference to the journey.
        totalPriceDifference:
          $ref: '#/components/schemas/TotalPrice'
          description: Contains the total monetary amount of the exchange. If exchange costs of individual tickets are in
            different currencies, this object isn't returned.
        hasTravelersInDifferentCabins:
          type: boolean
          example: false
          description: If `true`, travelers are booked in different cabins on the same flight.
        hasTravelersPricedInDifferentCurrencies:
          type: boolean
          example: false
          description: If `true`, exchange costs are calculated in different currencies for different travelers. As a result, the
            `totalPriceDifference` object cannot be returned. In such a case, individual price details should be used
            for each traveler.
        hasMixedBrands:
          type: boolean
          example: false
          description: If `true`, `fareComponents` contains mixed branded fares. This parameter is not returned in case any of the
            fares is not branded.
        isPriceGuaranteed:
          type: boolean
          example: false
          description: If `true`, the offer was determined via automated Voluntary Changes (Cat 31) category of the originally
            ticketed fare.
        splitBooking:
          type: boolean
          example: false
          description: If `true`, the booking must be split for one or more travelers depending on the booking code difference
            between them.
        items:
          type: array
          minItems: 1
          description: Lists information necessary to price the offer further.
          items:
            $ref: '#/components/schemas/OfferItem'
            description: Contains details of an offer item that matches the requested exchange conditions.
        additionalOffersRefs:
          type: array
          minItems: 1
          uniqueItems: true
          description: Lists references to requested additional offer solutions, based on common journey details, formerly known
            as brands.
          items:
            type: string
            example: '123eww323'

    Source:
      type: object
      description: Contains the source of an offer, determined by the exchange processing path.
      properties:
        distributionModel:
          $ref: '#/components/schemas/DistributionModelTypeResponseEnum'
          description: Identifies the distribution model from which the offer was sourced.

    OfferItem:
      type: object
      description: Contains details of an offer item that matches the requested exchange conditions.
      required:
        - id
      properties:
        id:
          type: string
          example: '123eww324-1-1'
          description: The ID of the offer item.
      oneOf:
        - type: object
          title: ExchangeFareOfferItem
          properties:
            fares:
              type: array
              minItems: 1
              description: Lists fare details for the given offer.
              items:
                $ref: '#/components/schemas/ExchangeFare'
          additionalProperties: false
        - type: object
          title: DisruptionWaiverOfferItem
          properties:
            waiver:
              $ref: '#/components/schemas/DisruptionWaiver'
              description: Contains disruption waiver details used to adjust exchange processing for disrupted travel.
          additionalProperties: false

    Journey:
      type: object
      description: Contains journey details.
      properties:
        id:
          type: string
          format: uuid
          example: 'ccc04ff0-d5ce-4314-9cbc-f01ec6bb91ab'
          description: The ID of the journey.
        flightRefs:
          type: array
          minItems: 1
          description: Lists flight references for the journey.
          items:
            type: string
            format: uuid
            example: 'bf74c8ee-393a-45c8-8f15-a27fa6395050'
            description: A reference to the flight.
        departureAirportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'DFW'
          description: The three-letter IATA departure airport code of the journey.
        arrivalAirportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'HNL'
          description: The three-letter IATA destination airport code of the journey.
        durationInMinutes:
          type: integer
          format: int32
          minimum: 1
          example: 300
          description: Journey duration in minutes.

    Flight:
      type: object
      description: Contains flight information for a given journey.
      properties:
        id:
          type: string
          format: uuid
          example: 'bf74c8ee-393a-45c8-8f15-a27fa6395050'
          description: The ID of the flight.
        marketingFlightNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
          example: 123
          description: The flight number associated with the marketing carrier.
        marketingAirlineCode:
          type: string
          pattern: '^[A-Z0-9]{2}$'
          example: 'AA'
          description: The two-letter [IATA](https://www.iata.org/about/members/Pages/airline-list.aspx?All=true) designator code
            of the marketing airline.
        operatingFlightNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
          example: 321
          description: The flight number associated with the operating carrier.
        operatingAirlineCode:
          type: string
          pattern: '^[A-Z0-9]{2}$'
          example: 'UA'
          description: The two-letter [IATA](https://www.iata.org/about/members/Pages/airline-list.aspx?All=true) designator code
            of the operating airline.
        departureAirportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'DFW'
          description: The three-letter IATA airport code of the origin airport.
        arrivalAirportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'HNL'
          description: The three-letter IATA airport code of the destination airport.
        departureDate:
          type: string
          format: date
          example: '2019-07-09'
          description: The scheduled departure date in `YYYY-MM-DD` format in the airport's time zone.
        departureTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:15'
          description: The scheduled time of departure in `HH:MM` format.
        arrivalDate:
          type: string
          format: date
          example: '2019-07-09'
          description: The scheduled arrival date in `YYYY-MM-DD` format in the airport's time zone.
        arrivalTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '12:28'
          description: The scheduled time of arrival in `HH:MM` format.
        hiddenStops:
          type: array
          minItems: 1
          description: Lists the flight's hidden stops, if applicable.
          items:
            $ref: '#/components/schemas/HiddenStop'
            description: Contains detailed information about the hidden stop location.
        aircraftTypeCode:
          type: string
          pattern: '^[A-Z0-9]{2,3}$'
          example: 'E90'
          description: The IATA aircraft type designator code.
        hasChangeOfGauge:
          type: boolean
          example: true
          description: If `true`, an aircraft equipment change occurs.
        durationInMinutes:
          type: integer
          format: int32
          minimum: 1
          example: 300
          description: Flight duration in minutes.
        isMarriedWithPreviousFlight:
          type: boolean
          example: true
          description: If `true`, this segment belongs to the a marriage group. To correctly decode this information, you need to
            take into account two consecutive flights in the itinerary at once. `true` means that this segment is
            married to the previous one. `false` means that the flight is either the beginning of a marriage group or a
            single flight. Not supported for NDC bookings. This property is deprecated and will be removed from the schema in version 1.2 of this API.
        isBookingRequired:
          type: boolean
          example: false
          description: If `true`, the flight requires rebooking. If `false`, the flight information matches preexisting booking
            details.

    ExchangeFare:
      type: object
      description: Contains a breakdown of the exchange fare.
      properties:
        travelers:
          type: array
          minItems: 1
          description: Lists the group of travelers associated with the fare.
          items:
            $ref: '#/components/schemas/ReturnedTraveler'
            description: Contains traveler information for whom the fare has been generated, along with the document number
              associated with that traveler.
        priceDifference:
          $ref: '#/components/schemas/ExchangeTicketCharge'
          description: Contains a summary of the exchange or reissue cost of the ticket for each traveler in the `travelers` array.
        privateFare:
          $ref: '#/components/schemas/PrivateFareIndicatorEnum'
          description: Identifies the type of private fare.
        fareComponents:
          type: array
          minItems: 1
          description: Lists additional information about flights that is necessary to book a journey and get the desired fare.
          items:
            $ref: '#/components/schemas/FareComponent'
            description: Contains the fare components of a fare calculated for a given itinerary.
        refundabilityRef:
          type: string
          format: uuid
          example: 'c693e9b2-1782-45f9-82f6-73f8cdd13cfa'
          description: A reference to refundability information associated with a specific fare.
        changeRef:
          type: string
          format: uuid
          example: 'c693e9b2-1782-45f9-82f6-73f8cdd13cfa'
          description: A reference to change information associated with a specific fare.

    PrivateFareIndicatorEnum:
      type: string
      example: 'Has Program Code'
      description: Identifies the type of private fare.
      enum:
        - Has Program Code
        - Ineligible For Ticketing
        - Any

    ReturnedTraveler:
      type: object
      description: Contains traveler information for whom the fare has been generated, along with the document number
        associated with that traveler.
      required:
        - passengerTypeCode
      properties:
        id:
          type: string
          example: 'Passenger-1'
          description: The id of the traveler used to generate the offer.
        passengerTypeCode:
          type: string
          pattern: '^[0-9A-Z]{3}$'
          example: 'ADT'
          description: The ATPCO code of the passenger type used to generate an offer.
        ticketNumber:
          type: string
          pattern: '^[0-9A-Z/-]+$'
          example: '0167489825830'
          description: The electronic flight ticket number.
        givenName:
          type: string
          example: 'John'
          description: The traveler's first name.
        surname:
          type: string
          example: 'Smith'
          description: The traveler's surname.

    FareComponent:
      type: object
      description: Contains a fare component of a fare calculated for a given itinerary.
      properties:
        fareBasisCode:
          type: string
          example: 'ABCDE10'
          description: The fare basis code associated with the fare component.
        accountCode:
          type: string
          example: 'ACC33'
          description: The account code associated with the fare component.
        brand:
          $ref: '#/components/schemas/FareBrand'
          description: Contains the brand associated with the fare component.
        segmentDetails:
          type: array
          minItems: 1
          description: Lists flights within an offer referenced by `flightRef` to which the fare component applies.
          items:
            $ref: '#/components/schemas/FareComponentSegmentDetail'
            description: Contains details of the fare component associated with a specific segment of the journey.

    FareComponentSegmentDetail:
      type: object
      description: Contains details of a fare component associated with a specific segment of the journey.
      required:
        - flightRef
      properties:
        flightRef:
          type: string
          format: uuid
          example: 'bf74c8ee-393a-45c8-8f15-a27fa6395050'
          description: A reference to the flight.
        bookingClassCode:
          type: string
          pattern: '^[A-Z]{1,2}$'
          example: 'Y'
          description: The booking inventory code of the marketing airline.
        cabinName:
          $ref: '#/components/schemas/CabinNameResponseEnum'
          description: Identifies the aircraft cabin name.
        isAvailabilityBreak:
          type: boolean
          example: true
          description: If `true`, an availability break occurs after this flight, which indicates that the flight shouldn't be
            married to a subsequent one.
        mealCode:
          type: string
          example: 'VGML'
          description: The code of the meal.
        checkedBaggageRef:
          type: string
          format: uuid
          example: 'df58f912-7c38-416b-b97b-d73a8676f52c'
          description: A reference to the checked baggage offer attribute.
        carryOnBaggageRef:
          type: string
          format: uuid
          example: '75af09b1-ca5e-4b9b-a754-3297f516d147'
          description: A reference to the carry-on baggage offer attribute.

    ExchangeTicketCharge:
      type: object
      description: Contains a summary of the exchange or reissue cost of a ticket for each traveler in the `travelers` array.
      allOf:
        - $ref: '#/components/schemas/ExchangeCharge'
        - type: object
          properties:
            totalFee:
              $ref: '#/components/schemas/ExchangeFee'
              description: Contains the fee related to the exchange.
            taxes:
              type: array
              minItems: 1
              description: Lists amount differences for taxes associated with the exchange fee.
              items:
                $ref: '#/components/schemas/ExchangeTax'
                description: Contains details of an exchange tax.
            isResidualAmountForfeited:
              type: boolean
              example: false
              description: If `true`, the residual amount is forfeited by exchange rules. Omitted if not applicable.

    TotalPrice:
      type: object
      description: Contains total monetary amounts of an exchange. If exchange costs of individual tickets are in different
        currencies, this object is omitted.
      allOf:
        - $ref: '#/components/schemas/ExchangeCharge'
        - type: object
          properties:
            totalFee:
              type: string
              format: number
              example: '123.00'
              description: The total fee associated with the exchange.

    ExchangeCharge:
      type: object
      description: Contains total monetary amounts related to an exchange.
      properties:
        type:
          $ref: '#/components/schemas/ExchangeChargeTypeEnum'
          description: Identifies the type of `grandTotal` charge. Can be `Add collect` (additional collection required to fulfill
            the offer), `Even` (no additional cost required to fulfill the offer), `Refund` (a refund amount will be
            returned when fulfilling the offer), or `Unknown` (the charge type can't be determined).
        baseFare:
          type: string
          format: number
          example: '100.00'
          description: The total fare difference.
        totalTax:
          type: string
          format: number
          example: '8.00'
          description: The total tax difference.
        subtotalBeforeFee:
          type: string
          format: number
          example: '100.00'
          description: The subtotal fare and tax difference, with any change fees excluded.
        grandTotal:
          type: string
          format: number
          example: '128.00'
          description: The complete cost or refund value.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
          description: The three-letter ISO 4217 currency code.
        totalTaxOnFee:
          type: string
          format: number
          example: '20.00'
          description: The total amount of tax on change fees.

    ExchangeFee:
      type: object
      description: Contains fee details related to an exchange.
      properties:
        fees:
          type: array
          minItems: 1
          description: Lists total change or penalty fees. If there are no fees, this array is not returned.
          items:
            $ref: '#/components/schemas/ExchangeValue'
            description: Contains a total change or penalty fee.

    ExchangeValue:
      type: object
      description: Contains a change or penalty amount.
      required:
        - amount
        - currencyCode
      properties:
        amount:
          type: string
          format: number
          example: '100.00'
          description: The monetary amount of an exchange fee.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
          description: The three-letter ISO 4217 currency code.

    ExchangeTax:
      type: object
      description: Contains details of an exchange tax.
      required:
        - taxCode
      properties:
        taxCode:
          type: string
          pattern: '^[A-Z0-9]{2}$'
          example: 'XY'
          description: The tax code.
        amount:
          type: string
          format: number
          example: '100.00'
          description: The monetary amount of tax difference.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
          description: The three-letter ISO 4217 currency code.
        isPaid:
          type: boolean
          example: false
          description: If `true`, the tax difference amount has been paid.

    FareBrand:
      type: object
      description: Contains the brand associated with a fare component.
      properties:
        code:
          type: string
          example: 'ECOFLEX'
          description: The code of the brand.
        name:
          type: string
          example: 'ECO FLEX'
          description: The name of the brand.
        programId:
          type: string
          example: 'CFFLH'
          description: The identifier of the brand program.

    Baggage:
      type: object
      description: Contains baggage provisions, including free allowance baggage and charges on excess baggage items.
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          example: 'df58f912-7c38-416b-b97b-d73a8676f52c'
          description: The ID of the attribute.
        allowances:
          type: array
          minItems: 1
          description: Lists baggage allowances applicable per portion of travel.
          items:
            $ref: '#/components/schemas/BaggageAllowances'
            description: Contains baggage allowance applicable per portion of travel.
        charges:
          type: array
          minItems: 1
          description: Lists baggage charges applicable per portion of travel.
          items:
            $ref: '#/components/schemas/BaggageCharges'
            description: Contains baggage charges applicable per portion of travel.

    BaggageAllowances:
      type: object
      description: Contains baggage allowances applicable per portion of travel.
      properties:
        numberOfPieces:
          type: integer
          format: int32
          example: 1
          description: Maximum number of pieces that are allowed free of charge.
        maximumWeightInPounds:
          type: integer
          format: int32
          minimum: 1
          example: 50
          description: Maximum allowed weight of the baggage piece measured in pounds [lb]. If null, no weight limit is specified
            for this type of baggage.
        maximumWeightInKilograms:
          type: integer
          format: int32
          minimum: 1
          example: 23
          description: Maximum allowed weight of the baggage piece measured in kilograms [kg]. If null, no weight limit is
            specified for this type of baggage.
        bagDefinition:
          $ref: '#/components/schemas/BaggageItemDefinition'
          description: Contains the definition of a baggage item included in the free baggage allowance.
        airlineCode:
          type: string
          pattern: '^[A-Z0-9]{2}$'
          example: 'AA'
          description: The two-letter [IATA](https://www.iata.org/about/members/Pages/airline-list.aspx?All=true) designator code
            of the airline whose baggage provisions apply.

    BaggageCharges:
      type: object
      description: Contains baggage charges applicable per portion of travel.
      properties:
        firstPiece:
          type: integer
          format: int32
          minimum: 1
          example: 1
          description: Defines the inclusive range of [`firstPiece`, `lastPiece`] for which the charge applies. The count starts
            from the item that exceed the free baggage allowance.
        lastPiece:
          type: integer
          format: int32
          minimum: 1
          example: 2
          description: Defines the inclusive range of [`firstPiece`, `lastPiece`] for which the charge applies. The count starts
            from the item that exceed the free baggage allowance.
        amount:
          type: string
          format: number
          minimum: 0
          example: '100.00'
          description: The monetary amount.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
          description: The three-letter ISO 4217 currency code associated with `amount`.
        bagDefinition:
          $ref: '#/components/schemas/BaggageItemDefinition'
          description: Contains the definition of the baggage item to which the charge applies.
        airlineCode:
          type: string
          pattern: '^[A-Z0-9]{2}$'
          example: 'AA'
          description: The two-letter [IATA](https://www.iata.org/about/members/Pages/airline-list.aspx?All=true) designator code
            of the airline whose baggage provisions apply.

    BaggageItemDefinition:
      type: object
      description: Contains the definition of a baggage item included in free baggage allowance or subject to baggage charges.
      properties:
        description:
          type: array
          minItems: 1
          description: Lists baggage item descriptions in free-text format.
          items:
            type: string
            example: 'UP TO 50 POUNDS/23 KILOGRAMS'
            description: A free-text baggage description.

    AssociatedElectronicMiscellaneousDocuments:
      type: object
      description: Contains Electronic Miscellaneous Documents associated with a particular electronic flight ticket (EMD-A).
      properties:
        ticketNumber:
          type: string
          pattern: '^[0-9A-Z/-]+$'
          example: '0167489825830'
          description: The electronic flight ticket number to which EMD-As are associated.
        electronicMiscellaneousDocuments:
          type: array
          minItems: 1
          description: Lists associated EMD-As.
          items:
            $ref: '#/components/schemas/ElectronicMiscellaneousDocumentToExchange'
            description: Contains an associated Electronic Miscellaneous Document.

    ElectronicMiscellaneousDocumentToExchange:
      type: object
      description: Contains an associated Electronic Miscellaneous Document (EMD-A).
      properties:
        number:
          type: string
          pattern: '^[0-9A-Z/-]+$'
          example: '0167489825830'
          description: The EMD-A number.
        reasonForIssuanceCode:
          type: string
          example: 'C'
          description: The reason for issuance code (RFIC) defined by IATA.
        reasonForIssuanceName:
          $ref: '#/components/schemas/ReasonForIssuanceEnum'
          description: Identifies the name of the reason for issuance code (RFIC) defined by IATA applicable to the EMD-A.
        refundEligibility:
          $ref: '#/components/schemas/RefundEligibilityEnum'
          description: Identifies the service type code of the EMD-A defined by IATA, which determines if a document is
            refundable. Can be `Refundable`, `Non-refundable`, `Re-use` (document is non-refundable but its value may be
            reapplied towards a future purchase), or `Unknown` (refund eligibility cannot be determined).
        unusedAmount:
          type: string
          format: number
          minimum: 0
          example: '25.00'
          description: The monetary amount of the document that is unused.
        total:
          type: string
          format: number
          example: '125.00'
          description: The complete monetary amount of the document.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'USD'
          description: The three-letter ISO 4217 currency code.

    PriceGuaranteeEnum:
      type: string
      example: 'Auto-Redirect'
      description: Identifies how the fare search algorithm treats Category 31 fares. Can be `Always` (returns options
        determined by the automated Voluntary Changes category of the originally ticketed fare), `Never` (returns
        options not determined by the automated Voluntary Changes category of the originally ticketed fare), `Never With
        Fee` (the same conditions as for the `Never` option apply, but the exchange fee is obtained from Category 16),
        `Auto-Redirect` (if possible, attempts to return options determined by the automated Voluntary Changes category
        of the originally ticketed fare; otherwise, returns options not determined this category), or `Auto-Redirect
        With Fee` (the same conditions as for the `Auto-Redirect` option apply, but the exchange fee is obtained from
        Category 16 for offers where `isPriceGuaranteed` is set to `false`).
      enum:
        - Always
        - Never
        - Never With Fee
        - Auto-Redirect
        - Auto-Redirect With Fee

    ExemptModeEnum:
      type: string
      example: 'Taxes'
      description: Identifies the exempt mode, which impacts how journey options are priced. Can be `Taxes` (exempt taxes and
        include fees and passenger facility charges) or `Taxes And Fees` (exempt taxes and fees and include applicable
        passenger facility charges). Setting `exemptMode` prevents from using specific tax-related operations
        (`overrideTaxes` or `exemptTaxCodes`) as these parameters are mutually exclusive.
      enum:
        - Taxes
        - Taxes And Fees

    RefundEligibilityEnum:
      type: string
      default: 'Unknown'
      example: 'Refundable'
      description: Identifies the service type code of an Electronic Miscellaneous Document defined by IATA, which determines
        if a document is refundable. Can be `Refundable`, `Non-refundable`, `Re-use` (document is non-refundable but the
        its value may be reapplied towards a future purchase), or `Unknown` (refund eligibility cannot be determined).
      enum:
        - Refundable
        - Non-refundable
        - Re-use
        - Unknown

    ExchangeChargeTypeEnum:
      type: string
      default: 'Unknown'
      example: 'Add collect'
      description: Identifies the type of charge. Can be `Add collect` (additional collection required to fulfill the offer),
        `Even` (no additional cost required to fulfill the offer), `Refund` (a refund amount will be returned when
        fulfilling the offer), or `Unknown` (the charge type be determined).
      enum:
        - Add collect
        - Even
        - Refund
        - Unknown

    DistributionModelTypeEnum:
      type: string
      example: 'ATPCO'
      description: Identifies the distribution model of a booking.
      enum:
        - ATPCO
        - NDC

    DistributionModelTypeResponseEnum:
      type: string
      default: 'Unknown'
      example: 'ATPCO'
      description: Identifies the distribution model from which offers are sourced.
      enum:
        - ATPCO
        - NDC
        - Unknown

    DisruptionWaiverTypeEnum:
      type: string
      default: 'Unknown'
      example: 'Full Exchange Waiver'
      description: Identifies the disruption waiver type.
      enum:
        - Full Exchange Waiver
        - Unknown

    DisruptionWaiverPlacementEnum:
      type: string
      default: 'Unknown'
      example: 'Tour Code'
      description: Identifies where waiver details are placed in ticketing data.
      enum:
        - Tour Code
        - Endorsement
        - Unknown

    DisruptionWaiver:
      type: object
      description: Contains disruption waiver details used to adjust exchange processing for disrupted travel.
      properties:
        travelers:
          type: array
          minItems: 1
          description: Lists the group of travelers associated with the fare.
          items:
            $ref: '#/components/schemas/ReturnedTraveler'
            description: Contains traveler information for whom the fare has been generated, along with the document number
              associated with that traveler.
        priceDifference:
          $ref: '#/components/schemas/ExchangeTicketCharge'
          description: Contains a summary of the exchange or reissue cost of the ticket for each traveler in the `travelers` array.
        segmentDetails:
          type: array
          minItems: 1
          description: Lists flights within an offer referenced by `flightRef` to which the disruption waiver applies.
          items:
            $ref: '#/components/schemas/FareComponentSegmentDetail'
            description: Contains details of the segment association for the disruption waiver.
        code:
          type: string
          example: 'GUAMEXWAIVER'
          description: The disruption waiver code provided by the carrier or servicing rule.
        type:
          $ref: '#/components/schemas/DisruptionWaiverTypeEnum'
          description: Identifies the disruption waiver type.
        placement:
          $ref: '#/components/schemas/DisruptionWaiverPlacementEnum'
          description: Identifies where waiver details are placed in ticketing data.
        otherServiceMessage:
          type: string
          example: 'GUA MEX FULL WAIVER'
          description: The OSI message associated with the disruption waiver.

  securitySchemes:
    oauth2_authentication:
      type: oauth2
      x-base64-encode-client-credentials: true
      flows:
        clientCredentials:
          tokenUrl: 'https://api.cert.platform.sabre.com/v2/auth/token'
          scopes:
            {}
