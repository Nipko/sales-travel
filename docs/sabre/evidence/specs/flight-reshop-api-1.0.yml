      description: |
        ##### SUMMARY
        Depending on availability and fare conditions, the API response may include up to fifty (50) exchange options for the requested tickets.
        Each option includes:
        - details of the document exchange cost under `offers.items.fares.priceDifference`
        - the total cost of the exchange operation under `offers.totalPriceDifference.grandTotal`
        - new fare details under the `offers.items.fares.fareComponents` parameter
        - associated flight information referenced via the `offers.journeyRefs` parameter

        ##### NEXT STEPS
        As the next step in the exchange process, we must make a booking change request that includes flight details from a selected offer, covering the requested main or alternate locations. Once the booking is successfully updated with the new itinerary, the process continues with the fulfillment of the new ticket.

