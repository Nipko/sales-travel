    RoundTripAdditionalBrandsSingleTravelerResponse:
      description: |
        ##### SUMMARY
        Depending on availability and fare conditions, the API response may include up to fifty (50) exchange options for the requested tickets.
        Each option includes:
        - details of the document exchange cost under `offers.items.fares.priceDifference`
        - the total cost of the exchange operation under `offers.totalPriceDifference.grandTotal`
        - new fare details under the `offers.items.fares.fareComponents` parameter
        - associated flight information referenced via the `offers.journeyRefs` parameter

        The retained flight ("LA 8065") remains part of each offer, with a requirement for class rebooking if applicable.

        > **Important**: We can distinguish "main offers" by the presence of the `offers.additionalOffersRefs` parameter, which lists associated brand offers also returned by the API.

        ##### NEXT STEPS
        As the next step in the exchange process, we must make a booking change request including flight details and the brand from a selected offer. Once the booking is successfully updated with the new itinerary, the process continues with the fulfillment of the new ticket.

