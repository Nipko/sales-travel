  FulfillCardHolder:
    type: object
    description: Contains `PAYMENTCARD` holder information. Supported for NDC only.
    required:
      - givenName
      - surname
    properties:
      givenName:
        type: string
        example: 'John'
        description: The card holder's first name.
      surname:
        type: string
        example: 'Smith'
        description: The card holder's last name.
      address:
        $ref: '#/definitions/Address'
        description: The card holder’s address.

  Payer:
    type: object
    description: Contains the entity designated as the payer, responsible for authorizing and executing the financial
      settlement. For card‑based payments, this most often refers to the associated cardholder data. Supported for NDC
      only.
    properties:
      givenName:
        type: string
        example: 'John'
        description: The payer's first name.
      surname:
        type: string
        example: 'Smith'
        description: The payer's last name.
      dateOfBirth:
        type: string
        format: date
        example: '1970-01-23'
        description: The date of birth of the payer in `YYYY-MM-DD` format.
      email:
        type: string
        format: email
        example: 'john@smith.family.priv'
        description: The payer's email address.
      identityDocumentNumber:
        type: string
        pattern: '^[a-zA-Z0-9]+$'
        example: '0123456789'
        description: The unique identifier of the document.
