      LocationInfo:
        $ref: '#/definitions/LocationInfo'
      LocationInfos:
        $ref: '#/definitions/LocationInfos'
      PickUpLocationRS:
        $ref: '#/definitions/PickUpLocationRS'
      PositiveInteger:
