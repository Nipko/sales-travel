  Commission:
    type: object
    description : |
      Commission is used to request only suppliers that return commission information. It is optional. If used, it must contain 'true' or 'false'. 
      If false, it is usually omitted.
      The Travel Agency may elect to not have this information returned based on settings in their control record in Sabre (travel journal record – TJR).
      * The amount attribute is mandatory if commission element is used. 
      * The amount attribute is 1-12 numeric with up to 1 decimal point. 
      * The percent attribute is optional. If not present, then Fixed must be 'true'.
      * The percent attribute is 1 -3 numeric, decimal point, then 3 numeric. Most car suppliers use a true percentage, not fixed.
    properties:
      Ref:
        type: string
      Title:
        type: string
      Type:
        type: string
  RentalDays:
    description : Rental days is mandatory and must be 1-3 numeric. 
      A 'day' is a 24-hour period of time from the time the car was picked up. 
      
      For 'single location, single car supplier' responses, it contains the actual number of days the car supplier determines the type of rate returned. 
      
      For all other responses it contains the number of days and hours in the request as the difference between pickup date/time and return date/time. This is done because each supplier may round up or down on the length of rental to determine the rates returned.
    type: object
    properties:
      Ref:
        example : "5"
        type: string
  LocPolicyRef:
    description: Refers to the location's preferred policy.
    type: object
    properties:
