        type: string
      Description:
        type: string
      Properties:
        $ref: '#/definitions/Properties'
      Ref:
        type: string
        description : Currency code is optional and is 3 alpha. Currency code is used to request a currency that is not the default currency of the country where the car rental is requested. This is primarily used at major cities near country borders as some car suppliers will accept multiple currencies at rental locations.
        example :   "EUR"
      Required:
