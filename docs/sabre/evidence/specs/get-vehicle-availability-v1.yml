        $ref: '#/definitions/RateInfoRefRatePrefsGuaranteePrepaid'
      RateInfoRefRatePrefsRateRule:
        $ref: '#/definitions/RateInfoRefRatePrefsRateRule'
      ReturnLocation:
        $ref: '#/definitions/ReturnLocation'
      ReturnLocationRS:
        $ref: '#/definitions/ReturnLocationRS'
      SeatBelts:
        $ref: '#/definitions/SeatBelts'
