  MileageAllowance:
    description : Mileage allowance is mandatory, if 'hour' is present. Mileage allowance is either ‘UNL’ for unlimited or 1-5 numeric, a number is the limit of distance allowed for extra hour of rental. If the base rate mileage amount has 'UNL', then extra hour must have 'UNL'.
