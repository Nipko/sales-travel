swagger: '2.0'
info:
  title: Get Vehicle Availability
  version: v1
  description: |
    The Get Vehicle Availability API is used to request information regarding car rental location(s), available car types at the location(s), and the rates of those cars.
    * A specific car supplier at a specific location
    * One to all car suppliers that serve a specific airport
    * One to all car suppliers around a specific point for a variable distance
    Get Vehicle Availability responses include:vehicle rates, vehicle types, legal number of occupants, number of bags.
host: api.cert.platform.sabre.com
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1.0.0/get/vehavail:
    post:
      operationId: getRentalLocation
      parameters:
        - name: GetVehAvailRQ
          description: "The Get Vehicle Availability API is used to request information regarding car rental location(s), available car types at the location(s), and the rates of those cars."
          in: body
          required: true
          schema:
            $ref: '#/definitions/GetVehAvailRQ'
      responses:
        '200':
          schema:
            $ref: '#/definitions/GetVehAvailRS'
          description: Success
        '400':
          description: |
            Bad Request

            - The request was not valid.
        '404':
          description: |
            Not Found

            - No results were found.
definitions:
  VehAvailInfosVehAvailInfoVehRentalRateVehicleChargesVehicleCharge:
    description : Contains vehicle charge information.
    type: object
    properties:
      Items:
        $ref: '#/definitions/Items'
      Type:
        type: string
  Address:
    description : Refers to the exact location of the destination.
    type: object
    properties:
      Description: 
        type: string
      Ref:
        type: string
  CarExtra:
    description : Refers to any extra physical equipments, services or surcharges availed.
    type: object
    properties:
      Items:
        $ref: '#/definitions/Items'
      Type:
        type: string
  Size:
    description : Size is mandatory if the Bags element is used. Size can be either Small or Large.
    type: object
    properties:
      JsonMemberEnum:
        type: array
        items:
          example : "Large"
          type: string
      Type:
        type: string
  UnitOfMeasureType:
    description : Unit of measure type is optional and if used, must be MI-miles or KM-Kilometers. It finds the radius of search and sorts the information.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      JsonMemberEnum:
        type: array
        items:
          type: string
      Properties:
        $ref: '#/definitions/Properties'
      Type:
        type: string
  SortByType:
    description : Sort by Type allows the subscriber to change from the 'default' of how the data is returned.
    type: object
    properties:
      Description:
        type: string
      JsonMemberEnum:
        type: array
        items:
          type: string
      Pattern:
        type: string
      Type:
        type: string
  VendorPrefs:
    type: object
    description : Vendor preference is mandatory if "VendorPrefs" is present. Vendor preference is used to list vendor codes to include or exclude from the request.
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        type: string
      Properties:
        $ref: '#/definitions/Properties'
      Required:
        type: array
        items:
          type: string
      Type:
        type: string
      VendorPref:
        type: object
  Image:
    description : |
      Image Type is mandatory, if Image Reference is used. Image Type must be one of the following.
      * Original 
      * Thumbnail- scalable to 100 x 150 
      * Small- scalable to 200 x 200 
      * Medium- scalable to 400 x 400 
      * Large-  scalable to 800 x 800
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        type: string
      Items:
        $ref: '#/definitions/Items'
      MinItems:
        type: integer
        format: int32
      Properties:
        $ref: '#/definitions/Properties'
      Required:
        type: array
        items:
          type: string
      Type:
        type: string
  CurrencyCode:
    description : |
      Currency code is used to request a currency that is not the default currency of the country where the car rental is being booked. This is primarily used at major cities near country borders as some car suppliers will accept multiple currencies at rental locations. 
      Currency Code is an optional field and it is 3 alpha numeric.
    type: object
    properties:
      Ref:
        example : "USD"
        type: string
  ExtraMileageCharge:
    description : Contains information about charges for extra mileage.
    type: object
    properties:
      Ref:
        example : "0.25"
        type: string
  RatePrefs:
    description : Rate preferences is optional. If used, then at least one of the following attributes is required such as 'RateAssured', 'RateCategory', 'RatePlan'.


    type: object
    properties:
      Commission:
        type: boolean
        description : Commission is used to request only suppliers that return commission information. Commission is optional. If used, it must contain “true” or “false”. If false, it is usually omitted.
      CurrencyInfo:
        $ref: '#/definitions/CurrencyInfo'
      CustLoyalty:
        type: object
      GuaranteePrepaid:
        $ref: '#/definitions/GuaranteePrepaid'
      RateAssured:
        type: boolean
        example : true
      RateCategory:
        description : Rate category is used to request types of a rate. Rate category if used, must contain S,P,G,A,I,C,U,B,V,R,K,L,N.
        type: string
      RateCode:
        description : Rate code is a car supplier specific 2-6 alpha numeric code that is tied to the available rate. This is similar to Airline fares codes.
        type: object
      RatePlan:
        description : Rate plan is mandatory. This field is 1 alpha and is used to generally describe the  length of rental for rates. 
          For example, Daily rates 'D', Weekly rates 'W'. 
          For most plans, this field is determined by the length of the car rental based on the number of days and hours, the difference between pickup date/time, and the return date/time.
          The list of possible rate plans is daily ‘D’, weekend 'E', weekly 'W', monthly 'M', and Bundled 'B' (length of rental).
        type: string
  Ordinal:
    type: object
    properties:
      Ref:
        type: string
  MembershipId:
    description : |
      Membership id is mandatory. It varies in length
      * CD, IT, ID, FT - 1-25 alpha numeric
      * PC - 1-10 alpha numeric
    example :   {"CustLoyalty MembershipType" : "CD", "MembershipCode" : "VV", "MembershipId" : "123456"}
    type: object
    properties:
      MaxLength:
        type: integer
        format: int32
      MinLength:
        type: integer
        format: int32
      Pattern:
        type: string
      Type:
        type: string
  PickUpTime:
    description : Vehicle Pickup Time is the vehicle arrival time for pickup to the customer location. It should be in hh:mm format. It is mandatory and must be in the 24-hour clock format.
    type: object
    properties:
      Pattern:
        type: string
      Title:
        type: string
      Translatorfixme:
        type: string
      Type:
        type: string
  StringLength2to4:
    type: object
    properties:
      Description:
        type: string
      Pattern:
        type: string
      Type:
        type: string
  RateRule:
    description : Rate rule is optional. This data may be repeated for each car supplier. The limit is 50, which is currently greater than the number of car suppliers in Sabre.This is only used if the requester already knows this information, otherwise it is not used.
    type: object
    properties:
      Items:
        $ref: '#/definitions/Items'
      MinItems:
        type: integer
        format: int32
      Title:
        type: string
      Type:
        type: string
  Distance:
    description: Distance is the length of the trip. This is usually in MI-miles or KM-kilometers.
    type: object
    properties:
      Ref:
        type: string
  VehicleCharges:
    description : Vehicle Charges contains all information regarding car rental pricing.
    type: object
    properties:
      Ref:
        type: string
      Title:
        type: string
  PolicyRef:
    type: object
    properties:
      Ref:
        type: string
  PickUpDate:
    description : Vehicle Pickup date is mandatory and should be in yyyy-mm-dd format. 
    type: object
    properties:
      Ref:
        example : PickUpDate="2026-01-11"
        type: string
      Title:
        type: string
  Status:
    type: object
    description : Status displays when PricedEquip is present in the response. It can be Confirmed "CNF", On Request "ONR", or Not Available "NTA".
    properties:
      Ref:
        example : "Complete"
        type: string
  ReturnLocation:
    description : Return Location is used to designate the car return location by airport code or non-airport code. This field is optional.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      LocationCode:
        example : "LAX"
        type: string
      Properties:
        $ref: '#/definitions/Properties'
      Ref:
        type: string
      Required:
        type: array
        items:
          type: string
      Title:
        type: string
      Type:
        type: string
  LocType:
    description : Type of location which can be airport or non-airport.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      JsonMemberEnum:
        type: array
        items:
          type: string
      Properties:
        $ref: '#/definitions/Properties'
      type:
        type: string
  StringLength2to8:
    type: object
    properties:
      Description:
        type: string
      Pattern:
        type: string
      Type:
        type: string
  StringLength2to6:
    type: object
    properties:
      Description:
        type: string
      Pattern:
        type: string
      Type:
        type: string
  ApplicationResults:
    description : Application Results represents application status.
    type: object
    properties:
      Ref:
        example : "Success"
        type: string
  Images:
    type: object
    description : Images is optional. It will be returned if the request in GetVehAvailRQ contains ‘ImagesRef’ element.
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        type: string
      Properties:
        $ref: '#/definitions/Properties'
      Ref:
        type: string
      Type:
        type: string
  LocationCode:
    description : LocationCode is mandatory. It is used to designate the car pickup location field and must have 3 alpha characters.
    type: object
    properties:
      Pattern:
        type: string
      Ref:
        type: string
      Title:
        type: string
      Translatorfixme:
        type: string
      Type:
        type: string
  Code:
    description: Generic String to represent any Code in the object.
    type: object
    properties:
      MaxLength:
        type: integer
        format: int32
      MinLength:
        type: integer
        format: int32
      Pattern:
        type: string
      Ref:
        type: string
      Type:
        type: string
  Longitude:
    description : Longitude is set up as follows.
      If a negative sign is needed, 1-3 numeric, decimal point, followed by 6 numeric. The longitude rate is -180.000000 to 180.000000 
      Latitude and Longitude attributes are the most common method to supply the API with pickup or drop off search criteria.
    type: object
    properties:
      Ref:
        example :    "-12.123456"             
        type: string
  AddressLine3:
    type: object
    properties:
      Description:
        type: string
      Ref:
        type: string
  AnyURL:
    description: Generic String represents the URL for the application.
    type: object
    properties:
      Type:
        type: string
  AddressLine2:
    description: AddressLine2 is additional information about the official address.
    type: object
    properties:
      Description:
        type: string
      Ref:
        type: string
  RateInfoRefRatePrefsGuaranteePrepaid:
    description : Contains Rate Info Ref, Rate Prefs, Guaranteed Prepaid.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      Properties:
        $ref: '#/definitions/Properties'
      Type:
        type: string
  SortOrderType:
    description: To sort by price, distance, car type.
    type: object
    properties:
      Description:
        type: string
      JsonMemberEnum:
        type: array
        items:
          type: string
      Pattern:
        type: string
      Type:
        type: string
  StringLength0to20:
    type: object
    properties:
      Description:
        type: string
      MaxLength:
        type: integer
        format: int32
      MinLength:
        type: integer
        format: int32
      Type:
        type: string
  StringLength2to50:
    type: object
    properties:
      Description:
        type: string
      MaxLength:
        type: integer
        format: int32
      MinLength:
        type: integer
        format: int32
      Type:
        type: string
  AddressLine1:
    description: AddressLine1 is the official address.
    type: object
    properties:
      Description:
        type: string
      Ref:
        type: string
  MembershipCode:
    description : Membership code attribute is mandatory. The membership code is the 2 alpha code of the car supplier and must equal VendorPref Code, if RentalLocRef is used.
    type: object
    properties:
      Ref:
        example : "AB"
        type: string
  SellGuaranteeReq:
    description: Sell with Guarantee request.
    type: object
    properties:
      Ref:
        type: string
  RateInfoRefRatePrefs:
    description : Contains Rate Info Ref, Rate Prefs.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      Properties:
        $ref: '#/definitions/Properties'
      Title:
        type: string
      type:
        type: string
  VehPrefs:
    description : Vehicle Preferences is optional, it is used to request the type of vehicle or vehicles, its seat belts, and bag info.
      If a Vehicle Preference is used, then VehPref, or SeatBeltsAndBagsInfo must be input.
    type: object
    properties:
      SeatBeltsBagInfo:
        $ref: '#/definitions/SeatBeltsBagInfo'
      VehPref:
        $ref: '#/definitions/VehPref'
  VehAvailInfosVehAvailInfoVehRentalRate:
    description : Contains Vehicle Information, Vehicle rental rate.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      properties:
        $ref: '#/definitions/Properties'
      Required:
        type: array
        items:
          type: string
      Title:
        type: string
      Type:
        type: string
  PrepayDeposit:
    description: Amount of deposit that has to be prepaid for vehicle rental.
    type: object
    properties:
      Ref:
        type: string
  PickUpLocation:
    description : Pickup Location is used to designate the pickup location as per the airport code or non-airport code.
    type: object
    properties:
      LocationCode:
        example : "DFW"
        type: string
      Ref:
        type: string
      Title:
        type: string
  RefPoint:
    type: object
    description : RefPoint is optional. If this option is used, then GeoCode and AddressRef cannot be used.
    properties:
      CityName:
        type: string
      CountryCode:
        description : Country Code is mandatory.It is 2-50 characters, but usually has the 2 character country code abbreviation.
        example : US
        type: string
      PostalCode:
        type: string
      RefPointType:
        description : The reference point type is attribute mandatory.
                      The reference point type describes the type of data in the ‘Value’ attribute.
                      The following is a list of valid code number 
                      6- Airport 11-Hotel                     
        type: string
        enum:
          - '5'
          - '6'
          - '7'
          - '11'
          - '16'
          - '18'
      StateProv:
        description : The State Province is 1-50 characters, but it's usually a 2-3 character abbreviation for the state or province code.
        example : NY 
        type: string
      Value:
        type: string
      ValueContext:
        type: string
        enum:
          - NAME
          - CODE
  CountryName:
    type: object
    description : Name of the country.
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        example : France
        type: string
      Properties:
        $ref: '#/definitions/Properties'
      Ref:
        type: string
      type:
        type: string
  VehRentalRate:
    description : Vehicle Rental Rate is mandatory. It provides all the details to the rate and cartype via the attributes and children.
    type: object
    properties:
      ref:
        type: string
      title:
        type: string
  GeoRef:
    type: object
    description : Represents Geo Reference from the request.
    properties:
      Direction:
        description : Direction attribute is mandatory, if request contains “GeoRef”. If used, it must be N-north, S-south, E-east, W-west, or combined NE, NW, SE, SW.  If direction is “NA”- Not Available, it means the latitude and longitude is not exact.
        example : "NE"
        type: string
        enum:
          - E
          - N
          - S
          - W
          - NE
          - NW
          - SW
          - SE
      MaxLocations:
        type: integer
        format: int32
      PickUpLocRef:
        $ref: '#/definitions/GeoLocRef'
      Radius:
        type: integer
        format: int32
      ReturnLocRef:
        $ref: '#/definitions/GeoLocRef'
      Uom:
        description : Unit of measure is optional, if not input it will default to miles. Unit of measure, if used must be MI-miles or KM-kilometers. The default is miles, so it should be omitted for miles and used if the distance searched is in kilometers.
        example : MI
        type: string
        enum:
          - MI
          - KM
  DateOrTimeOrDateTimeType:
    type: object
    properties:
      AnyOf:
        type: array
        items:
          $ref: '#/definitions/AnyOfItem'
      Description:
        type: string
  VehAvailInfosVehAvailInfoVehRentalRateVehicleCharges:
    type: object
    description : Contains multiple Vehicle Avail Information which includes Rental Rate and Vehicle Charges.
    properties:
      AdditionalProperties:
        type: boolean
      properties:
        $ref: '#/definitions/Properties'
      Title:
        type: string
      Type:
        type: string
  StringLength0to50:
    type: object
    properties:
      Description:
        type: string
      MaxLength:
        type: integer
        format: int32
      MinLength:
        type: integer
        format: int32
      Type:
        type: string
  Direction:
    type: object
    description : Direction is mandatory, if request contains “GeoRef”. If used must be N-north, S-south, E-east, W-west, or combined NE, NW, SE, SW. If direction is “NA”- Not Available, it means the latitude and longitude is not exact.
    properties:
      AdditionalProperties:
        type: boolean
      JsonMemberEnum:
        type: array
        items:
          type: string
      Properties:
        $ref: '#/definitions/Properties'
      Ref:
        example : "SW"
        type: string
      Type:
        type: string
  RatePlan:
    description: Rate plan is used to request the length of rental rates. Rate plan is optional. If used, it must contain daily ‘D’, weekend ‘E’,weekly ‘W’, and monthly ‘M’.
    type: object
    properties:
      Title:
        example : "D"
        type: string
      Type:
        type: string
  PickUpLocationRS:
    description : Represents the pick up location response.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        example : "DFW"

        type: string
      Properties:
        $ref: '#/definitions/Properties'
      Required:
        type: array
        items:
          type: string
      Type:
        type: string
  LocationName:
    description: Name of the location.
    type: object
    properties:
      Ref:
        type: string
  GuaranteeInd:
    description: Represents Guarantee/Prepaid indicator.
    type: object
    properties:
      Ref:
        type: string
  BaseAmount:
    description: Represents car rental amount excluding taxes and fees.
    type: object
    properties:
      Ref:
        type: string
  StringLength0to55:
    type: object
    properties:
      Description:
        type: string
      MaxLength:
        type: integer
        format: int32
      MinLength:
        type: integer
        format: int32
      Type:
        type: string
  VehAvailInfos:
    type: object
    description : Contains vehicle availability information.
    properties:
      AdditionalProperties:
        type: boolean
      properties:
        $ref: '#/definitions/Properties'
      Ref:
        type: string
      Title:
        type: string
      Type:
        type: string
  VendorCode:
    type: object
    properties:
      Pattern:
        type: string
      Type:
        type: string
  VehAvailInfosVehAvailInfo:
    description : Contains multiple VehAvailInfo.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      Properties:
        $ref: '#/definitions/Properties'
      Required:
        type: array
        items:
          type: string
      Title:
        type: string
      Type:
        type: string
  GeoLocRef:
    type: object
    description : Geo Location Reference
    properties:
      AddressRef:
        $ref: '#/definitions/AddressRef'
      GeoCode:
        $ref: '#/definitions/GeoCode'
      RefPoint:
        $ref: '#/definitions/RefPoint'
  StringLength0to2:
    type: object
    properties:
      Description:
        type: string
      Pattern:
        type: string
      Type:
        type: string
  BagsInfo:
    type: object
    description : Bags Information is optional. If BagsInfo is used, then there must be one Bags element. If there is no bag quantity, this element should be omitted. The BagsInfo element can be used in conjunction with SeatBelts.
    properties:
      Description:
        type: string
      Ref:
        type: string
  Fixed:
    description : Fixed attribute is mandatory.It must be “false” if percent attribute is present.
    type: object
    properties:
      Ref:
        example : "false"
        type: string
  ReturnDate:
    description : Return date is mandatory and must be in the year month day (yyyy-mm-dd) format.
    type: object
    properties:
      Ref:
        example : "2024-01-12"
        type: string
      Title:
        type: string
  PositiveInteger:
    type: object
    properties:
      Minimum:
        type: integer
        format: int32
      Type:
        type: string
  AmountPercentage: 
    description: Amount Percentage is the percentage of commission received.
    type: object
    properties:
      Ref:
        type: string
  StateProv:
    type: object
    description : State province code is mandatory for US country code. It is optional for all other country codes and is 2-3 alpha characters. The use of state province code should be used to help narrow down the proper city when there are multiple city names in the same country.
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        type: string
      Properties:
        $ref: '#/definitions/Properties'
      Ref:
        example : "TX"
        type: string
      Type:
        type: string
  Definitions:
    type: object
    description : Object to contains multiple properties
    properties:
      AnyURL:
        $ref: '#/definitions/AnyURL'
      BagsInfoRes:
        $ref: '#/definitions/BagsInfoRes'
      CarExtrasPrefs:
        $ref: '#/definitions/CarExtrasPrefs'
      CountryName:
        $ref: '#/definitions/CountryName'
      CurrencyInfo:
        $ref: '#/definitions/CurrencyInfo'
      DateOrTimeOrDateTimeType:
        $ref: '#/definitions/DateOrTimeOrDateTimeType'
      Direction:
        $ref: '#/definitions/Direction'
      GetVehAvailRS:
        $ref: '#/definitions/GetVehAvailRS'
      Image:
