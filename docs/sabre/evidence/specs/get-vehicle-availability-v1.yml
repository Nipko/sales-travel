  ImagesRef:
    description : Images element is returned if the request in GetVehAvailRQ contains ‘ImagesRef’ element and if images are available for the vehicle requested for the car supplier in the country. It is optional.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        type: string
      Image:
        type: object
      Properties:
        $ref: '#/definitions/Properties'
      Required:
        type: array
        items:
          type: string
      Type:
        type: string
  AnyOfItem:
    description: Represents properties such as Bags.
    type: object
    properties:
      Type:
        type: string      
  AirportRef:
    description : Airport Reference is used when there is a single airport location code. If this option is used, then RentalLocRef and GeoRef cannot be used. When the airport code is entered as AirportRef it will get car rental locations that offer airport service. This will NOT get car rental locations around the Geo Point of the airport.
    type: object
    properties:
      PickUpLocation:
        $ref: '#/definitions/PickUpLocation'
      ReturnLocation:
        $ref: '#/definitions/ReturnLocation'
  ChargeType:
    description : |
      Charge type is mandatory. It must be one of the following 
        * BaseRateTotal – Primary rate total before taxes and
        * Fees ExtraDay – Charge for additional day if vehicle not returned on time
        * ExtraHour – Charge for additional hour if vehicle not returned on time
        * ApproximateTotalPrice – Estimated total price including taxes, fees, and car extras.
    type: object
    properties:
      JsonMemberEnum:
        type: array
        items:
          type: string
      type:
        example : BaseRateTotal
        type: string
  RentalHours:
    description : Rental hours is mandatory. Rental hours must be 1-2 numeric. A 'day' is a 24-hour period of time based on the time the car was picked up. 
      
      
      For 'single location, single car supplier' responses it contains the actual number of days the car supplier used to determine the type of rate returned. 
      
      
      For all other responses it contains the number of days and hours in the request as the difference between pickup date/time and return date/time. This is done because each supplier may round up or down on the length of rental to determine the rates returned.
    type: object
    properties:
      Ref:
        type: string
  LocationOwner:
    description : |
      Location owner attribute is mandatory. It is 1 alpha. 
       * 'C' – corporate owned location, 
       * 'F' – Franchise owned location.
    type: object
    properties:
      Ref:
        example : C
        type: string
  StringLength2:
    type: object
    properties:
