  RateAssured:
    type: object
    properties:
      Ref:
        description : 
          Rate assured is optional. If used, it must contain "true" or "false".  If false, it is usually omitted. 
          RatePrefs rate assured is used to request only suppliers that return the best publicly available rates. If this field is omitted, the response will contain responses from both car suppliers that return rate assured information and those that do not.
        type: string    
  Quantity:
    type: object
    properties:
      Maximum:
        description : Quantity is the maximum/minimum number of people in the vehicle.
                      Quantity is mandatory if the SeatBelts element is used. Quantity is 1-2 numeric (1-99 value). A realistic number would be 1-14.
        example :   5
        type: integer
        format: int32
      Minimum:
        description : Quantity is mandatory if the SeatBelts element is used. Quantity is 1-2 numeric (1-99 value). A realistic number would be 1-14.
        example :   1
        type: integer
        format: int32
      Type:
        type: string      
  RateCode:
    type: object
    properties:
      Ref:
        description : Rate code is a car supplier specific 2-6 alpha numeric code that is tied to the available rate. This is similar to Airline fares codes.
        example :   {"RateRule Vendor" : "XX" , "RateCode" : "ABC123"}
        type: object      
  RatePlanReturned:
    type: object
    properties:
      Ref:
        type: string
        description: Rate plan is mandatory. This field is 1 alpha and is used to generally describe the length of rental for rates.
          For example, Daily rates ‘D’, Weekly rates ‘W’. 
          This field for most plans are determined by the length of the car rental based on the number of days and hours, the difference between pickup date/time and return date/time. 
          The list of possible rate plans are daily ‘D’, weekend ‘E’, weekly ‘W’, monthly ‘M’, and ‘B’ Bundled (length of rental).
        example: "D"       
  RateKey:
    description: Key generated by the Rate during booking time.
    type: object
    properties:
      Ref:
        type: string      
  StateCode:
    description: State province state code is mandatory for USA locations and optional for all other locations. The state province state code is 2-3 alpha.
    type: object
    properties:
      Ref:
        type: string
        description: The state province state code element is mandatory for USA locations and optional for all other locations. The state province state code is 2-3 alpha.
        example : "TX"

  TotalAmount:
    description: Total Amount is mandatory.The total amount is 1-13 numeric or up to 12 with one decimal point.
    type: object
    properties:
      Ref:
        description : Total Amount is mandatory. The total amount is 1-13 numeric or up to 12 with one decimal point.
        example : "100"
        type: string      
  UOM:
    type: object
    properties:
      Ref:
        type: string     
        description : Unit of measure is optional, if not input it will default to miles. If used, it must be MI-miles or KM-kilometers. The default is miles, so it should be omitted for miles and used if the distance searched is in kilometers.
        example :   "KM"
  Vendor:
    description: Vendor code is the car supplier code. It is mandatory and is 2 alpha.
    type: object
    properties:
      Ref:
        description : The vendor code (car supplier code) attribute is mandatory.The vendor code is 2 alpha. 
        type: string
      Title:
        type: string      
  OperationSchedule:
    description: Time scheduled for the operation.
    type: object
    properties:
      Ref:
        type: string
      Title:
        type: string      
  ExtendedLocationCode:

    type: object
    properties:
      Pattern:
        type: string
      Ref:
        description : Extended Location Code attribute is optional. 
          If extended location code is used then the 3 alpha is followed by 1 additional alpha and 1-3 numerics. 
          The 1 additional alpha designates the type of non-airport either by a direction or type code. N-north, S-south, E-east, W-west, R-resort, X-rail, P-port, or C-city
        example :  "N987"    
        type: string
      Title:
        type: string
      Translatorfixme:
        type: string
      Type:
        type: string
