  VehAvailInfosVehAvailInfoVehRentalRateCarExtraCharges:
    description : Contains Vehicle Rental Rate Car Extra Charges.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        type: string
      Properties:
        $ref: '#/definitions/Properties'
      Type:
        type: string      
  Amount:
    description: Amount refers to the total rental amount.
    type: object
    properties:
      Ref:
        type: string
  GuaranteePrepaid:
    description : |
      Guarantee prepaid is optional. If omitted, guarantee and prepay rates may be returned, but usually only retail rates are returned. If used, the guarantee prepaid element must be one of the following 
      * G -  guaranteed only rates 
      * P -  prepaid only rates 
      * GP - guarantee and/or prepaid rates only 
      * GR - guarantee and/or retail rates only 
      * PR - prepaid and/or retail rates only 
      * GPR - guarantee, prepaid, and/or retail rates.
    type: object
    properties:
      Ref:
        type: string
      Title:
        type: string
      Type:
        description : The indicator is 1 alpha, guarantee ‘G’ or prepaid ‘P’.
        example : G
        type: string
        enum:
          - G
          - P
          - GP
  MembershipType:
    description : |
      Membership type is mandatory. It is 2 alpha and must be one of the following 
      CD – corporate discount, identifies agreements between a company car supplier. 
      IT – tour code, usually a package that includes more than just car supplier.
      ID – identity number of car supplier, frequent renter. 
      PC – promotional coupon – a temporary discount/upgrade offered by car supplier. 
      FT – frequent traveler number – airline frequent flyer – usually car supplier adds 'points' to the user's airline's card.
    type: object
    properties:
      JsonMemberEnum:
        type: array
        items:
          type: string
      Type:
        type: string
        example : CD

  Plan:
    description: Represents rate plan. It could be daily, weekly, monthly.
    type: object
    properties:
      Ref:
        type: string
  SearchCriteria:
    description : Search Criteria is used to describe the pickup and return date/time as well as any sort criteria.
    type: object
    properties:
      AirportRef:
        $ref: '#/definitions/AirportRef'
      CarExtrasPrefs:
        $ref: '#/definitions/CarExtrasPrefs'
      GeoRef:
        $ref: '#/definitions/GeoRef'
      ImageRef:
        $ref: '#/definitions/ImagesRef'
      LocPolicyRef:
        $ref: '#/definitions/LocPolicyRef'
      PickUpDate:
        description : The pickup date attribute is mandatory and must be in year month day format
        example : "2024-01-11"
        type: string
      PickUpTime:
        type: string
        description : The pickup time attribute is mandatory and must be in the 24-hour clock format.
        example : 08:15
      RatePrefs:
        $ref: '#/definitions/RatePrefs'

      RentalLocRef:
        type: object
      ReturnDate:
        type: string
      ReturnTime:
        type: string
      SortBy:
        description : |
          Sort By is optional. If present it must be Distance, Price, Preferred, Vendor, CarType. 
          * If SortBy is Preferred, it should be omitted, as it is the default. The default is different depending on the type of entry. 
          * If SortBy is not present and RentalLocRef is used, then display is ordered by Car Supplier.
          * If SortBy is not present and AirportRef used, then display is ordered by Price. 
          * If SortBy is not present and GeoRef used, then display is ordered by Distance.
          * If RentalLocRef is used, then SortBy Cartype or Price 
          * If AirportRef is used, then SortBy Vendor, Cartype, or Price 
          * If GeoRef used, then SortBy Distance, Vendor, Cartype, or Price.
        example : Price
        type: string
        enum:
          - Preferred
          - Distance
          - Price
          - Vendor
          - CarType
      SortOrder:
        type: string
        enum:
          - ASC
          - DESC
      VehPrefs:
        $ref: '#/definitions/VehPrefs'
      VendorPrefs:
        $ref: '#/definitions/VendorPrefs'
  LocationInfo:
    description : Location contains latitude and longitude information.The latitude and longitude attributes are optional, but are almost always present. They are not present if the geocode is not exact.
    type: object
    properties:
      AdditionalProperties:
        type: boolean
      Description:
        type: string
      Items:
        $ref: '#/definitions/Items'
      MinItems:
        type: integer
        format: int32
      Properties:
        $ref: '#/definitions/Properties'
      Ref:
        type: string
