  GeoCode:
    type: object
    properties:
      Latitude:
        type: number
        format: double
        description : The latitude and longitude attributes must be used together. The latitude and longitude attributes are the most common method of supplying the API with pickup or drop-off search criteria.
        example :  -12.123456
      Longitude:
        description : The latitude and longitude attributes must be used together. The latitude and longitude attributes are the most common method of supplying the API with pickup or drop-off search criteria.
        example :  -12.123456
        type: number
        format: double
