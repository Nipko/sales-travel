openapi: 3.0.2
info:
  title: Get Hotel Avail
  description: The Get Hotel Avail API is designed to retrieve the lowest rates available for multiple properties, listed in different rate sources, in one call. Optional request parameters may be provided to sort and filter the rates returned in the response.
  version: v5.0
servers:
  - url: https://{environment}.sabre.com
    variables:
      environment:
        default: "api.cert.platform"
        enum:
          - "api.cert.platform" # Public Certification Server
          - "api.platform" # Public Production Server

security:
  - oauth2_authentication: []

paths:
  /v5/get/hotelavail:
    post:
      description: Creates a request for the lowest rates available for multiple hotel properties.
      operationId: getHotelAvail
      summary: Lead rates from multiple properties.
      parameters:
        - name: Application-ID
          in: header
          description: The customer application ID. Recommended, but not mandatory. To generate a new application ID, contact your account manager.
          schema:
            type: string
      requestBody:
        description: Contains the parameters required to retrieve rates for indicated hotel properties or for properties located in a requested geographical area.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetHotelAvailRequest"
            examples:
              1. Rates for Hotels in Geographical Location:
                $ref: '#/components/examples/GetHotelAvailRequest'
        required: true
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHotelAvailResponse"
              examples:
                1. Rates for Hotels in Geographical Location:
                  $ref: '#/components/examples/GetHotelAvailResponse'

components:
  examples:
    GetHotelAvailRequest:
      description: |
        ##### Scenario
        The *Rates for Hotels in Geographical Location* example represents the most common use case for the **Get Hotel Avail API**. We will send a request to receive rates for hotel properties that are located in a particular geographical area of the world.  
        ##### Instruction
        To get a successful response, we need to provide the properties listed below in `GetHotelAvailRQ`:
        
        | Property | Description |
        | :--- | ---: |
        | `POS` | Contains Point of Sale information used to support shopping in an authorized branch location. |
        | `SearchCriteria` | Contains search parameters used to retrieve relevant hotel content via CSL. For a geographical location search, `GeoSearch` and `RateInfoRef` objects are mandatory to include in `SearchCriteria`. |
        | `GeoSearch` | Contains details of a specific geographical location to use in the hotel search. In this example, we are providing a `GeoCode` object within `GeoSearch`. |
        | `RateInfoRef` | Contains information used to define availability search parameters, such as the code of rate currency and the preferred stay period. |
        
        **Note:** Other request parameters are optional, and may be added to further refine search results.
      value:
        {
          "GetHotelAvailRQ": {
            "POS": {
              "Source": {
                "PseudoCityCode": "TM61"
              }
            },
            "SearchCriteria": {
              "OffSet": 1,
              "SortBy": "NegotiatedRateAvailability",
              "SortOrder": "ASC",
              "PageSize": 40,
              "GeoSearch": {
                "GeoRef": {
                  "Radius": 200,
                  "UOM": "MI",
                  "RestrictSearchToCountry": "US",
                  "GeoCode": {
                    "Latitude": 32.758,
                    "Longitude": -97.08
                  }
                }
              },
              "RateInfoRef": {
                "CurrencyCode": "USD",
                "BestOnly": "4",
                "StayDateTimeRange": {
                  "StartDate": "2025-02-21",
                  "EndDate": "2025-02-23"
                },
                "Rooms": {
                  "Room": [
                    {
                      "Index": 1,
                      "Adults": 1,
                      "Children": 1,
                      "ChildAges": "10"
                    }
                  ]
                }
              },
              "HotelPref": {
                "LenientHotelName": "inn and"
              }
            },
            {
              "TPAExtensions": {
                "Elements": {
                  "BrowserAgent": "Chrome"
                }
              }
            }
          }
        }

    GetHotelAvailResponse:
      description: |
        ##### Summary
        For our example of a *Rates for Hotels in Geographical Location* request, the service returned matching hotel properties. The data we received consists of two major sections:

        - `ApplicationResults` - Contains messages returned by the server, e.g. success, warning, and errors.
        - `HotelAvailInfos` - Contains availability details for all retrieved hotel properties. This portion of the response includes six parameters:
          - `OffSet` - The page number of the shopping response.
          - `MaxSearchResults` - The total number of hotel properties that match the requested search criteria. If greater than `PageSize` in the request, the `ShopKey` from the response may be used to view all remaining properties.
          - `ShopKey` - An encrypted key associated with the requested set of `SearchCriteria` that can be used to apply the same criteria in a new search for hotel properties.
          - `SearchLatitude` - The latitude provided in the search criteria.
          - `SearchLongitude` - The longitude provided in the search criteria.
          - `HotelAvailInfo` - Lists details of hotels that match the requested search criteria.
      
        ##### Next Steps
        The **Get Hotel Avail API** is the first step in the [CSL Workflow](https://developer.sabre.com/product-collection/content-services-for-lodging-csl/references).

