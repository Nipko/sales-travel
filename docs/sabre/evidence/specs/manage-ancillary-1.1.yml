    ExchangeAncillariesRequest:
      description: |
        ##### Scenario
          In this example called **Exchange Ancillaries**, we will send a request to exchange ancillaries booked for a particular passenger by using a preexisting `seatId` and an `offerItemId`.
          ##### Instruction
          To exchange ancillaries, we need to provide the following parameters:

          | Property | Description |
          | :--- | ---: |
          | `pnrLocator` | The PNR locator of the passenger in the GDS/CRS system. |
          | `seatId` | The ID of the pre-reserved seat to exchange. |
          | `offerItemId` | The offer item ID of the ancillary. |
          | `passengerRef` | The passenger `id` serving as a reference. |
          | `row` | The row number of the target seat to add to the booking. |
          | `column` | The column letter of the target seat to add to the booking. |
      value:
        {
          "pnrLocator": "PADLZK",
          "seats": [ {
            "seatId": 10,
            "offerItemId": "dd677fd5f549mgjnjlm4jlunm0-1",
            "passengerRef": "1.1",
            "row": 1,
            "column": "E"
          },
            {
              "seatId": 12,
              "offerItemId": "dd677fd5f549mgjnjlm4jlunm2-1",
              "passengerRef": "2.1",
              "row": 2,
              "column": "D"
            } ]
        }
