openapi: '3.0.0'
info:
  description: 'The Manage Ancillary API is used to add, delete, and exchange pre-reserved seats and associated ancillaries and/or add/delete other ancillaries in a PNR-based reservation.'
  version: '1.1'
  title: Manage Ancillary
servers:
  - url: https://{environment}.sabre.com{basePath}
    variables:
      environment:
        default: 'api.cert.platform'
        enum:
          - 'api.int.platform' # Public Test Server
          - 'api.cert.platform' # Public Certification Server
          - 'api.platform' # Public Production Server
      basePath:
        default: /v1/ancillaries
x-lingo-api-type: rpc
tags:
  - name: Add Ancillaries
    description: 'Allows you to add pre-reserved seats and associated ancillaries and/or other ancillaries to a booking.'
  - name: Remove Ancillaries
    description: 'Allows you to remove pre-reserved seats and associated ancillaries and/or other ancillaries from a booking.'
  - name: Exchange Ancillaries
    description: 'Allows you to exchange pre-reserved seats and associated ancillaries in a booking.'
paths:
  /add:
    post:
      description: 'Creates pre-reserved seats and associated ancillaries and/or other ancillaries in a PNR-based reservation.'
      operationId: addAncillaries
      tags:
        - Add Ancillaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAncillariesRequest'
            examples:
              1. Add Ancillaries with seat:
                $ref: '#/components/examples/AddAncillariesWithSeatRequest'
              2. Add non seat Ancillaries:
                $ref: '#/components/examples/AddNonSeatAncillariesRequest'
              3. Add Ancillaries with seat and non-seats:
                $ref: '#/components/examples/AddAncillariesWithSeatAndNonSeatRequest'
              4. Add Ancillaries with non-seats without productText or details:
                $ref: '#/components/examples/AddAncillariesWithoutProductTextInfoRequest'
      responses:
        '200':
          description: 'A successful response, unless errors are returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAncillariesResponse'
              examples:
                1. Add ancillaries with seat [Success]:
                  $ref: '#/components/examples/AddAncillariesWithSeatResponse'
                2. Add non seat ancillaries [Success]:
                  $ref: '#/components/examples/AddNonSeatAncillariesResponse'
                3. Add ancillaries with seat and non-seats [Success]:
                  $ref: '#/components/examples/AddAncillariesWithSeatAndNonSeatResponse'
                4. Add ancillaries error [Error]:
                  $ref: '#/components/examples/AddAncillariesErrorResponse'
  /remove:
    post:
      description: 'Creates space to add new pre-reserved seats and associated ancillaries by removing requested seats and/or other ancillaries from a PNR-based reservation.'
      operationId: removeAncillaries
      tags:
        - Remove Ancillaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveAncillariesRequest'
            examples:
              1. Remove Ancillaries:
                $ref: '#/components/examples/RemoveAncillariesRequest'
              2. Remove Ancillaries with seat:
                $ref: '#/components/examples/RemoveAncillariesWithSeatsRequest'
              3. Remove Seats:
                $ref: '#/components/examples/RemoveSeatsRequest'
      responses:
        '200':
          description: 'A successful response, unless errors are returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveAncillariesResponse'
              examples:
                1. Remove Ancillaries [Success]:
                  $ref: '#/components/examples/RemoveAncillariesResponse'
                2. Remove Ancillaries [Error]:
                  $ref: '#/components/examples/RemoveAncillariesErrorResponse'
                3. Remove Ancillaries with seat [Success]:
                  $ref: '#/components/examples/RemoveAncillariesWithSeatsResponse'
                4. Remove Seats [Success]:
                  $ref: '#/components/examples/RemoveSeatsResponse'
  /exchange:
    post:
      description: 'Creates exchanged pre-reserved seats and associated ancillaries in a PNR-based reservation.'
      operationId: exchangeAncillaries
      tags:
        - Exchange Ancillaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeAncillariesRequest'
            examples:
              1. Exchange Ancillaries:
                $ref: '#/components/examples/ExchangeAncillariesRequest'
      responses:
        '200':
          description: 'A successful response, unless errors are returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAncillariesResponse'
              examples:
                1.1 Exchange Ancillaries [Success]:
                  $ref: '#/components/examples/ExchangeAncillariesResponse'
                1.2 Exchange Ancillaries [Error]:
                  $ref: '#/components/examples/ExchangeAncillariesErrorResponse'
components:
  examples:
    AddAncillariesWithSeatRequest:
      description: |
        ##### Scenario
        The **Add Ancillaries** example presents a simple use-case for the **Manage Ancillaries API**. We will request ancillaries for a specified passenger by using an `offerItemId`.
        ##### Instruction
        To add ancillaries, we need to provide the following parameters:
        
        | Property | Description |
        | :--- | ---: |
        | `pnrLocator` | The PNR locator of the passenger in the GDS/CRS system. |
        | `offerItemId` | The offer item ID of an ancillary obtained from the [Get Seats API](https://developer.sabre.com/rest-api/get-seats) response during shopping.|
        | `passengerRef` | The passenger `id` serving as a reference. |
        | `row` | The row number of the seat to book. |
        | `column` | The column letter of the seat to book. |
      value:
        {
          "pnrLocator": "PAFDQX",
          "seats": [ {
            "offerItemId": "dd677fd5f549rctpzlm4jn38s0-2",
            "passengerRef": "1.1",
            "row": 8,
            "column": "B"
          }, {
            "offerItemId": "dd677fd5f549rctpzlm4jn38s0-10",
            "passengerRef": "2.1",
            "row": 19,
            "column": "B"
          } ]
        }
