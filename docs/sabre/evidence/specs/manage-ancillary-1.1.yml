    AddAncillariesErrorResponse:
      description: |
        ##### Summary
        Ancillaries could not be added in the reservation from the request due to processing errors. The response returns corresponding error details that can help debug the problem. Failed added transactions should not impact the PNR in any way.

        ##### Next Steps
        To send a successful call, correct your request as instructed in the returned error details and retry your call to the API.

