        type: integer
      Method:
        description: The Method value should be "Services" or "WholeResponse".
        example: WholeResponse
        type: string
    type: object
  org.opentravel.ota._2003._05.TransactionType.CompressResponse:
    additionalProperties: false
    properties:
      Value:
        description: Decides if the response should be compressed.
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.TransactionType.TravelerPersona:
    additionalProperties: false
    properties:
      Name:
        description: 'The name of the traveler persona. A target available for the user, that can be used to create specific rules. For example, if the client wants to target a preferred customer request, we can use this element to achieve this.'
        example: ABCD
        type: string
    type: object
  org.opentravel.ota._2003._05.TravelerInfoSummaryType:
    additionalProperties: false
    description: Specifies passenger numbers and types.
    properties:
      AirTravelerAvail:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.TravelerInformationType'
        type: array
      PriceRequestInformation:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType'
      SeatsRequested:
        items:
          description: The sum of all seats required by all passenger groups.
          example: 20
          type: integer
        type: array
    type: object
  org.opentravel.ota._2003._05.TravelerInformationType:
    additionalProperties: false
    description: >-
      Specifies passenger numbers and types.,,Allows to identify which one of requested passenger groups from Exchange request this solution relates to.,Identifies the location of the code table,Used to define a quantity of an associated element or attribute.,Used for Numeric values, from 0 to 999 inclusive,Specify traveler type code.,Allows to identify which one of requested passengers this solution relates to.,Used for Numeric values, from 0 to 999 inclusive,Identifies the source authority for the code.,Additional elements and attributes to be included if required, per Trading Partner Agreement (TPA).,Exchange-specific,Exchange-specific,Exchange-specific,Identifies whether penalties associated with voluntary changes should be included in the search results.,Indicates relation between conditions.,Specifies penalty charges as either a currency amount or a percentage of the fare.,Used for amounts, max 3 decimals,A currency code (e.g. USD, EUR, PLN),Indicates the number of decimal places
      for a particular currency. This is equivalent to the ISO 4217 standard "minor unit".,Indicate that specific penalty type should be excluded from the response.,Identifier used to indicate whether the change occurs before or after departure from the origin city.,Indicates the type (Refund or Exchange) of penalty involved in the search or response.
    properties:
      AirTraveler:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirTravelerType'
      PassengerTypeQuantity:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.PassengerTypeQuantityType'
        type: array
    type: object
  org.opentravel.ota._2003._05.UniqueIDType:
    additionalProperties: false
    description: 'An identifier used to uniquely reference an object in a system (e.g. an airline reservation reference, customer profile reference, booking confirmation number, or a reference to a previous availability quote).'
    properties:
      CompanyName:
        $ref: '#/definitions/org.opentravel.ota._2003._05.CompanyNameType'
      ID:
        description: A unique ID assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
        example: '123'
        type: string
      Type:
        description: A reference to the type of object defined by the UniqueID element. Refer to OTA Code List Unique ID Type (UIT).
        example: 0.AAA.X
        type: string
    type: object
  org.opentravel.ota._2003._05.ValidatingCarrierType:
    additionalProperties: false
    properties:
      Code:
        description: The code of the validating carrier.
        example: LO
        type: string
      Preference:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.ValidatingCarrierType.Preference'
        type: array
    type: object
  org.opentravel.ota._2003._05.ValidatingCarrierType.Preference:
    additionalProperties: false
    properties:
      Code:
        description: Two-character code for the preferred validating carrier.
        example: AA
        type: string
      Level:
        description: The preference level for the validating carrier. Valid values are - Preferred or Unacceptable.
        example: Preferred
        type: string
    type: object
  org.opentravel.ota._2003._05.VendorPrefApplicabilityType:
    additionalProperties: false
    description: Specifies if online or interline carrier selection logic should be applied for provided carrier type. One instance per carrier type.
    properties:
      Type:
        description: Indicates if marketing or operating.
        example: Marketing
        type: string
      Value:
        description: Specifies if provided carrier type preference should apply to at least one segment of itinerary or to entire itinerary. One instance per carrier type.
        example: AtLeastOneSegment
        type: string
    type: object
  org.opentravel.ota._2003._05.VendorPrefPairingType:
    additionalProperties: false
    description: Specifies which marketing and operating carrier pairs are preferred or unacceptable.
    properties:
      Applicability:
        description: Specifies carrier selection method. If specified carrier applicability should apply for entire itinerary.
        example: AllSegments
        type: string
      PreferLevel:
        description: Used to specify a preference level for all carrier combinations inside one element.
        example: Only
        type: string
      VendorPref:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.VendorPrefPairingType.VendorPref'
        type: array
    type: object
  org.opentravel.ota._2003._05.VendorPrefPairingType.VendorPref:
    additionalProperties: false
    description: Specify the vendors that are preferred or unacceptable in the response.
    properties:
      Code:
        description: 'Used to specify if the carrier type is marketing or operating.Also Defines preferred flight characteristics to be used in a search and identifies a particular type of flight - Direct, Stopover etc.,Used to specify a preference level for something that is or will be requested (e.g. a supplier of a service, a type of service, a form of payment, etc.). Indicates that if connection is chosen, then this attribute defines the maximum number of connections preferred.'
        example: XY
        type: string
      Type:
        description: Specifies what type of carrier it applies to. Possible values - Marketing or Operating.
        example: Marketing
        type: string
    type: object
  org.opentravel.ota._2003._05.VoluntaryChangesSMPType:
    additionalProperties: false
    description: Identifies whether penalties associated with voluntary changes should be included in the search results.
    properties:
      Match:
        description: Indicates the relation between conditions.
        example: Match="All" Indicates that all penalty conditions must be match by returned fare. Match="Any" Indicates that at least one penalty must by match by returned fare. Match="Info" Indicates that penalty information must be returned in the response.
        type: string
      Penalty:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.VoluntaryChangesSMPType.Penalty'
        type: array
    type: object
  org.opentravel.ota._2003._05.VoluntaryChangesSMPType.Penalty:
    additionalProperties: false
    description: Specifies penalty charges as either a currency amount or a percentage of the fare.
    properties:
      Amount:
        description: The total sum of the penalty.
        example: 200
        type: number
      Application:
        description: Indicates whether the change occurs before or after departure from the origin city. Also indicates the type (Refund or Exchange) of penalty involved in the search or response.
        example: After
        type: string
      CurrencyCode:
        description: The currency code of the penalty.
        example: USD
        type: string
      DecimalPlaces:
        description: Indicates the number of decimal places for a particular currency. This is equivalent to the ISO 4217 standard "minor unit".
        example: 1
        type: integer
      Exclude:
        description: 'If true, that specific penalty type should be excluded from the response.'
        example: true
        type: boolean
      Type:
        description: Indicates if penalty refers to Refund or Exchange.
        example: Refund
        type: string
    type: object
  org.opentravel.ota._2003._05.XOFaresType:
    additionalProperties: false
    description: Indicator for whether to return only fares with a passenger type the same as the passenger type specified in the request.
    properties:
      Value:
        description: 'If true, only fares with a passenger type the same as the passenger type specified in the request will be returned.'
        example: true
        type: boolean
    type: object
security:
  - oauth2_authentication: []
securityDefinitions:
  oauth2_authentication:
    flow: application
    tokenUrl: 'https://api.cert.platform.sabre.com/v2/auth/token'
    type: oauth2
    x-base64-encode-client-credentials: true
