swagger: '2.0'

info:
  description: 'Bargain Finder Max (BFM), our best-in-class low fare search product, is used to search for the lowest available priced itineraries based upon a specific date.'
  title: Bargain Finder Max
  version: v3
host: api.cert.platform.sabre.com
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /v3/offers/shop:
    post:
      operationId: createBargainFinderMax
      parameters:
        - description: The Bargain Finder Max for flights to create.
          in: body
          name: createBargainFinderMaxRequest
          required: false
          schema:
            $ref: '#/definitions/BargainFinderMaxRequest'
      responses:
        '200':
          description: Success.
          schema:
            $ref: '#/definitions/GroupedItineraryResponse'
definitions:
  org.opentravel.ota._2003._05.CabinPrefType:
    additionalProperties: false
    description: Defines the preferred cabin type(s) to be used in a search. The Cabin type specified in a OriginDestinationInformation/TPA_Extensions overrides this Cabin type for that specific segment/leg. If a Cabin type is not specified in a OriginDestinationInformation/TPA_Extensions the cabin type in this element will be used as default cabin type for that segment/leg.
    properties:
      Cabin:
        description: 'The specific type of the cabin. Valid values are Premium First (P), First (F), Premium Business (J), Business (C), Premium Economy (S), Economy (Y).'
        example: Economy or Y
        type: string
      PreferLevel:
        description: 'Used to specify a preference level for something that is or will be requested (e.g. a supplier of a service, a type of service, a form of payment, etc.).'
        example: Only
        type: string
    type: object
  org.opentravel.ota._2003._05.TransactionType.RequestType:
    additionalProperties: false
    properties:
      Name:
        description: The name of the type of request.
        example: 50ITINS
        type: string
  org.opentravel.ota._2003._05.TransactionType.ResponseSorting:
    additionalProperties: false
    description: Settings for IntelliSell merchandising
    properties:
      EnableChronologicalSorting:
        type: boolean
        description: 'If true, chronological sorting will be enabled.'
        example: true
      SortFaresInsideItin:
        type: boolean
        description: 'If true, fares will be sorted inside the itinerary.'
        example: true
    type: object
  Allowance:
    properties:
      ref:
        description: The unique ID of the baggage allowance.
        example: 1
        type: integer
    required:
      - ref
    type: object
  AncillaryFeeDetailsType:
    properties:
      amount:
        description: 'The total amount of the fee to be paid, in cash.'
        example: 20
        type: number
      ancillaryTypeCode:
        description: The code used to represent the type of the ancillary fee. Type F is flight related and type P means prepaid.
        example: F
        pattern: (F)|(P)
        type: string
      baggageId:
        description: The unique ID used to represent the baggage of the traveler.
        example: 1
        type: integer
      carrier:
        description: The carrier name of the traveler's journey.
        example: American Airlines
        pattern: '^([A-Z][A-Z0-9]{1})|([A-Z0-9][A-Z][A-Z0-9]?)|(\*\*).*$'
        type: string
      code:
        description: The code of the carrier of the traveler's journey.
        example: AA
        pattern: '[A-Z][A-Z0-9]{2}'
        type: string
      departureDate:
        description: The date of the departure. The format is YYYY-MM-DD.
        example: '2024-02-11'
        type: string
      description:
        description: A text description of the ancillary's fee details.
        example: The baggage fee is paid ahead of the flight.
        type: string
      description1:
        description: Baggage description line 1.
        example: 'UP TO 50 POUNDS/23 KILOGRAMS'
        type: string
      description2:
        description: Baggage description line 2.
        example: 'UP TO 80 LINEAR INCHES/203 LINEAR CM'
        type: string
      destination:
        description: The end destination of the journey.
        example: DFW
        maxLength: 3
        minLength: 3
        pattern: '[A-Z]{3}'
        type: string
      endSegment:
        description: The end segment of the travelers journey.
        example: 4
        type: integer
      firstOccurrence:
        type: integer
        description: Ancillary Fee description lines from ATPCO filing.
        example: 1
      lastOccurrence:
        description: Ancillary Baggage Information. Last occurrence for which the baggage charge applies. If last occurrence is not returned, baggage option has no limit of pieces that can be sold.
        example: 2
        type: integer
      origin:
        description: 'The origin, meaning starting location, of the travelers journey.'
        example: DFW
        maxLength: 3
        minLength: 3
        pattern: '[A-Z]{3}'
        type: string
      startSegment:
        description: 'The start, or beginning, segment of the travelers journey.'
        example: 1
        type: integer
      subcode:
        description: The subcode of the ATPCO Optional Services Industry.
        example: 0
        maxLength: 3
        minLength: 3
        type: string
      subgroup:
        description: Ancillary subgroup two letter code.
        example: SP
        maxLength: 2
        minLength: 2
        type: string
    required:
      - code
      - origin
      - destination
      - carrier
      - amount
      - startSegment
      - endSegment
    type: object
  AncillaryFeeGroupType:
    properties:
      ancillaryFees:
        items:
          $ref: '#/definitions/AncillaryFeeType'
        type: array
      orderStandardBag:
        $ref: '#/definitions/OrderStandardBag'
    type: object
  AncillaryFeeType:
    properties:
      code:
        description: 'The code used to represent the ancillary fee type. Can be BG (Baggage), IE (in-flight entertainment), ML (Meals), SA (Seats), UN (Unaccompanied Passenger).'
        example: BG
        type: string
      details:
        description: A text description of the ancillary fee's details.
        items:
          $ref: '#/definitions/AncillaryFeeDetailsType'
        type: array
      message:
        description: The text information of the message.
        example: AIR EXTRAS NOT APPLICABLE OR ARE UNKNOWN
        type: string
      name:
        description: The name of the ancillary fee.
        example: IN-FLIGHT ENTERTAINMENT
        type: string
    required:
      - code
      - name
    type: object
  Arrival:
    properties:
      airport:
        description: The airport in which the journey will end.
        example: DFW
        maxLength: 3
        minLength: 3
        pattern: '[A-Z]{3}'
        type: string
      city:
        description: The city in which the journey will end.
        example: KRK
        maxLength: 3
        minLength: 3
        pattern: '[A-Z]{3}'
        type: string
      country:
        description: The country in which the journey will end.
        example: US
        pattern: '[A-Z]{2}'
        type: string
      dateAdjustment:
        description: 'The change in the timezones between the origin and destination locations, if applicable, in hours.'
        example: 2
        type: integer
      state:
        description: The state or province in which the journey will end.
        example: CA
        maxLength: 2
        minLength: 2
        pattern: '[A-Z]{2}'
        type: string
      terminal:
        description: The name of the departure terminal.
        example: A
        type: string
      time:
        description: 'The time of the journeys end, i.e. when the traveler will arrive at their end destination.'
        example: '20:30'
        type: string
    required:
      - airport
      - time
    type: object
  BaggageAllowanceType:
    properties:
      description1:
        description: The first line of the description of the baggage's allowance type.
        example: You have up to 20 kg of baggage allowed.
        type: string
      description2:
        description: The second line of the description of the baggage's allowance type.
        example: Baggage above 20 kg will incur penalties.
        type: string
      id:
        description: The unique ID that represents the baggage's allowance type.
        example: 1
        type: integer
      pieceCount:
        description: The total amount of baggage pieces allowed on the journey.
        example: 2
        type: integer
      unit:
        description: The unit of measurement used for the baggage type.
        example: kg
        pattern: (lbs)|(kg)
        type: string
      weight:
        description: the total allowed weight of the baggages.
        example: 30
        type: integer
    required:
      - id
    type: object
  BaggageChargeType:
    properties:
      description1:
        description: The first line of the charge type's description.
        example: This charge is airport only.
        type: string
      description2:
        description: The second line of the charge type's description.
        example: It applies only to additional baggage items.
        type: string
      equivalentAmount:
        description: The equivalent amount of the charge.
        example: 200
        type: number
      equivalentCurrency:
        description: The currency in which the charge is applied.
        example: USD
        pattern: '[a-zA-Z]{3}'
        type: string
      firstPiece:
        description: The first of the baggage pieces this specific baggage charge applies to.
        example: 1
        type: integer
      id:
        description: The unique ID of the charge type. Baggage Charge ID.
        example: 1
        type: integer
      lastPiece:
        description: The last  of the baggage pieces this specific baggage charge applies to.
        example: 1
        type: integer
      noChargeNotAvailable:
        description: 'This attribute will be returned in the response whenever charges are unavailable when requesting baggage information. The response might contain one of the below possible description. X - service not available. F - no charge for service (free) and an EMD is not issued to reflect the free service. E - no charge for service (free) and an EMD is issued to reflect the free service. G - no charge for service (free), booking is not required and an EMD is not issued to reflect the free service. H - no charge for service (free), booking is not required and an EMD is issued to reflect the free service.'
        example: X
        maxLength: 1
        minLength: 1
        type: string
    required:
      - id
    type: object
  BeverageAmenityType:
    description: Identifies beverage service in a given cabin. These elements are later referenced from FlightAmenities.
    properties:
      alcoholicCost:
        enum:
          - free
          - paid
        description:  Indicates whether there is a charge for alcoholic beverages, possible values; "paid", "free", "free or paid".
        example: paid
        type: string
      exists:
        description: Specifies whether beverages exist on the flight in the cabin, possible values; "yes" or "no".
        example: yes
        type: boolean
      id:
        description: The number of the Beverages return.
        example: 1
        type: integer
      nonAlcoholicCost:
        enum:
          - free
          - paid
        description: Identifies whether there is a charge for non-alcoholic beverages, possible values. Can be paid, free, free or paid.
        example: free
        type: string
    required:
      - id
    type: object
  BaggageInformationType:
    properties:
      airlineCode:
        description: The code used to identify the airline in charge of the baggage.
        example: AA
        pattern: '^([A-Z][A-Z0-9]{1})|([A-Z0-9][A-Z][A-Z0-9]?)|(\*\*)|([A-Za-z]{0}).*$'
        type: string
      allowance:
        $ref: '#/definitions/Allowance'
      charge:
        $ref: '#/definitions/Charge'
      provisionType:
        description: Contains baggage information with the following possible values."A"- Check-in Allowance and "C"- Day of Check-in Charges.
        example: A
        pattern: (A)|(C)|(B)|(CC)|(E)|(P)|(EE)|()
        type: string
      segments:
        items:
          $ref: '#/definitions/Segment'
        maxItems: 2147483647
        minItems: 1
        type: array
    required:
      - segments
      - provisionType
      - airlineCode
    type: object
  BaggageSequenceOrder:
    properties:
      baggageRef:
        description: Baggage ID number that follows the current hierarchy in sorting Air Extras.
        example: 1
        type: integer
      standardBag:
        description: Identifies the number of the standard baggages. It can be 1-the first standard bag, 2-the second standard bag.
        example: 1
        type: integer
    required:
      - baggageRef
      - standardBag
    type: object
  BargainFinderMaxRequest:
    example:
      OTA_AirLowFareSearchRQ:
        OriginDestinationInformation:
          - DepartureDateTime: '2026-06-21T00:00:00'
            DestinationLocation:
              LocationCode: LAX
            OriginLocation:
              LocationCode: NYC
            RPH: '0'
          - DepartureDateTime: '2026-06-22T00:00:00'
            DestinationLocation:
              LocationCode: NYC
            OriginLocation:
              LocationCode: LAX
            RPH: '1'
        POS:
          Source:
            - PseudoCityCode: F9CE
              RequestorID:
                CompanyName:
                  Code: TN
                ID: '1'
                Type: '1'
        TPA_Extensions:
          IntelliSellTransaction:
            RequestType:
              Name: 200ITINS
        TravelPreferences:
          TPA_Extensions:
            DataSources:
              ATPCO: Enable
              LCC: Disable
              NDC: Disable
            NumTrips: {}
        TravelerInfoSummary:
          AirTravelerAvail:
            - PassengerTypeQuantity:
                - Code: ADT
                  Quantity: 1
          SeatsRequested:
            - 1
        Version: '3'
    properties:
      OTA_AirLowFareSearchRQ:
        additionalProperties: false
        description: 'The Low Fare Search Request message requests priced itinerary options for flights between specific city pairs on specific dates for specific numbers and types of passengers. Optional request information can include: - Time / Time Window - Connecting cities. - Client Preferences (airlines, cabin, flight types etc.) The Low Fare Search request contains similar information to a Low Fare Search entry on an airline CRS or GDS.'
        properties:
          AltLangID:
            description: The unique ID of the alternate language.
            example: en-us
            type: string
          AvailableFlightsOnly:
            description: 'If true, only flights with available booking codes will be included.'
            example: true
            type: boolean
          DirectFlightsOnly:
            description: 'If true, a request will be made for direct flights between given locations. This defaults to false.'
            example: false
            type: boolean
          EchoToken:
            description: 'A sequence number for additional message identification, assigned by the requesting host system. When a request message includes an echo token the corresponding response message MUST include an echo token with an identical value.'
            example: 'ase032lpscilyxf.idm.sgdccert.sabre.com:27037 2024-03-10T02:34:20 1429671'
            type: string
          MaxResponses:
            description: A positive integer value that indicates the maximum number of responses desired in the return.
            example: three.
            type: string
          OriginDestinationInformation:
            items:
              $ref: '#/definitions/org.opentravel.ota._2003._05.OTAAirLowFareSearchRQ.OriginDestinationInformation'
            type: array
          POS:
            $ref: '#/definitions/org.opentravel.ota._2003._05.POSType'
          PrimaryLangID:
            description: Identifes the primary language preference for the form of travel represented in a collection. The language is identified by an ISO 639-3 code.
            example: eng
            type: string
          ResponseType:
            description: The type of the response given back to the caller.
            example: GIR
            type: string
          ResponseVersion:
            description: The version number of the response.
            example: v3
            type: string
          SeparateMessages:
            description: 'If true, all messages should be printed in a separate MTP element. This only works with PSS response serializers.'
            example: true
            type: boolean
          SequenceNmbr:
            description: Used to identify the sequence number of the transaction as assigned by the sending system; allows for an application to process messages in a certain order or to request a resynchronization of messages in the event that a system has been offline and needs to retrieve messages that were missed.
            example: '1'
            type: string
          TPA_Extensions:
            $ref: '#/definitions/org.opentravel.ota._2003._05.OTAAirLowFareSearchRQ.TPAExtensions'
          Target:
            description: Used to indicate whether the request is for the Test or Production system.
            example: Test
            type: string
          TimeStamp:
            description: 'Indicates the creation date and time of the message in UTC using the following format specified by ISO 8601; YYYY-MM-DDThh:mm:ssZ with time values using the 24 hour clock (e.g. 20 November 2024, 1:59:38 pm UTC becomes 2024-11-20T13:59:38Z).'
            example: '2024-11-20T13:59:38Z'
            type: string
          TransactionIdentifier:
            description: A unique identifier to relate all messages within a transaction (e.g. this would be sent in all request and response messages that are part of an on-going transaction).
            example: ad1b91b3-91e0-4854-8788-fa795354
            type: string
          TransactionStatusCode:
            description: |-
              This indicates where this message falls within a sequence of messages. Start - First message within a transaction. End - Last message within a transaction. Rollback - Indicates that all messages within the current transaction must be ignored. InSeries - Any message that is not the first or last message within a transaction.
            example: Start
            type: string
          TravelPreferences:
            $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType'
          TravelerInfoSummary:
            $ref: '#/definitions/org.opentravel.ota._2003._05.TravelerInfoSummaryType'
          TruncateMessages:
            description: 'If true, each MTP content should be truncated to specified length. This only works with PSS response serializers.'
            example: true
            type: boolean
          Version:
            description: The version of the content.
            example: v3
            type: string
        type: object
    title: org.opentravel.ota._2003._05.OTAAirLowFareSearchRQ
    type: object
  BrandFeatureIDType:
    properties:
      ref:
        description: A number that is used as a reference for BrandFeature ID.
        example: 3
        type: integer
      serviceId:
        description: The unique ID of a service within the context of one message. A service is a feature/service included in a given flight.
        example: db857d657cb7kdz4rk7aeur020-1-1-1
        type: string
    required:
      - ref
    type: object
  BrandFeatureType:
    properties:
      application:
        description: 'Indicates if the service is free (F), not offered (N), chargeable (C), or displayed but not offered (D).'
        example: free
        maxLength: 1
        minLength: 1
        type: string
      commercialName:
        description: Textual description of the service within the brand.
        example: CHECKED BAG SECOND
        type: string
      id:
        description: the unique ID of the Brand Feature.
        example: 210
        type: integer
      serviceGroup:
        description: The code used to specify the group of ancilliaries of the service.
        example: BG
        pattern: '[A-Z0-9]{2}'
        type: string
      serviceType:
        description: 'Service possible codes. Z- Branded Fares, F-Flight related, T- ticket related ancillary, A- Allowance, P- Prepaid.'
        example: T
        maxLength: 1
        minLength: 1
        type: string
      subCode:
        description: Three-character alphanumeric code that is filed in the S5 record. This can be an industry sub-code or a carrier defined sub-code.
        example: 0EN
        pattern: '[A-Z0-9]{3}'
        type: string
      vendor:
        description: 'The code used to represent the vendor, or the data provider from where it was taking the information.'
        example: ATP
        type: string
    required:
      - id
      - application
      - serviceType
      - serviceGroup
      - subCode
      - vendor
      - commercialName
    type: object
  BrandType:
    properties:
      brandName:
        description: The name of the brand.
        example: American Airlines
        type: string
      code:
        description: The two-character code for the brand.
        example: AA
        type: string
      programCode:
        description: The code of the Brand program that is returned from the branding service.
        example: DOMBE
        type: string
      programDescription:
        description: The description of the program. A program is a set of fare brands with a point of sale and origin and destination that is designed to be marketed with services desirable to customers.
        example: BT FARES
        type: string
      programId:
        description: The unique ID assigned by the system.
        example: AAA
        type: string
      programSystemCode:
        description: Program code assigned by the system.
        example: A
        type: string
    required:
      - code
    type: object
  Cached:
    properties:
      hoursSinceCreation:
        description: The amount of hours passed since the option was created and stored in the cache (in hours).
        example: 2
        type: integer
      ref:
        description: The reference for the ID of the Cache source description.
        example: 1
        type: integer
      timeToLive:
        description: 'The time to live in the cache, specified in seconds.'
        example: 900
        type: integer
    required:
      - ref
    type: object
  Carrier:
    properties:
      alliances:
        description: Only these alliances will be considered.
        example: Star Alliance
        type: string
      basicBookingRequest:
        description: 'If true, the booking request is basic for this carrier.'
        example: true
        type: boolean
      callDirect:
        description: 'If true, the carrier will be called directly.'
        example: false
        type: boolean
      codeShared:
        description: The code of the shared carrier.
        example: AA
        type: string
      disclosure:
        description: The disclosure agreement of the carrier.
        example: VS
        pattern: '^([A-Z][A-Z0-9]{1})|([A-Z0-9][A-Z][A-Z0-9]?)|(\*\*).*$'
        type: string
      equipment:
        $ref: '#/definitions/Equipment'
      marketing:
        description: The marketing code of the carrier.
        example: AA
        pattern: '^([A-Z][A-Z0-9]{1})|([A-Z0-9][A-Z][A-Z0-9]?)|(\*\*).*$'
        type: string
      marketingFlightNumber:
        description: Marketing flight number.
        example: 557
        type: integer
      operating:
        description: The name of the operating carrier.
        example: American Airlines
        pattern: '^([A-Z][A-Z0-9]{1})|([A-Z0-9][A-Z][A-Z0-9]?)|(\*\*).*$'
        type: string
      operatingFlightNumber:
        description: The number of the operating flight.
        example: 665
        type: integer
    required:
      - marketing
      - marketingFlightNumber
    type: object
  Cat16TextOnly:
    properties:
      fareBasisCode:
        description: The fare basis code for the price for this passenger type code (PTC).
        example: ONLN3C
        maxLength: 15
        minLength: 1
        pattern: '[A-Z0-9]+(\/[A-Z0-9]+)?'
        type: string
      fareComponentId:
        description: The unique ID of the fare component. Category 16 contains text only.
        example: 1
        type: integer
    required:
      - fareBasisCode
      - fareComponentId
    type: object
  ChangeFeeType:
    properties:
      amount:
        description: The total amount of the changed fee.
        example: 100
        type: number
      currency:
        description: The currency of the changed fee.
        example: USD
        pattern: '[A-Z]{3}'
        type: string
      highest:
        description: Highest change fee indicator.
        example: false
        type: boolean
      notApplicable:
        description: 'If true, the changed fee is not applicable.'
        example: true
        type: boolean
      waived:
        description: 'If true, the changed fee has been waived.'
        example: false
        type: boolean
    required:
      - amount
      - currency
    type: object
  Charge:
    properties:
      ref:
        description: The reference ID for the baggage charge.
        example: 1
        type: integer
    required:
      - ref
    type: object
  Country:
    properties:
      code:
        description: The two-letter IATA code of the country.
        example: US
        pattern: '[A-Z]{2}'
        type: string
    required:
      - code
    type: object
  CurrencyConversionType:
    properties:
      exchangeRate:
        description: The exchange rate of the currency.
        example: 2
        type: number
      exchangeRateUsed:
        description: The Exchange rate used in the currency conversion.
        example: 2
        type: number
      from:
        description: The name of the currency the conversion is from.
        example: USD
        pattern: '[A-Z]{3}'
        type: string
      overriden:
        description: 'If true, the conversion is overridden.'
        example: true
        type: boolean
      to:
        description: The name of the currency the conversion is for.
        example: GBP
        pattern: '[A-Z]{3}'
        type: string
    type: object
  Departure:
    properties:
      airport:
        description: The three-letter code of the departure airport.
        example: DFW
        maxLength: 3
        minLength: 3
        pattern: '[A-Z]{3}'
        type: string
      city:
        description: The three-letter code of the departure city.
        example: KRK
        maxLength: 3
        minLength: 3
        pattern: '[A-Z]{3}'
        type: string
      country:
        description: The three-letter code of the departure country.
        example: USA
        pattern: '[A-Z]{2}'
        type: string
      state:
        description: The two-letter code of the departure state.
        example: NY
        maxLength: 2
        minLength: 2
        pattern: '[A-Z]{2}'
        type: string
      terminal:
        description: The name of the departure terminal.
        example: A
        type: string
      time:
        description: The time of the departure.
        example: '12:40:00+04:00'
        type: string
    required:
      - airport
      - time
    type: object
  EntertainmentAmenityType:
    description: This describes best available entertainment in a given cabin. These alements are later referenced from FlightAmenities.
    properties:
      cost:
        enum:
          - free
          - paid
        description: Indicates whether there is a charge for entertainment. It can be free or paid.
        example: paid
        type: string
      exists:
        description: Indicates whether entertainment is available on the flight in the cabin. It can be "yes" or "no".
        example: yes
        type: boolean
      id:
        description: The number of Entertainment returned.
        example: 1
        type: integer
      type:
        pattern: (none)|(livetv)|(loop)|(on-demand)|(overhead)|(seatback)|(pre-download)|(streaming)|(tablet)
        description: Indicates the best entertainment type available. It can be livetv, loop, none, on-demand, overhead, pre-download, pre-download seatback, streaming, tablet.
        example: tablet
        type: string
    required:
      - id
    type: object
  Equipment:
    properties:
      change:
