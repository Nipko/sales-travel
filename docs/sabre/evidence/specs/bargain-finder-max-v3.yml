      RequestType:
        $ref: '#/definitions/org.opentravel.ota._2003._05.TransactionType.RequestType'
      ResponseSorting:
        $ref: '#/definitions/org.opentravel.ota._2003._05.TransactionType.ResponseSorting'
      TravelerPersona:
