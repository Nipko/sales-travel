        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck'
      VerificationItinCallLogic:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.VerificationItinCallLogic'
      XOFares:
        $ref: '#/definitions/org.opentravel.ota._2003._05.XOFaresType'
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.AdditionalFareLimit:
    additionalProperties: false
    properties:
      Value:
        description: The additional fare limit.
        example: 200
        type: number
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.CountryPref:
    additionalProperties: false
    description: The list of countries to be excluded from processing.
    properties:
      Code:
        description: The 2 character country code as defined in ISO3166 of the country.
        example: US
        type: string
      PreferLevel:
        description: 'Used to specify a preference level for something that is or will be requested (e.g. a supplier of a service, a type of service, a form of payment, etc.).'
        example: Only
        type: string
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.DataSources:
    additionalProperties: false
    properties:
      ATPCO:
        description: This toggles the processing of the ATPCO data source.
        example: Enable
        type: string
      LCC:
        description: This toggles the processing of the Low Cost Carriers data source.
        example: Enable
        type: string
      NDC:
        description: This toggles the processing of the New Distribution Capability data source.
        example: Disable
        type: string
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.DiversityParameters:
    additionalProperties: false
    properties:
      AdditionalNonStopsNumber:
        description: This defines how many additional non-stop options should be added to the response. Overrides @Percentage.
        example: 3
        type: integer
      AdditionalNonStopsPercentage:
        description: Defines how many additional non-stop options should be added to the response as a percentage of the requested number of options.
        example: 20
        type: integer
      InboundOutboundPairing:
        description: Defines the requested ratio of inbounds to outbounds in the response.
        example: 3
        type: integer
      TimeOfDayDistribution:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.DiversityParameters.TimeOfDayDistribution'
      Weightings:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.DiversityParameters.Weightings'
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.DiversityParameters.TimeOfDayDistribution:
    additionalProperties: false
    description: Defines how the options in the response should be distributed between certain departure time of day ranges. All defined TimeOfDayRanges need to cover the whole day and the sum of all Percentages needs to equal 100.
    properties:
      TimeOfDayRange:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.DiversityParameters.TimeOfDayDistribution.TimeOfDayRange'
        type: array
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.DiversityParameters.TimeOfDayDistribution.TimeOfDayRange:
    additionalProperties: false
    properties:
      Begin:
        description: The beginning of the TimeOfDayRange in the HHMM format.
        example: '1230'
        type: string
      End:
        description: The end of the TimeOfDayRange in the HHMM format.
        example: '1330'
        type: string
      Percentage:
        description: Defines how many percent options should be in the TimeOfDayRange.
        example: 10
        type: integer
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.DiversityParameters.Weightings:
    additionalProperties: false
    description: Defines how important various parameter options are in the response. The sum of all weightings needs to equal 10.
    properties:
      PriceWeight:
        description: 'This defines how important price options are, on a scale of 0 to 10.'
        example: 10
        type: integer
      TravelTimeWeight:
        description: 'This defines how important travel time options are, on a scale from 0 to 10.'
        example: 5
        type: integer
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ExcludeCallDirectCarriers:
    additionalProperties: false
    properties:
      Enabled:
        description: 'If true,  DSF will return schedules only for carriers bookable by Sabre.'
        example: false
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ExcludeVendorPref:
    additionalProperties: false
    description: This element allows a user to exclude certain carriers from the search.
    properties:
      Code:
        description: Identifies a company by the company code.
        example: AA
        type: string
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.FareFocusRules:
    additionalProperties: false
    properties:
      Exclude:
        description: 'If true, fare focus rules are excluded.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.LongConnectPoints:
    additionalProperties: false
    description: Minimum and maximum number of connection points (not necessarily long themselves) for Long Connections.
    properties:
      Max:
        description: The maximum amount of connection points.
        example: 10
        type: number
      Min:
        description: The minimum amount of connection points.
        example: 5
        type: number
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.LongConnectTime:
    additionalProperties: false
    description: 'Change minimum and maximum connect time per connection in long connection schedules, specify number or percentage of requested solutions if Long Connect Time logic is enabled. Time values should be less than 1440 minutes (24 hours). If percentage is specified, % symbol should be added after the number, otherwise exact number of solutions should be provided.'
    properties:
      Enable:
        description: 'If true, long connect time is enabled.'
        example: true
        type: boolean
      Max:
        description: The maximum amount of connect time per connection.
        example: 20
        type: number
      Min:
        description: The minimum amount of connect time per connection.
        example: 10
        type: number
      NumberOfSolutions:
        description: The total amount of solutions per connection.
        example: '2'
        type: string
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.LowCostCarriersProcessing:
    additionalProperties: false
    properties:
      Disable:
        description: 'If true, low cost carriers processing is disabled.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators:
    additionalProperties: false
    description: The element in the schema for requesting AccountCode from NDC Content.
    properties:
      SingleBrandedFare:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.SingleBrandedFare'
      MultipleBrandedFares:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.MultipleBrandedFares'
      ParityMode:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.ParityMode'
      MaxNumberOfUpsells:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.MaxNumberOfUpsells'
      CarrierSpecificQualifiers:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.CarrierSpecificQualifiers'
        type: array
      Qualifier:
        description: General qualifiers. Each qualifier will only be used for carriers without CarrierSpecificQualifiers override provided.
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.QualifierType'
        type: array
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.SingleBrandedFare:
    additionalProperties: false
    description: Indicates whether price class information is displayed.
    properties:
      Value:
        description: SingleBrandedFare Indicates whether price class information is displayed. Allows to display brand information, useful for low fare search. Default value is equal to true.
        example: true
        type: boolean
    required:
      - Value
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.MultipleBrandedFares:
    additionalProperties: false
    description: Indicates whether NDC upsells are allowed.
    properties:
      Value:
        description: MultipleBrandedFares indicates if upsells are allowed, without this attribute only lowest fare is returned. Default value is equal true.
        example: true
        type: boolean
    required:
      - Value
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.ParityMode:
    additionalProperties: false
    description: Parity mode for the PriceClasses.
    properties:
      Mode:
        description: Parity mode for the PriceClasses. Must specify required attribute Mode with value equal to Leg or Itin.
        example: Itin
        enum:
          - Leg
          - Itin
        type: string
    required:
      - Mode
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.MaxNumberOfUpsells:
    additionalProperties: false
    description: Indicates maximum number of NDC upsells per itinerary.
    properties:
      Value:
        description: Attribute allows to set the displayed amount of additional upsells for the journey. The default value is equal to 0.
        example: 5
        type: number
    required:
      - Value
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators.CarrierSpecificQualifiers:
    additionalProperties: false
    description: Carrier specific qualifiers. If an attribute is specified in both places, the general qualifier will be overwritten with the carrier specific value.
    properties:
      AccountCode:
        additionalProperties: false
        properties:
          Code:
            description: Account code (optional) to retrieve fares filed with this account code.
            example: XYZ
            minLength: 1
            maxLength: 20
            type: string
        required:
          - Code
        type: object
      Qualifier:
        description: General qualifiers.
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.QualifierType'
        type: array
      CarrierCode:
        description: The code for a carrier for which the qalifiers are provided.
        example: AA
        type: string
    required:
      - CarrierCode
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NumTripsWithRouting:
    additionalProperties: false
    description: This element allows a user to specify the number of itineraries with special routing returned.
    properties:
      Number:
        description: The specific amount of itineraries with special routing returned.
        example: 5
        type: number
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.OnlineIndicator:
    additionalProperties: false
    properties:
      Ind:
        description: 'If true, only online itineraries are returned.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.PreferNDCSourceOnTie:
    additionalProperties: false
    properties:
      Value:
        description: 'If true, NDC source is preferred on ties.'
        example: false
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.SellingLevels:
    additionalProperties: false
    properties:
      SellingLevelRules:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.SellingLevels.SellingLevelRules'
      ShowFareAmounts:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.SellingLevels.ShowFareAmounts'
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.SellingLevels.SellingLevelRules:
    additionalProperties: false
    properties:
      Ignore:
        description: 'If true, ignore adjustment selling level rules.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.SellingLevels.ShowFareAmounts:
    additionalProperties: false
    properties:
      Adjusted:
        description: 'If true, only selling level amounts and the total adjusted amount are shown in the Fare Calc line.'
        example: true
        type: boolean
      Original:
        description: 'If true, only original selling fare level amounts and the total adjusted amount are shown the in Fare Calc line.'
        example: false
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.TicketingSumOfLocals:
    additionalProperties: false
    description: Settings specific to Ticketing Sum of Locals processing.
    properties:
      Enable:
        description: 'If true,  Ticketing Sum of Locals processing is enabled.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.TripType:
    additionalProperties: false
    properties:
      Value:
        description: The type of trip. OneWay - One-way trip. Return - (default) Round-trip. Circle - Circle trip. OpenJaw - Open jaw trip.
        example: OneWay
        type: string
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck:
    additionalProperties: false
    properties:
      Carrier:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck.Carrier'
        type: array
      Country:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck.Country'
        type: array
      IETValidation:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck.IETValidation'
      SettlementValidation:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck.SettlementValidation'
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck.Carrier:
    additionalProperties: false
    properties:
      Code:
        description: The code used to identify the validating carrier for the check.
        example: AA
        type: string
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck.Country:
    additionalProperties: false
    properties:
      Code:
        description: A 2-character country code as defined in ISO3166 for the country of the validating carrier.
        example: US
        type: string
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck.IETValidation:
    additionalProperties: false
    description: 'If set to true, IET agreement is validated for the listed countries.'
    properties:
      Ind:
        description: 'If true, IET agreement is validated for the listed countries.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.ValidatingCarrierCheck.SettlementValidation:
    additionalProperties: false
    description: 'If set to true, the BSP agreement is validated for the given carriers.'
    properties:
      Ind:
        description: 'If true, the BSP agreement is validated for the given carriers.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.VerificationItinCallLogic:
    additionalProperties: false
    properties:
      AlwaysCheckAvailability:
        description: 'If true, availability for repriced itineraries is always checked.'
        example: true
        type: boolean
      Value:
        description: Define how the current itinerary is priced.
        enum:
          - L
          - B
          - M
        type: string
    type: object
  org.opentravel.ota._2003._05.AirTravelerType:
    additionalProperties: false
    description: 'Information profiling the traveler''s Gender - the gender of the customer, if needed, their BirthDate - Date of Birth, and Currency - the preferred currency in which monetary amounts should be returned.'''
    properties:
      PassengerTypeCode:
        description: The code assigned to this specific type of passenger.
        example: ADT
        type: string
      PassengerTypeQuantity:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PassengerTypeQuantityType'
    type: object
  org.opentravel.ota._2003._05.AllianceType:
    additionalProperties: false
    description: Enables the preference to choose given alliance or not.
    properties:
      Code:
        description: Identifies an alliance by the alliance code.
        example: UA
        type: string
    type: object
  org.opentravel.ota._2003._05.AlternatePCCType:
    additionalProperties: false
    properties:
      PseudoCityCode:
        description: 'A unique ID assigned to an office/agency by a reservation system, allowing them to stay anonymous and be identified by location only.'
        example: G7YH
        type: string
      TravelPreferences:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AlternatePCCType.TravelPreferences'
    type: object
  org.opentravel.ota._2003._05.AlternatePCCType.TravelPreferences:
    additionalProperties: false
    properties:
      TPA_Extensions:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AlternatePCCType.TravelPreferences.TPAExtensions'
      VendorPref:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.AlternatePCCType.TravelPreferences.VendorPref'
        type: array
    type: object
  org.opentravel.ota._2003._05.AlternatePCCType.TravelPreferences.TPAExtensions:
    additionalProperties: false
    properties:
      ExcludeAlliancePref:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.AllianceType'
        type: array
      IncludeAlliancePref:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.AllianceType'
        type: array
    type: object
  org.opentravel.ota._2003._05.AlternatePCCType.TravelPreferences.VendorPref:
    additionalProperties: false
    properties:
      Code:
        description: Identifies a company by the company code.
        example: AA
        type: string
      PreferLevel:
        description: 'Used to specify a preference level for something that is or will be requested (e.g. a supplier of a service, a type of service, a form of payment, etc.).'
        example: Only
        type: string
    type: object
  org.opentravel.ota._2003._05.BaggageType:
    additionalProperties: false
    description: 'This element allows user to get baggage information,Free baggage piece is required.'
    properties:
      FreeCarryOn:
        description: If true, allows filtering solution by availability with Free Carry-On baggage - available on Main Fare, Main Fare Leg, Flex Fares, Flex Fares Leg.
        example: true
        type: boolean
      FreePieceRequired:
        description: 'If true, a free piece is required.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.BrandCodePrefType:
    additionalProperties: false
    description: Indicates brand code preferences.
    properties:
      Code:
        description: The brand code of the company.
        example: AA
        type: string
      PreferLevel:
        description: 'Used to specify a preference level for something that is or will be requested (e.g. a supplier of a service, a type of service, a form of payment, etc.).'
        example: Only
        type: string
    type: object
  org.opentravel.ota._2003._05.BrandFiltersType:
    additionalProperties: false
    description: Describes brand filters.
    properties:
      Brand:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.BrandCodePrefType'
        type: array
      NonBrandedFares:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.BrandFiltersType.NonBrandedFares'
        type: array
    type: object
  org.opentravel.ota._2003._05.BrandFiltersType.NonBrandedFares:
    additionalProperties: false
    properties:
      PreferLevel:
        description: 'Used to specify a preference level for something that is or will be requested (e.g. a supplier of a service, a type of service, a form of payment, etc.).'
        example: Only
        type: string
    type: object
  org.opentravel.ota._2003._05.BrandedFareIndicatorsBase:
    additionalProperties: false
    description: Set of branded fare switches and preferences for whole flexible fare.
    properties:
      BrandFilters:
        $ref: '#/definitions/org.opentravel.ota._2003._05.BrandFiltersType'
    type: object
  org.opentravel.ota._2003._05.ClassOfServiceElemType:
    additionalProperties: false
    description: Requested booking code for whole main fare.
    properties:
      Code:
        description: 'This parameter is used to specify the class of service (RBD),to apply to whole itinerary. Multiple class of services can be requested for the whole itinerary.'
        example: E
        type: string
      PreferLevel:
        description: 'Used to specify a preference level for something that is or will be requested (e.g. a supplier of a service, a type of service, a form of payment, etc.).'
        example: Only
        type: string
    type: object
  org.opentravel.ota._2003._05.CodeShareIndicator:
    additionalProperties: false
    properties:
      ExcludeCodeshare:
        description: 'If true, codeshares will be excluded.'
        example: true
        type: boolean
      KeepOnlines:
        description: 'If true, online codeshares will be kept.'
        example: false
        type: boolean
    type: object
  org.opentravel.ota._2003._05.CompanyNamePrefType:
    additionalProperties: false
    description: Specify vendors to include and exclude from the response.
    properties:
      Code:
        description: A company code used to identify a specific company.
        example: AA
        type: string
      CodeContext:
        description: 'Identifies the context of the identifying code, such as DUNS, IATA or internal code, etc.'
        example: IATA
        type: string
      CompanyShortName:
        description: Short name for the operating airline.
        example: UA
        type: string
      PreferLevel:
        description: 'Used to specify a preference level for something that is or will be requested (e.g. a supplier of a service, a type of service, a form of payment, etc.).'
        example: Only
        type: string
      Type:
        description: Marketing or Operating carrier.
        example: Marketing
        type: string
      content:
        description: 'Identifies the context of the identifying code, such as DUNS, IATA or internal code, etc.'
        example: IATA
        type: string
    type: object
  org.opentravel.ota._2003._05.CompanyNameType:
    additionalProperties: false
    description: 'Identifies the company that is associated with the UniqueID.'
    properties:
      Code:
        description: 'Identifies a company by the company code. Customer code.'
        example: TN
        type: string
      CodeContext:
        description: 'Identifies the context of the identifying code, such as DUNS, IATA or internal code, etc.'
        example: IATA
        type: string
      CompanyShortName:
        description: 'Used for Character Strings, length 1 to 64. Short name for the operating airline.'
        example: LH
        type: string
      TravelSector:
        description: Code used to indicate the travel sector (air, car, hotel, cruise) associated with the trips. Refer to OTA Code List Travel Sector (TVS).
        example: air
        type: string
    type: object
  org.opentravel.ota._2003._05.ConnectionType:
    additionalProperties: false
    description: 'The travel connection location - for example, air uses the IATA 3 letter code.'
    type: object
  org.opentravel.ota._2003._05.DiversityControlType:
    additionalProperties: false
    description: 'These parameters control how IntellSell should select itineraries based not necessarily on cheapest price, but also on other criteria that guarantee a diverse response.'
    properties:
      Dimensions:
        $ref: '#/definitions/org.opentravel.ota._2003._05.DiversityControlType.Dimensions'
      LowFareBucket:
