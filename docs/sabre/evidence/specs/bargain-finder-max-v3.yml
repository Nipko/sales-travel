        type: boolean
      RetailerRule:
        items:
          $ref: '#/definitions/org.opentravel.ota._2003._05.RetailerRulesType.RetailerRule'
        type: array
    type: object
  org.opentravel.ota._2003._05.RetailerRulesType.RetailerRule:
    additionalProperties: false
    properties:
      Code:
        description: Specific rule retailer code.
        example: ABCD
        type: string
    type: object
  org.opentravel.ota._2003._05.RoutingDefinitionType:
    additionalProperties: false
    description: The definition of a routing.
    properties:
      AddWildcards:
        description: 'If true, wildcards will be automatically inserted between each two leg (RoutingLeg) elements. Will be set to ''''false'''' if not present.'
        example: true
