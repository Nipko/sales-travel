        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Indicators.ResTicketing'
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Indicators.MinMaxStay:
    additionalProperties: false
    description: 'If set to true, fares that have a min/max stay can be included in the responses.'
    properties:
      Ind:
        description: 'If true, fares that have a min/max stay can be included in the responses.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Indicators.RefundPenalty:
    additionalProperties: false
