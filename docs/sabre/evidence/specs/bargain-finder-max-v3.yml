  org.opentravel.ota._2003._05.RoutingLegType:
    additionalProperties: false
    description: The definition of individual routing legs. At least one leg must be present.
    properties:
      ConnectPoint:
        items:
          description: 'Three to Five character airport code, wildcard character "*" "?" "+" "." are allowed.'
          example: DXB
          type: string
        type: array
      InboundCarrier:
        items:
          description: 'Two or three character airline code, wildcard character "\*" is allowed'
          example: BA
          type: string
        type: array
    type: object
  org.opentravel.ota._2003._05.SourceType:
    additionalProperties: false
    description: This holds details regarding the requestor. It may be repeated to also accommodate the delivery systems.
    properties:
      PseudoCityCode:
        description: A pseudo city code can be a three-character all-alpha PCC assigned to airline/GSA agents (see All-Alpha above) or a four-character alpha-numeric PCC assigned to travel agencies. This code is used to uniquely identify the location or agency making bookings in PSS.
        example: G6RH
        type: string
      RequestorID:
        $ref: '#/definitions/org.opentravel.ota._2003._05.UniqueIDType'
    type: object
  org.opentravel.ota._2003._05.StopoverType:
    additionalProperties: false
    description: Requested stopover informations
    properties:
      DepartureDateTime:
        description: 'The date and time of the departure. This date should be the form YYYY-MM-DDTHH:MM:SS.'
        example: '2024-03-20T20:30:40'
        type: string
      Stay:
        description: Extension of the Stopover section. Indicates the amount of nights between connections. It is possible to indicate min and max timeframes (hours). The information is related to the stay at the stopover point.
        $ref: '#/definitions/org.opentravel.ota._2003._05.StopoverType.Stay'
      DepartureWindow:
        description: The window of time during which the flight can depart. This should be in the form HHMMHHMM.
        example: '20402150'
        type: string
      StopoverPoint:
        $ref: '#/definitions/org.opentravel.ota._2003._05.StopoverType.StopoverPoint'
    type: object
  org.opentravel.ota._2003._05.StopoverType.Stay:
    type: object
