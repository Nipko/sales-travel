  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions:
    additionalProperties: false
    description: 'Additional elements and attributes to be included if required, per Trading Partner Agreement (TPA).'
    properties:
      BrandedFareIndicators:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.BrandedFareIndicators'
      Indicators:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Indicators'
      PointOfSaleOverride:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PointOfSaleOverrideType'
      PointOfTicketingOverride:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PointOfTicketingOverrideType'
      Priority:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority'
      PrivateFare:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.PrivateFare'
      PublicFare:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.PublicFare'
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.BrandedFareIndicators:
    additionalProperties: false
    properties:
      BrandFilters:
        $ref: '#/definitions/org.opentravel.ota._2003._05.BrandFiltersType'
      ItinParityBrandlessLeg:
        description: 'If true, brandless legs in multiple brands upsell solutions are allowed.'
        example: true
        type: boolean
      ItinParityFallbackMode:
        description: 'Fallback mode for Multiple Branded Fares with itinerary parity, when no itinerary parity solutions has been found. Possible FallBack modes to be used - LowestSingle (no upsell options only lowest single possible branded solutions) or Leg (Upsells generated using leg parity mode).'
        example: LowestSingle
        type: string
      MultipleBrandedFares:
        description: 'If true, multiple brand options will be returned per itinerary.'
        example: true
        type: boolean
      ParityMode:
        description: This is a parity mode for multiple branded fares. ParityMode and ItinParityFallbackMode parameters are optional. When specifying the ParityMode=Itin at the request level without specifying the ItinParityFallbackMode, then the default fallback mode in the BFM rule level will be applied. Possible fallback modes - LowestSingle (no upsell options only lowest single possible branded solutions) or Leg (upsells generated using leg parity mode).
        example: Leg
        type: string
      ParityModeForLowest:
        description: 'If set to `Leg` or `Itin`, the given parity mode will be applied to the cheapest branded fare solution. If not specified, no parity (`None`) is applied to the cheapest branded fare solution. This string only works with the `MultipleBrandedFares` feature.'
        enum:
          - Leg
          - Itin
          - None
        type: string
      ReturnBrandAncillaries:
        description: 'If true, ancillaries from the ATPCO Branded Fares Feature Table 166 will be returned in the response.'
        example: true
        type: boolean
      SingleBrandedFare:
        description: 'If true, a single brand option will be returned per itinerary.'
        example: true
        type: boolean
      UpsellLimit:
        description: This indicates the maximum number of requested branded upsells.
        example: 20
        type: integer
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Indicators:
    additionalProperties: false
    description: 'This element restricts fares which can be returned in response. If a customer passes this element, all its children should be specified.'
    properties:
      MinMaxStay:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Indicators.MinMaxStay'
      RefundPenalty:
