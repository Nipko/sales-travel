      Ind:
        description: 'If true, fares that have a refund penalty can be included in the response.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Indicators.ResTicketing:
    additionalProperties: false
    description: 'If set to true, fares that have a reservation/ticketing can be included in the responses.'
    properties:
      Ind:
        description: 'If true, fares that have a reservation/ticketing can be included in the responses.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority:
    additionalProperties: false
    description: This element governs how flights are returned. A user can use a priority of 1-9 to make this determination.
    properties:
      DirectFlights:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority.DirectFlights'
      Price:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority.Price'
      Time:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority.Time'
      Vendor:
        $ref: '#/definitions/org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority.Vendor'
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority.DirectFlights:
    additionalProperties: false
    description: Prefer itineraries that have less connections.
    properties:
      Leg:
        description: Which leg is most significant one? If inconclusive this will continue comparisons segment by segment starting from the beginning of itinerary.
        example: 2
        type: integer
      Priority:
        description: The priority of itineraries that have less connections.
        example: 2
        type: integer
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority.Price:
    additionalProperties: false
    description: Prefer cheaper itineraries in the returned results.
    properties:
      Priority:
        description: The priority of the cheaper itineraries in the results.
        example: 1
        type: integer
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority.Time:
    additionalProperties: false
    description: Prefer itineraries departing closer to requested departure time
    properties:
      Priority:
        description: The priority of itineraries that depart closer to the requested departure time.
        example: 1
        type: integer
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.Priority.Vendor:
    additionalProperties: false
    description: Promote certain marketing carriers over all the others in returning results. (configured in rules).
    properties:
      Priority:
        description: The priority of certain marketing carriers in the returned results.
        example: 1
        type: integer
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.PrivateFare:
    additionalProperties: false
    description: This element finds only private fares.
    properties:
      Ind:
        description: 'If true, then only private fares will be returned.'
        example: true
        type: boolean
    type: object
  org.opentravel.ota._2003._05.PriceRequestInformationType.TPAExtensions.PublicFare:
    additionalProperties: false
    description: This element finds only public fares.
    properties:
      Ind:
        description: 'If true, then only public fares will be returned.'
        example: true
        type: boolean
    type: object
 
  org.opentravel.ota._2003._05.QualifierType:
    additionalProperties: false
    properties:
      Name:
        description: The name of the particular qualifier, this can be QCI (Qantas Corporate Identifier Number) or ABN (Australia Business Number). Those qualifiers allow to get special offers.
        example: ABN
        minLength: 1
        maxLength: 128
        type: string
      Value:
        description: For the ABN qualifier the value could be 19138761111 and the below example is valid for the QCI.
        example: YQO
        minLength: 1
        maxLength: 128
        type: string
    required:
      - Name
      - Value
    type: object
  org.opentravel.ota._2003._05.RequestSpecifiedLocationType:
    additionalProperties: false
    description: The list of alternate origin cities to be searched.
    properties:
      LocationType:
        description: Location type for specified LocationCode. A - for airport; C - for city. If "LocationType" not specified it defaults to city.
        example: A
        type: string
    type: object
  org.opentravel.ota._2003._05.RetailerRulesType:
    additionalProperties: false
    properties:
      Force:
        description: 'If true, only fares with a matched Business Rule containing the specified Retailer Rule Qualifier will be returned.'
