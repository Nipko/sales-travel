      Nights:
        description: Specifies the break between the next connection. Indicates the number of nights spent at the stopover point.
        example: 2
        type: integer
      MinHours:
        description: Specifies the minimum hours of stay during the break between the next connection.
        example: 10
        type: integer
      MaxHours:
        description: Specifies the maximum hours of stay during the break between the next connection.
        example: 72
        type: integer
    additionalProperties: false
  org.opentravel.ota._2003._05.StopoverType.StopoverPoint:
    additionalProperties: false
    description: 'The stopover point - for example, air uses the IATA 3 letter code.'
    properties:
      LocationCode:
        description: The unique code used to identify the location.
        example: JFK
        type: string
      LocationType:
        description: The type of the location the stopover happens in. 'A' or 'C' value.
        example: A
        type: string
    type: object
  org.opentravel.ota._2003._05.TaxCodeAmountType:
    additionalProperties: false
    description: Specify tax amount and code.
    properties:
      Amount:
        description: The total amount of the tax.
        example: 220
        type: number
      TaxCode:
        description: Identifies the code for the tax.
        example: VAT
        type: string
    type: object
  org.opentravel.ota._2003._05.TaxCodeType:
    additionalProperties: false
