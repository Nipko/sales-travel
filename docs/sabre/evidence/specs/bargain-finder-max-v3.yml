        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.LongConnectPoints'
      LongConnectTime:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.LongConnectTime'
      LowCostCarriersProcessing:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.LowCostCarriersProcessing'
      NDCIndicators:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NDCIndicators'
      NumTrips:
        $ref: '#/definitions/org.opentravel.ota._2003._05.NumTripsType'
      NumTripsWithRouting:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.NumTripsWithRouting'
      OnlineIndicator:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.OnlineIndicator'
      PreferNDCSourceOnTie:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.PreferNDCSourceOnTie'
      RetailerRules:
        $ref: '#/definitions/org.opentravel.ota._2003._05.RetailerRulesType'
      SellingLevels:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.SellingLevels'
      SettlementMethod:
        description: This overrides the settlement method. Supported codes are BSP ARC TCH GEN (Generic TAT) RUT (Russian TAT) PRT (Philippines TAT) SAT (SATA) KRY (Killroy).
        example: KRY
        type: string
      SeatSelection:
        $ref: '#/definitions/org.opentravel.ota._2003._05.FreeSeatSelectionAndInfoType'
      Taxes:
        $ref: '#/definitions/org.opentravel.ota._2003._05.ExchangeTravelPreferencesTPAExtensionsType.Taxes'
      TicketingSumOfLocals:
        $ref: '#/definitions/org.opentravel.ota._2003._05.AirSearchPrefsType.TPAExtensions.TicketingSumOfLocals'
