      TaxCode:
        description: Identifies the code for the tax.
        example: VAT
        type: string
    type: object
  org.opentravel.ota._2003._05.TransactionType:
    additionalProperties: false
    properties:
      AirStreaming:
        $ref: '#/definitions/org.opentravel.ota._2003._05.TransactionType.AirStreaming'
      CompressResponse:
